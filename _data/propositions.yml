- id: ee-chef-doeuvre
  theme: École et entreprise
  titre: "Le chef-d'œuvre de la voie professionnelle devient une commande réelle, évaluée et montrable"
  explication: "En dernière année de CAP et de bac pro, le chef-d'œuvre porte sur une commande réelle d'une entreprise, d'une collectivité ou d'une association, trouvée par l'animateur de bassin ou la branche, jamais par la famille. Il est défendu à l'oral devant un jury qui inclut le commanditaire et donne une attestation détaillée à joindre à Parcoursup et au CV, sans heure supplémentaire."
  preuves:
    - "Le chef-d'œuvre actuel est jugé « laborieux » (Assemblée nationale, 2025) ; les preuves sont faibles."
    - "Aux États-Unis, des projets guidés ont porté la réussite à l'examen AP de 37 % à 45 % (3 645 élèves, Saavedra et al., 2022)."
    - "Coût : nul en heures ; 0,3 M€ une fois pour l'évaluation par la DEPP (hypothèse GT)."
  note: EDUCATION-note-ecole-entreprise.pdf
  statut: proposition
  maj_le: 2026-11-23
  sujets: [orientation]
  issue_de: "Note « Apprendre avec ceux qui savent : écoles, entreprises et seniors » (novembre 2026), C1"

- id: ee-seul-puis-ia
  theme: École et entreprise
  titre: "D'abord seul, puis plus vite avec l'IA"
  explication: "Les bases s'évaluent sur table, sans IA, au collège, au lycée et en alternance (en voie professionnelle, gestes en atelier compris). Au lycée et en voie pro, une partie des travaux de projet peut être faite avec l'IA, déclarée puis expliquée à l'oral sans elle ; aucune épreuve nouvelle n'est créée, et les épreuves de projet intègrent la déclaration d'usage de l'IA à partir de la session 2032."
  preuves:
    - "En Turquie, l'accès libre à ChatGPT a fait perdre 17 % à l'examen passé sans IA, perte évitée avec un tuteur qui guide (Bastani et al., PNAS 2025)."
    - "Au Nigeria, six semaines de cours encadrés avec l'IA ont accru le niveau en anglais de 0,23 écart-type (De Simone et al., 2025)."
    - "Coût : nul (circulaire de rentrée 2028 et formation continue courte existante)."
  note: EDUCATION-note-ecole-entreprise.pdf
  statut: proposition
  maj_le: 2026-11-23
  sujets: [ecrans]
  issue_de: "Note « Apprendre avec ceux qui savent : écoles, entreprises et seniors » (novembre 2026), C2"

- id: ia-diplome-ia
  theme: IA, jeunes et emploi
  titre: "Enseigner l'usage professionnel de l'IA dans tous les diplômes de CAP, bac pro et BTS"
  explication: "L'usage professionnel de l'IA (devis, diagnostic, relation client, maintenance) entre dans les référentiels de toutes les spécialités, tertiaires et de production. L'épreuve se fait en deux temps, d'abord sans IA puis la même tâche avec l'IA, avec mention sur le diplôme (session 2029 pour le BTS, 2030 pour le bac pro), et chaque professeur de voie professionnelle suit une à deux journées de formation par an. Le financement passe par le volet enseignement de la mesure N°81 et le budget de formation continue existant."
  preuves:
    - "Avec un assistant d'IA, la productivité des travailleurs les moins expérimentés a crû de 34 %, contre 14 % en moyenne (Brynjolfsson, Li et Raymond, 2025 ; étude sur l'outil, pas sur une formation)."
    - "L'IA utilisée sans cadre pédagogique réduit de 17 % la performance sans IA (Bastani et al., 2025), d'où l'épreuve en deux temps."
    - "Chez 133 avocats en brevets suivis trois mois, l'IA améliore le travail de tous pendant l'usage, mais seuls les expérimentés font mieux ensuite sans l'outil (+0,45 écart-type) ; les débutants n'en gardent rien en moyenne (Autor et al., 2026) : d'où l'apprentissage du métier d'abord."
    - "En France, 69 % des salariés ne sont ni encouragés, ni équipés, ni formés à l'IA par leur employeur, contre 44 % aux États-Unis (Bergeaud et Bunel, LIFT, 2026) : l'école est le seul lieu sûr de cet apprentissage."
    - "Coût : à chiffrer (formation continue, licences des outils, attestation 2027)."
  note: EDUCATION-note-ia-jeunes-v7.pdf
  statut: à chiffrer
  maj_le: 2026-11-23
  sujets: [emploi]
  issue_de: "Note « L'IA et les jeunes » v7 (novembre 2026), P1"

- id: ia-formation-smic
  theme: IA, jeunes et emploi
  titre: "20 000 places par an de formation qualifiante payée au Smic, avec un employeur engagé à recruter"
  explication: "À partir de septembre 2028, 20 000 places par an sont financées pour les jeunes de moins de 26 ans sans CDI sortis de formation depuis moins de trois ans, en priorité sans diplôme. La formation longue (environ 6,2 mois) est payée au Smic, construite avec un employeur partenaire engagé à recruter, vers les métiers en tension et de production (N°80) ; les organismes sont payés en partie selon l'emploi à 12 mois."
  preuves:
    - "Aux États-Unis, les programmes sectoriels adossés aux employeurs augmentent les revenus de +40 % en année 3 pour Year Up et de +11 à 12 % jusqu'aux années 5 à 7 pour WorkAdvance (essais randomisés, Katz et al., 2020, p. 7)."
    - "En France, le PIC n'a donné que +3 points d'accès à l'emploi aux jeunes, contre +9 en moyenne (comité scientifique du PIC, 2025, p. 5, évaluation non expérimentale)."
    - "Sur plus de 200 évaluations, les formations pour demandeurs d'emploi n'ont presque aucun effet la première année et deviennent positives deux à trois ans après (Card, Kluve et Weber, 2018) : juger le dispositif sur l'emploi à 12 mois ne suffit pas."
    - "Coût : environ 22 100 € par place, soit 0,44 Md€ par an pour 20 000 places, financé par la fin de l'aide aux employeurs d'apprentis au-delà de bac+2 (calcul GT)."
  note: EDUCATION-note-ia-jeunes-v7.pdf
  statut: proposition
  maj_le: 2026-11-23
  sujets: [emploi]
  issue_de: "Note « L'IA et les jeunes » v7 (novembre 2026), P5"

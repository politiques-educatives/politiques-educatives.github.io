- id: tuteur-public
  theme: Tuteur IA
  titre: "Déployer un tuteur IA public et vocal qui guide l'élève sans donner la solution"
  explication: "Plutôt que des cours d'IA, l'État commande, pour tous les élèves, un tuteur vocal à indices gradués qui ne livre jamais la solution avant une tentative, avec un volet orientation de la 6e à la terminale. Dans des programmes encadrés, ces tuteurs ont amélioré les résultats d'environ 0,3 écart-type au Nigeria et au Ghana (De Simone et al., 2025 ; Henkel et al., 2024), davantage chez des étudiants de physique sur un test immédiat (Kestin et al., 2025), quand l'IA en accès libre réduit de 17 à 24 % les notes aux examens sans elle (Bastani et al., 2025 ; Strömberg, Lei et Wu, 2026). Il est acheté en quatre lots, payés en partie aux résultats."
  preuves:
    - "Dans des programmes encadrés, les tuteurs qui guident sans donner la réponse ont amélioré les résultats d'environ 0,3 écart-type au Nigeria et au Ghana (De Simone et al., 2025 ; Henkel et al., 2024). Sans programme encadré, la personnalisation par IA n'a rien apporté en Chine rurale (Dang et Do, 2026)."
    - "L'accès libre à l'IA fait baisser les notes aux examens passés sans elle de 17 à 24 % (Bastani et al., 2025 ; Strömberg, Lei et Wu, 2026)."
  note: ""
  statut: proposition
  maj_le: 2026-11-22
  sujets: [ecrans]
  issue_de: "Note sur un tuteur IA pour l'Éducation nationale (octobre 2026)"

- id: tuteur-marche
  theme: Tuteur IA
  titre: "Acheter le tuteur IA en quatre lots séparés, payés en partie aux résultats"
  explication: "Après le retard d'un an de MIA Seconde, commandé 2,8 M€ en 2022 sans résultats publiés (Next, 2024), le marché sépare conception pédagogique et garde-fous, accès aux modèles, voix et données d'orientation. L'accès passe par l'API publique Albert ou, d'ici là, un marché sécurisé, et la voix par des modèles français ouverts. Remplaçable sous trois mois, le modèle est remis en concurrence tous les 12 à 24 mois, et 20 à 30 % du paiement dépend des résultats mesurés par un évaluateur indépendant."
  preuves:
    - "MIA Seconde, commandé en 2022 pour 2,8 M€ sur trois ans, a été livré avec un an de retard, sans résultats publiés (Next, 2024)."
  note: ""
  statut: proposition
  maj_le: 2026-11-22
  sujets: [ecrans]
  issue_de: "Note sur un tuteur IA pour l'Éducation nationale (octobre 2026)"

# ---------- Ce que le livret ne dit pas encore aux jeunes (22/11/2026) : research/26-lacunes-jeunes (protocole, ledgers, un cas étranger par proposition)
# Textes : Gemini 4 Carbon à partir des fiches de recherche ; preuves reprises des fiches (chiffres vérifiés dans les ledgers).
- id: j-emploi-tutore
  theme: Premier emploi des jeunes
  titre: "Financer six mois d'emploi tutoré en entreprise après 6 à 12 mois sans emploi"
  explication: "Dans le contrat d'engagement jeune, l'État cofinance un emploi de six mois avec tuteur en entreprise privée pour les jeunes sans emploi ni formation depuis 6 à 12 mois, à environ 7 250 € par place (calcul du GT). En entreprise privée, un contrat aidé relève de 23 points l'emploi non aidé deux ans et demi après (Cour des comptes, 2018, p. 140). Comme il ne crée que 0,1 emploi net par embauche (Cour des comptes, 2018, p. 141), il cible ces seuls jeunes."
  preuves:
    - "Contrats aidés du secteur marchand (CIE) : +23 points d'emploi non aidé deux ans et demi après l'entrée, par rapport à des personnes comparables sans contrat (Cour des comptes, 2018, p. 140)"
    - "Mais 0,1 emploi net créé par contrat financé : la plupart des embauches auraient eu lieu sans aide (Cour des comptes, 2018, p. 141)"
    - "Coût : à chiffrer"
  statut: à chiffrer
  maj_le: 2026-11-22
  sujets: [emploi]
  issue_de: "Ce que le livret ne dit pas encore aux jeunes (GT Éducation, novembre 2026)"

- id: j-prime-conditionnelle
  theme: Premier emploi des jeunes
  titre: "Une prime d'embauche temporaire, versée seulement si l'effectif augmente, quand le chômage des jeunes monte"
  explication: "Le chômage des 15-24 ans atteint 21,0 % au 3e trimestre 2026 (Insee, 2026), mais une aide générale finance à 84 % des embauches qui auraient eu lieu sans elle (Cahuc, Carcillo et Le Barbanchon, 2019, version IZA p. 25). Nous proposons une prime temporaire aux petites entreprises, déclenchée au-dessus d'un seuil de chômage des jeunes et arrêtée à la décrue. Versée uniquement si l'effectif de l'entreprise augmente, elle crée 4,4 fois plus d'emplois à budget égal (Cahuc, Carcillo et Le Barbanchon, 2019, version IZA p. 27)."
  preuves:
    - "Zéro charges (2009, entreprises de moins de 10 salariés) : 84 % des embauches aidées auraient eu lieu sans l'aide (Cahuc, Carcillo et Le Barbanchon, 2019, version IZA p. 25)"
    - "Conditionnée à la hausse de l'effectif, la même enveloppe aurait créé 4,4 fois plus d'emplois (Cahuc, Carcillo et Le Barbanchon, 2019, version IZA p. 27)"
    - "Chômage des 15-24 ans : 21,0 % au 3e trimestre 2026 (Insee, 2026)"
    - "Coût : nul hors période de déclenchement ; seuil et montant à chiffrer"
  statut: proposition
  maj_le: 2026-11-22
  sujets: [emploi]
  issue_de: "Ce que le livret ne dit pas encore aux jeunes (GT Éducation, novembre 2026)"

- id: stages-garantie-rep
  theme: Stages
  titre: "Garantir un stage de 3e et de seconde aux élèves d'éducation prioritaire et ruraux isolés"
  explication: "Deux tiers des stages passent par l'entourage contre 4 % par l'établissement (Guichard, DEPP, 2026), et l'accompagnement seul ne suffit pas (L'Horty, Duguet et Petit, 2012). Préfet et recteur réunissent un vivier de places, d'abord publiques. En REP+, puis en REP et en zone rurale isolée, un référent volontaire et rémunéré attribue une place à chaque élève sans stage à une date butoir, sans tâche ajoutée aux professeurs principaux."
  preuves:
    - "Deux tiers des stages de 3e et de seconde sont trouvés grâce à la famille ou à l'entourage, 4 % grâce à l'établissement (Guichard, DEPP, 2026)"
    - "41 % des enfants d'ouvriers trouvent leur stage sans l'aide de proches, contre 24 % des enfants de cadres (Guichard, DEPP, 2026)"
    - "En REP/REP+, 12 % des stages sont trouvés par l'établissement contre 3 % ailleurs (Guichard, DEPP, 2026)"
    - "Moins de 10 000 des 33 000 offres de la plateforme REP+ pourvues en 2018-2019 (circulaire du Premier ministre, 31/07/2019)"
    - "Accompagnement à la recherche de stage en éducation prioritaire, tirage au sort de classes (550 élèves) : aucun effet sur l'accès au stage, mais 48,8 % contre 38,3 % d'élèves confortés dans leur choix d'orientation (L'Horty, Duguet et Petit, 2012)"
    - "Angleterre : 81 % des placements organisés par l'élève ou sa famille ; le rapport recommande une obligation légale et un service public de mise en relation (Milburn, 2026, p. 15, 50 et 62)"
    - "Coût : à chiffrer (temps d'un référent stages par établissement ; places publiques à coût marginal faible)"
  statut: proposition
  maj_le: 2026-11-22
  sujets: [emploi]
  issue_de: "Ce que le livret ne dit pas encore aux jeunes (GT Éducation, novembre 2026)"

- id: stages-superieur-boursiers
  theme: Stages
  titre: "Garantir un stage aux étudiants boursiers restés sans place à une date butoir"
  explication: "Toute formation exigeant un stage attribue aux boursiers sans solution à une date butoir une place chez ses entreprises partenaires via son service des stages, sans charge nouvelle pour les enseignants-chercheurs. Chaque établissement publie la part de stages fournis et gratifiés. En France, 26 % des étudiants trouvent leur stage par réseau social (SIES, 2017, données Céreq Génération 2010), et un stage durant les études augmente le salaire d'environ 6 % en Allemagne (Margaryan, Saniter, Schumann et Siedler, 2019)."
  preuves:
    - "Allemagne : environ 6 % de salaire en plus après un stage en entreprise pendant les études, estimé en utilisant les stages obligatoires de certains cursus (Margaryan, Saniter, Schumann et Siedler, 2019)"
    - "États-Unis, testing par CV : une expérience de stage augmente de 14 % (2,2 points) le taux de convocation à un entretien (Nunley, Pugh, Romero et Seals, 2015)"
    - "26 % des étudiants trouvent leur stage par leur réseau social ; père en emploi : +7 points de probabilité d'avoir fait un stage (SIES, 2017, données Céreq Génération 2010)"
    - "61 % des sortants de BTS-DUT ont fait un dernier stage court et non gratifié (SIES, 2017)"
    - "Coût : à chiffrer"
  statut: à chiffrer
  maj_le: 2026-11-22
  sujets: [emploi]
  issue_de: "Ce que le livret ne dit pas encore aux jeunes (GT Éducation, novembre 2026)"

- id: bourses-bareme-lineaire
  theme: "Étudiants : bourses et logement"
  titre: "Remplacer les huit échelons de bourses par un barème continu, puis l'indexer sur les prix"
  explication: "Un barème continu remplace les huit échelons et supprime les effets de seuil, sans perte pour les boursiers actuels, avant une indexation sur les prix dans un second temps. L'éligibilité à 1 500 € par an relève jusqu'à 5 points l'inscription et la réussite en master (Fack et Grenet, 2015), alors que les boursiers ont reculé à 662 000 en 2024-2025 (Sénat, 2025). Chiffrée entre 350 et 400 M€ par an (Sénat, avis n° 144, 2025, p. 15), la réforme démarre avec son financement, dont le recentrage à chiffrer des APL étudiantes."
  preuves:
    - "Jusqu'à +5 points d'inscription ou de réinscription pour l'éligibilité à 1 500 € par an, contre les candidats juste au-dessus du seuil (Fack et Grenet, 2015)"
    - "+5 points d'obtention du diplôme pour les entrants en master, jusqu'à +3 points en dernière année, même comparaison (Fack et Grenet, 2015)"
    - "+2 points (13 %) de diplômés en quatre ans et +5 à 8 % de salaire pour environ 711 $ de bourse en plus, contre les étudiants juste au-dessus du seuil ; dépense remboursée par l'impôt en dix ans (Denning, Marx et Turner, 2019)"
    - "662 000 boursiers en 2024-2025, plus bas depuis 2015, recul de 2,6 % en un an (Sénat, 2025)"
    - "31 % des boursiers touchent moins de 150 € par mois (Sénat, 2025)"
    - "Coût : 350 à 400 M€ par an selon le ministère (Sénat, avis n° 144, 2025, p. 15), soit 15 à 17 % des 2,32 Md€ de crédits de bourses 2026 ; gain des financements proposés à chiffrer"
  statut: à chiffrer
  maj_le: 2026-11-22
  sujets: [emploi]
  issue_de: "Ce que le livret ne dit pas encore aux jeunes (GT Éducation, novembre 2026)"

- id: residences-etudiantes-zones-tendues
  theme: "Étudiants : bourses et logement"
  titre: "Céder gratuitement des terrains publics pour loger les étudiants dans les villes très tendues"
  explication: "Dans les villes offrant moins de 5 places sociales pour 100 étudiants, l'État et les universités cèdent gratuitement leurs terrains pour des résidences à loyer plafonné. Toute place supprimée en réhabilitation est compensée, après 11 000 pertes en 2018-2022 (Cour des comptes, 2025). Paris compte 3 places pour 100 étudiants contre 8,2 en moyenne, avec un reste à charge de 375 € dans le privé contre 100 € dans le social. Hausser l'offre contient les loyers (Grislain-Letrémy et Trevien, 2022), avec des objectifs par ville fixés après chiffrage à environ 71 000 € la place (Cour des comptes, 2025)."
  preuves:
    - "Reste à charge après APL à Paris en 2023 : 375 € par mois dans le privé contre 100 € dans le parc social (Cour des comptes, 2025)"
    - "3 places à vocation sociale pour 100 étudiants à Paris contre 13 à Orléans et 8,2 en moyenne nationale (Cour des comptes, 2025)"
    - "Plan 60 000 : 37 435 places livrées en 2018-2022 (62 % de l'objectif), 33 600 nettes (56 %), 11 000 places perdues par les réhabilitations (Cour des comptes, 2025)"
    - "Une hausse d'aide au logement relève le loyer des nouveaux allocataires de 78 centimes par euro, contre une situation sans réforme (Fack, 2006)"
    - "Là où l'offre de studios a augmenté par la construction neuve, les loyers des petits logements ont cessé de monter malgré l'extension des APL (Grislain-Letrémy et Trevien, 2022)"
    - "Coût : À chiffrer ; repère : 4,9 Md€ de construction pour 69 300 places nettes entre 2012 et 2023, dont 607 M€ de subventions directes, soit environ 71 000 € par place (Cour des comptes, 2025, p. 12)"
  statut: à chiffrer
  maj_le: 2026-11-22
  sujets: [emploi]
  issue_de: "Ce que le livret ne dit pas encore aux jeunes (GT Éducation, novembre 2026)"

- id: emplois-etudiants-campus
  theme: "Étudiants : bourses et logement"
  titre: "Créer sur les campus des emplois étudiants plafonnés à 15 heures, d'abord pour les boursiers"
  explication: "Universités et Crous recrutent en priorité des boursiers sur des emplois adaptés aux cours, plafonnés à 15 heures hebdomadaires et cofinancés par l'État, en plus des postes existants. Or 44 % des étudiants travaillent durant l'année (OVE, 2023), ce qui réduit la réussite, surtout au-delà de 16 heures hebdomadaires (Beffy, Fougère et Maurel, 2009). Aux États-Unis, des emplois courts sur le campus augmentent de 3,2 points l'obtention de la licence (Scott-Clayton et Minaya, 2016)."
  preuves:
    - "Sans leur emploi, les étudiants salariés auraient eu 43 points de probabilité de plus de réussir leur année, effet plus fort au-delà de 16 heures par semaine (Beffy, Fougère et Maurel, 2009)"
    - "+3,2 points de licence en six ans pour les participants au Federal Work-Study contre des non-participants comparables ; 11 heures par semaine contre 18 pour les autres étudiants salariés (Scott-Clayton et Minaya, 2016)"
    - "Uruguay, loterie : pas d'effet sur les notes et +4 points d'inscription deux ans après pour les élèves tirés au sort, contre les non-tirés (Le Barbanchon, Ubfal et Araya, 2023)"
    - "44 % des étudiants ont une activité rémunérée pendant l'année (OVE, 2023)"
    - "Coût : À chiffrer"
  statut: à chiffrer
  maj_le: 2026-11-22
  sujets: [emploi]
  issue_de: "Ce que le livret ne dit pas encore aux jeunes (GT Éducation, novembre 2026)"

- id: batiments-inventaire-public
  theme: Bâtiments scolaires
  titre: "Inspecter et publier l'état de chaque école, collège et lycée public bâtiment par bâtiment"
  explication: "L'Assemblée nationale n'a pu obtenir d'état des lieux complet du bâti scolaire (rapport n° 1974, 2023, p. 42-43), et le dossier amiante manque dans la moitié des écoles du panel ministériel (question n° 5405, 2025, citant le ministère). En cinq ans, l'État et les collectivités inspecteront tous les établissements publics pour publier une note de A à D, la température, le CO2, l'amiante et l'énergie. Cet inventaire permettra de cibler les aides sur les besoins réels, même si l'effet propre de la publication reste non mesuré."
  preuves:
    - "L'Assemblée n'a pas pu obtenir un état des lieux complet du bâti scolaire et recommande un observatoire (rapport n° 1974, 2023, p. 42-43)"
    - "54 % des collectivités suivies par ÉduRénov n'ont qu'une vision partielle de leur patrimoine scolaire ; une sur cinq découvre un bâti plus dégradé que prévu (ÉduRénov, 2025, p. 9 ; échantillon non représentatif)"
    - "Le dossier technique amiante, obligatoire, n'existe que dans la moitié des écoles du panel du ministère, contre 100 % exigés (question n° 5405, 2025, citant le ministère)"
    - "En Angleterre, 345 des 1 000 écoles au plus fort besoin n'avaient pas candidaté au programme de reconstruction (NAO, 2023, p. 32)"
    - "Aucune étude causale ne mesure l'effet de la publication elle-même"
    - "Coût : à chiffrer (coût des inspections anglaises CDC non trouvé)"
  statut: à chiffrer
  maj_le: 2026-11-22
  sujets: [formation]
  issue_de: "Ce que le livret ne dit pas encore aux jeunes (GT Éducation, novembre 2026)"

- id: batiments-fonds-chaleur-air
  theme: Bâtiments scolaires
  titre: "Rénover le chauffage, l'air et les sanitaires des écoles prioritaires par redéploiement de crédits"
  explication: "Après l'inventaire national, l'État finance à 90 % l'isolation thermique, la ventilation, les sanitaires et la dépollution des écoles, d'abord en REP+ puis en REP. Intégré au fonds chaleur étendu aux écoles, ce soutien redéploie des crédits d'investissement existants et exclut les dépenses sans effet prouvé. D'ici 2030, 9,4 millions d'élèves subiront de fortes chaleurs (ÉduRénov, 2025), et rénover chauffage et ventilation améliore les résultats dans les districts pauvres, pas dans les districts aisés (Biasi, Lafortune et Schönholzer, 2024)."
  preuves:
    - "Projets de chauffage-ventilation-climatisation : +0,27 écart-type de district (environ +0,09 écart-type élève) dans les districts pauvres, aucun effet dans les districts aisés (Biasi, Lafortune et Schönholzer, 2024)"
    - "Sans climatisation, une année plus chaude de 1 °F réduit l'apprentissage de l'année d'environ 1 %, par rapport au même élève lors d'un autre passage du test (Goodman et al., 2020)"
    - "Quatre ans dans un bâtiment neuf : +0,1 écart-type en maths et environ 4 jours de présence en plus par an, par rapport aux mêmes élèves avant (Lafortune et Schönholzer, 2019)"
    - "Baisser le CO2 de 2 100 à 900 ppm : +12 % de vitesse aux tests et tâches scolaires (Wargocki et al., 2020, revue)"
    - "Contre-exemples : près de 1 400 campagnes texanes sans effet sur les résultats (Martorell et al., 2016) ; Building Schools for the Future sans effet de court terme (Thomson, 2016)"
    - "9,4 millions d'élèves français exposés à 2 à 8 jours de fortes chaleurs par an d'ici 2030, 2 à 5 fois plus qu'en 1976-2005 (ÉduRénov, 2025)"
    - "Coût : à chiffrer ; repères : rénovation 300 à 1 700 €/m² (Sénat, 2023) ; 52 Md€ sur dix ans pour toutes les écoles publiques (estimation ministérielle citée par le Sénat, 2023)"
  statut: à chiffrer
  maj_le: 2026-11-22
  sujets: [formation]
  issue_de: "Ce que le livret ne dit pas encore aux jeunes (GT Éducation, novembre 2026)"

- id: batiments-ddec-perequation
  theme: Bâtiments scolaires
  titre: "Répartir la dotation d'équipement des collèges selon les effectifs, l'origine sociale et le bâti"
  explication: "Figée depuis 2009, la dotation d'équipement de l'État couvre 9,28 % de l'investissement des collèges en Seine-Saint-Denis, contre 84,25 % dans les Ardennes (Cour des comptes, 2023). À budget constant d'environ 280 M€ par an, elle sera répartie selon le nombre de collégiens, leur origine sociale et l'état inventorié du bâti, avec une transition pour les départements perdants. Recommandée par la Cour des comptes (2023, recommandation n° 3), la mesure n'a pas d'évaluation causale mais ne coûte rien."
  preuves:
    - "La DDEC couvre 9,28 % des investissements de la Seine-Saint-Denis contre 15,61 % en moyenne et 84,25 % dans les Ardennes, sur 2015-2019 (Cour des comptes, 2023)"
    - "La Cour des comptes recommande de renforcer la péréquation de la DDEC au profit des départements aux besoins les plus importants (2023, recommandation n° 3)"
    - "Aucune évaluation causale d'une telle réforme"
    - "Coût : nul à enveloppe constante (environ 280 M€ par an, calcul GT d'après la Cour des comptes, 2023, tableau n° 1)"
  statut: proposition
  maj_le: 2026-11-22
  sujets: [formation]
  issue_de: "Ce que le livret ne dit pas encore aux jeunes (GT Éducation, novembre 2026)"

- id: disc-testing-grands-employeurs
  theme: Discriminations à l'embauche
  titre: "Tester chaque année par candidatures fictives les employeurs de plus de 1 000 salariés"
  explication: "À candidature égale, un nom maghrébin reçoit 31,5 % de rappels en moins qu'un nom français (Insee Références, 2023, p. 50). Une autorité indépendante fera tester chaque année par des chercheurs tous les employeurs publics et privés de plus de 1 000 salariés sur l'origine et l'adresse, stages et alternances compris, avant publication des résultats après un délai de correction de douze mois. Ce contrôle sera annuel, car l'effet d'un simple avertissement disparaît après quinze mois (Défenseur des droits, 2019, p. 4 et 8 ; logement)."
  preuves:
    - "22,8 % de rappels pour un nom maghrébin contre 33,3 % pour un nom français, soit 31,5 % de moins, 9 600 candidatures (Insee Références, 2023, p. 50)"
    - "Environ 20 % de réponses en moins dans 103 très grandes entreprises, 17 163 demandes ; près de 30 % avec contrôles (Challe, Chareyron, L'Horty et Petit, 2020, p. 19)"
    - "Courrier d'avertissement après test : écart de 1,49 point contre 11,45 dans le groupe témoin à 9 mois, effet disparu à 15 mois (Défenseur des droits, 2019, p. 4 et 8 ; logement)"
    - "Formation des recruteurs : aucun effet, écart de près de 50 % avant comme après, 202 entreprises formées contre 606 témoins (Challe et al., 2025, p. 3-4)"
    - "CV anonyme : taux d'entretien des candidats de minorités de 9,3 % à 4,7 %, écart creusé de 10,7 points par rapport au CV nominatif (Behaghel, Crépon et Le Barbanchon, 2015 ; IZA 2014, p. 13-14)"
    - "Coût : 80 000 à 100 000 € par campagne de testing sur un critère dans un domaine (Assemblée nationale, rapport n° 1903, 2023, p. 56) ; précédent de 3 M€ ajoutés à la Dilcrah en 2024 ; coût total du programme à chiffrer"
  statut: proposition
  maj_le: 2026-11-22
  sujets: [emploi]
  issue_de: "Ce que le livret ne dit pas encore aux jeunes (GT Éducation, novembre 2026)"

- id: disc-apprentissage-stages
  theme: Discriminations à l'embauche
  titre: "Tester les offres d'apprentissage et de stage et avertir nommément les employeurs qui discriminent"
  explication: "Pour trouver un apprentissage en restauration, il faut contacter 30 établissements avec un nom maghrébin contre 17 avec un nom français (Anne et al., 2025, p. 1), tandis qu'aucun écart n'apparaît chez les apprenties comptables (Anne et al., 2024, p. 2). L'État fera tester chaque année un échantillon d'offres de stage et d'apprentissage sur les plateformes publiques, d'abord dans les secteurs en tension. Les employeurs présentant un écart recevront un courrier nominatif, efficace à neuf mois (Défenseur des droits, 2019, p. 4), avant un nouveau test."
  preuves:
    - "Apprentissage en restauration : 17 restaurants contactés pour une réponse positive avec un nom français contre 30 avec un nom maghrébin, écart relatif de 46 %, 947 restaurants (Anne et al., 2025, p. 1)"
    - "Apprenties comptables : pas d'écart selon l'origine, 2 000 PME parisiennes (Anne et al., 2024, p. 2)"
    - "47 % des 18-34 ans jugent les discriminations fréquentes dans la recherche de stage (Défenseur des droits et OIT, 2021, p. 4)"
    - "Courrier d'avertissement : plus d'écart significatif à 3 et 9 mois dans les agences averties, contre un écart constant chez les témoins (Défenseur des droits, 2019, p. 4)"
    - "Coût : 80 000 à 100 000 € par campagne sur un critère dans un domaine (Assemblée nationale, rapport n° 1903, p. 56) ; coût annuel selon le nombre de secteurs à chiffrer"
  statut: à chiffrer
  maj_le: 2026-11-22
  sujets: [emploi]
  issue_de: "Ce que le livret ne dit pas encore aux jeunes (GT Éducation, novembre 2026)"

- id: lfi-heures-dues
  theme: Temps des professeurs
  titre: "Placer réunions et formations hors cours, créer un vivier de remplaçants volontaires et publier les heures perdues"
  explication: "En 2023-2024, 9 % des heures ne sont pas assurées au collège public, dont un tiers pour motifs institutionnels, et le remplacement court couvre 11,7 % des besoins (Cour des comptes, 2025, p. 11, 14, 47-48). Réunions et formations passent hors cours, sur les journées prévues ou rémunérées, et les heures perdues sont publiées chaque trimestre. Un vivier de remplaçants volontaires payés à l'heure est créé sans heure imposée, les retraités restant un appoint après leur faible réponse en 2024 (Cour des comptes, 2025, p. 96)."
  preuves:
    - "9 % des heures d'enseignement non assurées dans les collèges publics en 2023-2024, dont 8 % par non-remplacement ; 11 % en éducation prioritaire contre 8 % ailleurs (Cour des comptes, 2025, p. 14)"
    - "Les absences institutionnelles (formation, concours, projets) représentent 36 % des absences de courte durée et le tiers du temps d'enseignement perdu (Cour des comptes, 2025, p. 11)"
    - "Taux d'efficacité du remplacement de courte durée : 11,7 % en 2024-2025, pour une cible ministérielle de 36 % (Cour des comptes, 2025, p. 47-48)"
    - "Coût des heures d'enseignement non assurées dans le second degré public : 2,58 Md€ en 2024, dont environ la moitié pour motifs institutionnels (Cour des comptes, 2025, p. 55)"
    - "En éducation prioritaire, un point d'heures non assurées en plus est associé à 0,061 point de moins à l'écrit du DNB ; effet significatif mais de faible ampleur, corrélation et non effet causal (Cour des comptes, 2025, p. 77)"
    - "Le ministère a sollicité des enseignants retraités en 2024 ; « peu ont répondu à l'appel » (Cour des comptes, 2025, p. 96) : le vivier de retraités est un appoint, pas la solution"
    - "Coût : à chiffrer (heures payées du vivier ; la Cour estime à 119 M€ le coût du remplacement de courte durée en 2024, p. 55) ; repère : 2,58 Md€ d'heures payées mais non assurées"
  statut: proposition
  maj_le: 2026-11-22
  sujets: [formation]
  issue_de: "Inspirée des propositions de Joachim Le Floch-Imad, vérifiées par le GT (novembre 2026)"

- id: lfi-budget-temps
  theme: Temps des professeurs
  titre: "Protéger le temps des fondamentaux et confier les tâches administratives aux personnels de soutien"
  explication: "Au collège, les enseignants à temps plein déclarent 38,7 heures de travail par semaine, contre 39 heures en moyenne dans l'UE (TALIS 2024), alors qu'à Chicago, une double heure d'algèbre a amélioré les résultats des élèves en difficulté (Cortes, Goodman et Nomi, 2015). Inspirée des propositions de Joachim Le Floch-Imad, la mesure impose que toute nouvelle certification ou « éducation à » indique l'heure qu'elle remplace, hors français et mathématiques, et transfère les tâches administratives aux personnels de soutien. Aucune heure de cours n'est imposée en plus aux enseignants, et le transfert devra être chiffré en postes de soutien."
  preuves:
    - "Chicago, double heure d'algèbre pour les élèves sous la médiane : +0,15 écart-type à l'ACT et +8,6 points d'entrée dans le supérieur (Cortes, Goodman et Nomi, 2015, déjà dans research/02)"
    - "Collège : 38,7 h de travail déclarées par semaine par les enseignants à temps plein, contre 39 h en moyenne dans l'UE (TALIS 2024)"
    - "Coût : à budget constant pour la règle de budget-temps ; transfert des tâches à chiffrer (temps de secrétariat et d'assistants d'éducation)"
  statut: proposition
  maj_le: 2026-11-22
  sujets: [formation]
  issue_de: "Inspirée des propositions de Joachim Le Floch-Imad, vérifiées par le GT (novembre 2026)"

- id: lfi-postes-difficiles
  theme: Temps des professeurs
  titre: "Flécher une part des +20 % vers les professeurs expérimentés engagés trois ans en poste difficile"
  explication: "En éducation prioritaire, 11 % des heures de cours sont perdues contre 8 % ailleurs (Cour des comptes, 2025, p. 10 et 64), dans un système où un enseignant du primaire à 10 ans d'ancienneté gagne 17 % de moins que dans l'OCDE (CAE, Note n° 84, 2025, p. 2). Inspirée des propositions de Joachim Le Floch-Imad, la mesure verse une prime annuelle majorée et un bonus mutation aux professeurs expérimentés volontaires pour trois ans en REP+ ou rural isolé, sans engagement imposé. Financée dans les +20 %, elle devra être évaluée par la DEPP, faute d'évaluation causale existante de la prime REP+."
  preuves:
    - "En éducation prioritaire, 11 % des heures de cours ne sont pas assurées en 2023-2024, contre 8 % ailleurs ; les enseignants y sont plus souvent absents pour santé et pour raisons institutionnelles (Cour des comptes, 2025, p. 10 et 64)"
    - "Aucune évaluation causale de la prime REP+ n'a été trouvée"
    - "Un enseignant du primaire à 10 ans d'ancienneté est payé 17 % de moins que ses homologues de l'OCDE (CAE, Note n° 84, 2025, p. 2)"
    - "Coût : à budget constant dans l'enveloppe des +20 % (livret N°65) ; part fléchée et montant de la prime à chiffrer"
  statut: proposition
  maj_le: 2026-11-22
  sujets: [formation]
  issue_de: "Inspirée des propositions de Joachim Le Floch-Imad, vérifiées par le GT (novembre 2026)"


# ---------- Inclusion : piste rétablie le 23/11/2026 (fiche supprimée le 18/11, commit 6e1efb3), en attente de la note inclusion
- id: sante-paliers
  theme: Handicap et inclusion
  titre: "Un dossier unique et deux premiers paliers de soutien décidés par l'école"
  explication: "Piste, en attente de la note inclusion (mi-décembre). Les deux premiers paliers de soutien sont décidés par l'école sans dossier MDPH, et un dossier numérique unique (livret de parcours inclusif, GEVA-Sco, téléservice MDPH) permet à l'établissement de décider des aménagements d'examens de droit commun, avec un coordinateur inclusion déchargé par établissement."
  preuves:
    - "Délai moyen de traitement en MDPH : 4,4 mois au deuxième trimestre 2025, pour 4 mois légaux (CNSA) ; budget de l'école inclusive de 4,74 Md€ pour 139 993 AESH (Sénat, PLF 2026)."
    - "En Finlande, l'école décide seule des deux premiers paliers de soutien, dont bénéficient 26 % des élèves (Statistics Finland, 2024)."
    - "Le livret de parcours inclusif ne couvrait que 164 000 élèves en juin 2023 (Cour des comptes, 2024, p. 38-39)."
  note: ""
  statut: piste
  maj_le: 2026-11-23
  sujets: [inclusion]
  issue_de: "Piste, en attente de la note inclusion (mi-décembre 2026)"

# ---------- Notes finales du 22/11/2026, une fiche par mesure (créées le 23/11/2026)
# Textes repris des notes : temps-de-formation/2026-11-22-note-temps-de-vie-final.md (P1 à P6),
# ecole-entreprise/2026-11-22-note-ecole-entreprise-final.md (A1 à A3, B1, C1, C2), ia-jeunes-emploi/2026-11-22-note-ia-jeunes-v7.md (P1, P5).
- id: tdv-bac-plus-tot
  theme: Gagner du temps de vie
  titre: "Passer le bac un an plus tôt quand on est prêt"
  explication: "Les élèves prêts peuvent faire leur seconde et leur première en un an, ou sauter une classe. L'entrée repose sur des savoirs vérifiés par écrit (notes et évaluations nationales existantes, dont le test de seconde), le conseil de classe le propose à tous les élèves qui remplissent ces critères, et le tutorat des matières sautées est assuré par des enseignants volontaires payés en heures supplémentaires. Le retour dans la classe d'âge est garanti, sans redoublement, et aucun lycée en deux ans pour tous n'est prévu."
  preuves:
    - "Sauter une classe réussit aux élèves sélectionnés sur leurs acquis : ils font nettement mieux que leurs camarades du même âge et pas moins bien que leurs aînés (méta-analyse, Steenbergen-Hu, Makel et Olszewski-Kubilius, 2016, p. 849)."
    - "En Allemagne, le lycée en 8 ans au lieu de 9 pour tous n'a avancé le bac que de 10 mois, avec 3 points de redoublement en plus et 6 points d'entrée à l'université en moins (Huebener et Marcus, 2015 ; Marcus et Zambre, 2016)."
    - "Coût : se finance seul (tutorat de 500 € par élève déjà déduit) ; solde public de 386 M€ par cohorte au central si 5 % d'une cohorte de lycée général choisit ce parcours, 154 M€ à 2 % (calcul GT)."
  note: EDUCATION-note-temps-de-vie.pdf
  statut: proposition
  maj_le: 2026-11-23
  sujets: [orientation]
  issue_de: "Note « Gagner du temps de vie » (novembre 2026), proposition 1"

- id: tdv-bacpro-apprentissage
  theme: Gagner du temps de vie
  titre: "Faire la terminale de bac pro en apprentissage, payée, avec le même diplôme"
  explication: "Un élève de voie professionnelle qui a trouvé un employeur fait sa terminale en apprentissage dans sa spécialité et prépare le même diplôme. Le lycée l'aide à trouver l'employeur, en priorité dans les métiers de production (mesure N°80), et des jours de cours au lycée garantissent un plancher de français et de mathématiques. Le retour au lycée est garanti si le contrat casse, et aucune section n'est fermée au titre de la mesure."
  preuves:
    - "Après un choc industriel, l'emploi revient par les jeunes qui entrent, pas par la reconversion des salariés licenciés : dans les zones américaines frappées par la Chine, le rebond d'après 2010 a profité à de nouvelles générations dans d'autres métiers (Autor et al., 2025). Orienter tôt vers les métiers qui recrutent est donc le levier principal."
    - "Emploi à 12 mois : 74,1 % après un CFA contre 52,8 % après un lycée professionnel ; écart brut, pas un effet causal (InserJeunes)."
    - "En Suède, une année de plus en filière professionnelle n'a rien rapporté en revenus et a accru le décrochage des plus faibles (Hall, 2012) : le bac pro en 4 ans est écarté."
    - "Coût : contrats sur le financement existant de l'apprentissage, pour environ 24 000 élèves ; solde public de -18 M€ au central (-50 à 424 M€), réserve à chiffrer sur les heures des professeurs de lycée professionnel (calcul GT)."
  note: EDUCATION-note-temps-de-vie.pdf
  statut: proposition
  maj_le: 2026-11-23
  sujets: [orientation, emploi]
  issue_de: "Note « Gagner du temps de vie » (novembre 2026), proposition 2"

- id: tdv-bonus-licence
  theme: Gagner du temps de vie
  titre: "Verser un bonus aux boursiers qui finissent leur licence à l'heure, sans aucune perte de bourse"
  explication: "Un bonus est versé aux étudiants boursiers qui valident leur licence dans les temps, ou en quatre ans s'ils travaillent au moins 10 heures par semaine. Il est annoncé dès l'entrée en L1, comme en Norvège, et aucune perte ni réduction de bourse ne peut résulter de la durée des études. Seuls 30,1 % des bacheliers inscrits en L1 obtiennent leur licence en 3 ans (SIES, 2025)."
  preuves:
    - "En Norvège, une remise de prêt d'environ 3 000 dollars pour un diplôme obtenu à l'heure a réduit le retard de 0,8 puis 1,5 semestre, davantage quand elle était connue dès l'entrée (Gunnes, Kirkebøen et Rønning, 2013)."
    - "Aux Pays-Bas, l'amende pour études longues de 3 063 € par an a été abolie au bout d'un an (Riezebos, 2015)."
    - "Coût : environ 18 M€ par cohorte au central (9 à 26 M€), sur le programme 231 ; solde public de 3 M€ au central en comptant les recettes de l'année de travail gagnée (calcul GT)."
  note: EDUCATION-note-temps-de-vie.pdf
  statut: proposition
  maj_le: 2026-11-23
  sujets: [orientation]
  issue_de: "Note « Gagner du temps de vie » (novembre 2026), proposition 3"

- id: tdv-concours-bac3
  theme: Gagner du temps de vie
  titre: "Ouvrir à bac+3 les concours de l'État là où des titulaires d'une licence professionnelle tiennent déjà les emplois"
  explication: "L'État ouvre certains concours externes dès bac+3, pour les seuls métiers administratifs et techniques où des titulaires d'une licence professionnelle tiennent déjà les emplois, corps par corps à partir de 2029, par modification des décrets statutaires. Les concours d'enseignants, les professions réglementées et les parcours appuyés sur des masters recherche restent hors champ, et aucun master n'est fermé."
  preuves:
    - "Le concours enseignant ramené à bac+3 en 2026 a réuni 64 511 inscrits pour 5 200 postes ; il fait l'objet du bilan prévu en 2027."
    - "Coût : aucune dépense nouvelle ; solde à chiffrer après l'inventaire des corps concernés."
  note: EDUCATION-note-temps-de-vie.pdf
  statut: à chiffrer
  maj_le: 2026-11-23
  sujets: [emploi]
  issue_de: "Note « Gagner du temps de vie » (novembre 2026), proposition 4"

- id: tdv-doctorat-shs
  theme: Gagner du temps de vie
  titre: "Financer chaque doctorant en sciences humaines et sociales admis sur concours"
  explication: "Une fois les trois tranches ouvertes, toute admission en doctorat de sciences humaines et sociales s'accompagne d'un financement attribué sur concours par l'école doctorale, avec une 4e année de droit quand le terrain l'exige et l'enseignement payé dès la 1re année (64 heures par an au plus). Aujourd'hui, 50 % des doctorants en sciences humaines sont financés, contre 98 % en sciences exactes, et 35 % de leurs thèses durent 6 ans ou plus (SIES, 2026)."
  preuves:
    - "Thèses soutenues en moins de 40 mois : 59 % en sciences exactes contre 11 % en sciences humaines et sociales (SIES, 2026)."
    - "Coût : tranche 1 de +1 000 contrats doctoraux à la rentrée 2028, environ 83 M€ brut (116 M€ chargés) ; 361 à 482 M€ par an en régime permanent ; tranches 2 et 3 gagées sur une réallocation d'une partie du crédit d'impôt recherche (CAE, Note n° 94, p. 12, montant à chiffrer ; calcul GT)."
  note: EDUCATION-note-temps-de-vie.pdf
  statut: proposition
  maj_le: 2026-11-23
  sujets: [emploi]
  issue_de: "Note « Gagner du temps de vie » (novembre 2026), proposition 5"

- id: tdv-ia-doctorants
  theme: Gagner du temps de vie
  titre: "Un assistant d'IA pour chaque doctorant, par une licence nationale à prix plafonné"
  explication: "L'État met un assistant d'IA de pointe à la disposition des 69 971 doctorants inscrits, par une licence nationale multi-fournisseurs ouverte aux offres européennes, dès la rentrée 2028. Le prix est plafonné à 71 € par mois et par doctorant, l'outil est financé sur une ligne séparée sans lien avec la durée des thèses, et les écoles doctorales fixent des étapes « d'abord seul » sans l'outil."
  preuves:
    - "Aucune étude causale ne porte encore sur des doctorants ; sur la reproduction d'articles publiés, des équipes aidées par l'IA n'ont pas fait mieux que des équipes humaines (Brodeur et al., 2025)."
    - "L'IA en accès libre fait perdre 17 % à l'examen passé sans elle (Bastani et al., 2025)."
    - "Coût : 17 à 60 M€ par an selon le prix retenu, ligne séparée en loi de finances (calcul GT)."
  note: EDUCATION-note-temps-de-vie.pdf
  statut: proposition
  maj_le: 2026-11-23
  sujets: [emploi]
  issue_de: "Note « Gagner du temps de vie » (novembre 2026), proposition 6"

- id: ee-lycee-branche
  theme: École et entreprise
  titre: "Des sections « lycée-branche » de la seconde au BTS, avec le diplôme national"
  explication: "Tout lycée professionnel ou technologique peut ouvrir, par convention avec une branche ou au moins deux employeurs du bassin dont une PME, une section de cinq ans de la seconde au BTS : un parrain d'entreprise par élève, un stage chaque année, des modules de BTS dès la terminale et un entretien d'embauche garanti à la sortie. Les diplômes nationaux et les heures de français et de mathématiques restent inchangés ; la priorité va aux métiers de production (N°80), avec au moins la moitié des places pour des élèves d'éducation prioritaire ou boursiers."
  preuves:
    - "La proximité de l'offre compte : ouvrir une STS dans un lycée accroît d'environ 8 % l'inscription des élèves du secteur, l'effet étant le plus fort pour les élèves de la voie professionnelle et des petites communes (Thebault, IPP, 2025)."
    - "Aux États-Unis, les Career Academies ont relevé le salaire de 11 % par an pendant huit ans, et de 17 % pour les jeunes hommes (Kemple, MDRC, 2008, p. iii)."
    - "À New York, P-TECH a porté à 13 % contre 3 % la part de jeunes hommes diplômés à bac+2, pour un coût proche d'un lycée ordinaire (MDRC, 2023)."
    - "Coût : 3,7 M€ par an en croisière pour 500 sections en 2032 (environ 36 000 lycéens), par redéploiement de crédits de l'Éducation nationale (calcul GT)."
  note: EDUCATION-note-ecole-entreprise.pdf
  statut: proposition
  maj_le: 2026-11-23
  sujets: [orientation, emploi]
  issue_de: "Note « Apprendre avec ceux qui savent : écoles, entreprises et seniors » (novembre 2026), A1"

- id: ee-rencontres-pros
  theme: École et entreprise
  titre: "Quatre rencontres avec des professionnels pour chaque élève, de la 4e à la terminale"
  explication: "Chaque élève des collèges et lycées publics et privés sous contrat rencontre au moins quatre fois des professionnels entre la 4e et la terminale, hors heures de français, de mathématiques et d'atelier. Un animateur régional par bassin, rattaché au service public de l'orientation (N°75), fait venir les entreprises, sans tâche nouvelle pour le professeur principal ; l'éducation prioritaire et les zones rurales sont servies en premier, et la part d'élèves de terminale ayant eu quatre rencontres est publiée par établissement."
  preuves:
    - "Deux tiers des stages de 3e et de seconde sont trouvés par la famille, contre 4 % par l'établissement (DEPP, NI 26.44, 2026)."
    - "Une heure d'intervention d'une scientifique a fait passer de 11 % à 14,5 % la part des filles en filière scientifique sélective (Breda et al., 2023)."
    - "Coût : 15 M€ par an en croisière (300 bassins × 50 000 €), payés par les régions au titre de leur compétence d'information sur les métiers (calcul GT)."
  note: EDUCATION-note-ecole-entreprise.pdf
  statut: proposition
  maj_le: 2026-11-23
  sujets: [orientation]
  issue_de: "Note « Apprendre avec ceux qui savent : écoles, entreprises et seniors » (novembre 2026), A2"

- id: ee-referentiels
  theme: École et entreprise
  titre: "Réviser tous les cinq ans les diplômes professionnels, avec ceux qui les enseignent"
  explication: "Chaque référentiel de CAP, bac pro et BTS est révisé au moins tous les cinq ans, en douze mois au plus, par un panel de trois employeurs dont une PME, trois salariés, trois enseignants et un inspecteur. Chaque révision précise quelles tâches l'IA fait déjà et ce qui s'apprend à la place ; la méthode relève du volet enseignement de la mesure N°81."
  preuves:
    - "Aucune preuve causale : la revue anglaise juge les preuves « limitées » (CAR, 2025, p. 168)."
    - "En Angleterre, les T Levels écrits par des employeurs n'ont atteint que 42 % des entrées prévues (NAO, 2025, p. 4)."
    - "Coût : 0,9 M€ par an (90 révisions × 10 000 €), sur les crédits des commissions et de l'inspection (calcul GT)."
  note: EDUCATION-note-ecole-entreprise.pdf
  statut: proposition
  maj_le: 2026-11-23
  sujets: [emploi]
  issue_de: "Note « Apprendre avec ceux qui savent : écoles, entreprises et seniors » (novembre 2026), A3"

- id: ee-maitre-apprentissage
  theme: École et entreprise
  titre: "Un maître d'apprentissage nommé, formé et reconnu pour chaque apprenti"
  explication: "Dans l'aide à l'embauche d'apprentis maintenue du CAP à bac+2, une part tutorale de 100 € par mois pendant 12 mois n'est versée que si le contrat nomme un maître d'apprentissage formé (une journée), dont au moins la moitié lui revient en prime. La priorité va aux salariés de 55 ans et plus. Mesure portée par le ministère du Travail, sans dépense nouvelle pour l'État, sous réserve que l'aide reste hors de N°82 (arbitrage du 22/11/2026)."
  preuves:
    - "Aux États-Unis, de courtes rencontres structurées entre collègues ont accru les ventes de plus de 15 %, un effet encore visible 20 semaines après, alors qu'une prime liée à la production commune n'a eu qu'un effet passager (Sandvik et al., QJE 2020)."
    - "Le contrat de génération a atteint 20 % de son objectif, avec des binômes souvent « purement statistiques » (Cour des comptes, 2016, p. 61-71)."
    - "Coût : nul pour l'État (au moins 415 M€ par an d'aide existante rendus conditionnels) ; formation des tuteurs 16 M€ par an dans les plafonds des OPCO (calcul GT)."
  note: EDUCATION-note-ecole-entreprise.pdf
  statut: proposition
  maj_le: 2026-11-23
  sujets: [emploi]

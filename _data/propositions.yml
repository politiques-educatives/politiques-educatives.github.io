# Propositions du GT Éducation, une entrée par proposition.
# Champs : id, theme, sujets (hubs), issue_de (note d'origine), titre (une ligne), explication (2-4 phrases reprises des notes), preuves (liste : chiffre + source),
#          note (fichier PDF dans assets/notes/), statut (proposition | piste | à chiffrer), maj_le (AAAA-MM-JJ)
# Règle : chaque chiffre vient d'une note ou d'un dossier de recherche du GT, avec sa source. Aucune position du candidat inventée.

# ---------- Temps des professeurs
- id: heures-service-annuel
  theme: Temps des professeurs
  titre: "Un service annuel plafonné, avec du temps réservé au tutorat et au travail d'équipe"
  explication: "Un service en heures par an, avec un plafond d'heures de cours et une part réservée, inscrite dans l'emploi du temps, au tutorat, à la concertation, à l'orientation et à la formation. Proposé d'abord aux volontaires et aux nouveaux recrutés, avec la revalorisation de 20 % prévue par le programme. En France, tout ce qui n'est pas une heure de cours se paie en heures supplémentaires ou ne se fait pas."
  preuves:
    - "Un certifié doit 18 heures de cours par semaine, un agrégé 15, un professeur des écoles 24 heures plus 108 heures par an (décrets de 2008 et 2014)."
    - "Le contrat écossais fixe une semaine de 35 heures, dont 22,5 heures de cours au plus (SNCT) : 855 heures de cours sur 1 365 heures de travail par an (OCDE, 2026)."
    - "Le second professeur principal de terminale, créé fin 2017, est payé par une indemnité, sans aucune heure dégagée."
  note: EDUCATION-note1-allocation-heures-enseignement.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [formation]
  issue_de: "Note 1 : l'allocation des heures d'enseignement (novembre 2026)"

- id: heures-emploi-du-temps
  theme: Temps des professeurs
  titre: "Un emploi du temps construit par l'établissement, avec le tutorat pendant la journée"
  explication: "Le chef d'établissement répartit le service avec le conseil pédagogique : cours en barrette pour composer des groupes temporaires, une heure de concertation par semaine pour l'équipe de niveau, le tutorat dans la journée et non après la dernière heure, en petits groupes et par des enseignants."
  preuves:
    - "Sur 96 essais randomisés, le tutorat améliore les résultats de 0,37 écart-type, davantage pendant le temps scolaire (0,40) qu'après (0,21), avec des enseignants (0,50) qu'avec des bénévoles (0,21) (Nickow, Oreopoulos et Quan, 2020 ; 0,29 sur 89 essais dans la version publiée en 2024)."
    - "L'effet est plus faible au collège et au lycée ; dans les essais les plus proches d'un déploiement à grande échelle, il n'atteint qu'un tiers à la moitié de celui de l'ensemble des essais, surtout parce qu'il baisse quand le programme grandit (Kraft et al., 2024)."
    - "Les groupes de niveau au sein de la classe gagnent 0,19 à 0,30 écart-type ; les classes séparées par niveau, presque rien (Steenbergen-Hu et al., 2016), mais elles creusent les écarts (Terrin et Triventi, 2023)."
  note: EDUCATION-note1-allocation-heures-enseignement.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [formation]
  issue_de: "Note 1 : l'allocation des heures d'enseignement (novembre 2026)"

- id: heures-dotation
  theme: Temps des professeurs
  titre: "Une dotation calculée selon les élèves et leurs besoins"
  explication: "Calculée en heures de service, selon le nombre d'élèves et la part d'élèves en difficulté aux évaluations nationales, avec une majoration par élève défavorisé sur le modèle du pupil premium. Aujourd'hui, les moyens suivent la structure des classes, pas les besoins des élèves."
  preuves:
    - "La dotation horaire globale d'un collège se calcule à partir des heures de cours dues aux classes, puis le conseil d'administration en vote la répartition."
    - "En Angleterre, le programme national de tutorat est passé à partir de 2021 par les écoles ; ses effets mesurés sont faibles, un mois de progrès au plus (NFER, 2024)."
  note: EDUCATION-note1-allocation-heures-enseignement.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [formation]
  issue_de: "Note 1 : l'allocation des heures d'enseignement (novembre 2026)"

- id: heures-mercredi
  theme: Temps des professeurs
  titre: "Le mercredi matin, décidé par bassin, avec la région et les communes"
  explication: "Le retour à neuf demi-journées se décide avec la région (transports) et les communes (périscolaire), par réseau de transport, et s'accompagne du service annuel."
  preuves:
    - "Le primaire français se fait sur 162 jours, contre 183 dans l'OCDE et 190 en Angleterre."
    - "À la rentrée 2023, 93 % des communes ayant une école publique étaient à la semaine de quatre jours (QE AN n° 3908, 2025) ; la Cour des comptes juge l'organisation du temps scolaire « en décalage avec les besoins des élèves » (2025)."
  note: EDUCATION-note1-allocation-heures-enseignement.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [formation]
  issue_de: "Note 1 : l'allocation des heures d'enseignement (novembre 2026)"

- id: heures-charge
  theme: Temps des professeurs
  titre: "Mesurer chaque année la charge de travail réelle des enseignants"
  explication: "Une enquête annuelle sur le temps de travail des enseignants, comme en Angleterre, pour que l'annualisation ne fasse pas glisser la charge, comme en Écosse. Un plafond seul ne suffit pas."
  preuves:
    - "En Écosse, les enseignants déclarent 46 heures de travail sur une semaine type, 11 de plus que leur semaine contractuelle (UWS pour l'EIS, 2024)."
    - "Un enseignant anglais de collège déclarait 49,3 heures de travail par semaine, contre environ 41 dans l'OCDE (TALIS 2018) ; l'enquête anglaise de 2025 donne 50,1 heures (DfE, 2025)."
  note: EDUCATION-note1-allocation-heures-enseignement.pdf
  statut: proposition
  maj_le: 2026-11-18

# ---------- Gouvernance
  sujets: [formation]
  issue_de: "Note 1 : l'allocation des heures d'enseignement (novembre 2026)"

- id: gouv-recruter
  theme: Gouvernance de l'établissement
  titre: "Recruter une part des enseignants sur projet, d'abord dans les établissements les moins demandés"
  explication: "Une part des postes de chaque établissement pourvue sur profil par le chef d'établissement et le conseil pédagogique, en priorité dans les établissements les moins demandés, avec une prime d'affectation, et une évaluation prévue dès le départ."
  preuves:
    - "Les enseignants sont affectés par le mouvement inter et intra-académique selon un barème de points ; les débutants sont plus souvent affectés en éducation prioritaire (DEPP, 2026)."
    - "Les collèges en difficulté devenus academies de 2002 à 2010, qui changeaient souvent de direction, ont progressé d'environ 0,2 écart-type en quatre ans (Eyles et Machin, 2019) ; ceux convertis après 2010 n'ont pas gardé d'avance (EPI, 2017)."
    - "Le recrutement sur profil, par exemple dans les écoles de Marseille, n'a pas encore été évalué (Cour des comptes, 2024)."
  note: EDUCATION-note2-gouvernance-etablissement.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [formation]
  issue_de: "Note 2 : qui décide dans l'établissement ? (novembre 2026)"

- id: gouv-coordinateurs
  theme: Gouvernance de l'établissement
  titre: "Un coordinateur par discipline et par niveau, avec une décharge de service"
  explication: "Un échelon intermédiaire qui organise les groupes, le tutorat et l'observation entre pairs. En Angleterre, les responsables de discipline et de niveau (middle leaders), payés par des primes de responsabilité, forment cet échelon qui manque en France."
  preuves:
    - "Dans 82 collèges anglais, l'observation mutuelle a gagné 0,07 écart-type au GCSE, et la doubler n'a rien ajouté (Burgess, Rawal et Taylor, 2021) ; l'évaluation officielle du même essai ne trouve aucun effet (EEF, 2017)."
  note: EDUCATION-note2-gouvernance-etablissement.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [formation]
  issue_de: "Note 2 : qui décide dans l'établissement ? (novembre 2026)"

- id: gouv-visite
  theme: Gouvernance de l'établissement
  titre: "Une visite-conseil tous les deux ans pour chaque enseignant, chaque année pour les débutants"
  explication: "Assurée par l'inspecteur ou par des enseignants expérimentés formés à l'observation, avec un plan de formation inscrit dans le service. Après le dernier rendez-vous de carrière, vers la dix-neuvième année de métier, aucune visite de classe n'est obligatoire."
  preuves:
    - "À Cincinnati, une année d'évaluation fondée sur quatre observations, dont trois par des pairs formés, a relevé d'environ 0,10 écart-type les résultats en maths des élèves les années suivantes (Taylor et Tyler, 2012)."
    - "Les quelque 3 650 inspecteurs territoriaux (Cour des comptes, 2022) consacrent environ 30 % de leur activité à l'évaluation des enseignants dans le premier degré, 20 à 30 % dans le second."
  note: EDUCATION-note2-gouvernance-etablissement.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [formation]
  issue_de: "Note 2 : qui décide dans l'établissement ? (novembre 2026)"

- id: gouv-evaluation
  theme: Gouvernance de l'établissement
  titre: "Un corps spécialisé pour évaluer les établissements, appuyé sur la valeur ajoutée"
  explication: "Distinct de l'inspection des enseignants, sur le modèle de l'Ofsted, il s'appuie sur des IVAC et IVAL étendus au-delà du brevet et du bac. La DEPP publie une valeur ajoutée par lycée depuis 1993 et par collège depuis 2022, sans rôle dans l'évaluation des établissements."
  preuves:
    - "Un échec à l'inspection a relevé les résultats des élèves de 0,12 écart-type en maths en primaire (Hussain, 2015) et d'environ 0,1 dans le secondaire (Allen et Burgess, 2012)."
    - "Depuis novembre 2025, l'Ofsted note chaque établissement sur cinq niveaux, domaine par domaine, sans note globale, environ tous les quatre ans."
  note: EDUCATION-note2-gouvernance-etablissement.pdf
  statut: proposition
  maj_le: 2026-11-18

# ---------- Orientation et bac
  sujets: [formation]
  issue_de: "Note 2 : qui décide dans l'établissement ? (novembre 2026)"

- id: orient-4e
  theme: Orientation et bac
  titre: "Orienter dès la 4e, avec un tuteur référent jusqu'en terminale"
  explication: "Le tuteur de l'élève est son référent d'orientation de la 4e à la terminale : un entretien par trimestre, des heures dans son service, une formation sur les filières. Le second professeur principal de terminale, sans heures ni formation, n'a pas marché."
  preuves:
    - "Un tiers des lycées seulement a tenu les deux semaines d'orientation (Cnesco, 2018)."
    - "En Allemagne, un an de mentorat par des étudiants a amélioré de 0,5 écart-type les perspectives des élèves défavorisés (Resnjanskij et al., 2024)."
    - "En fin de 3e, 38,6 % des élèves du public entrent en voie professionnelle, et les premiers vœux y sont les moins souvent satisfaits (58,1 %, contre 87 % en seconde générale ; DEPP, 2025)."
    - "Coût de travail du tuteur référent compté dans le service : 30 à 50 millions d'euros par an (calcul de travail à confirmer)."
  note: EDUCATION-note3-orienter.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [orientation]
  issue_de: "Note 3 : orienter plus tôt, et rendre au bac sa valeur (octobre 2026, mise à jour novembre 2026)"

- id: orient-parents
  theme: Orientation et bac
  titre: "Deux réunions avec les parents des élèves de 4e et de 3e en difficulté"
  explication: "Étendre à toute la 4e et la 3e un dispositif testé en France, pour un coût quasi nul."
  preuves:
    - "Deux réunions avec les parents d'élèves de 3e en difficulté ont réduit de 25 à 40 % le redoublement et le décrochage (Goux, Gurgand et Maurin, 2017)."
    - "Une heure d'intervention d'une scientifique en classe fait passer de 11 % à 14,5 % la part des filles qui entrent dans une formation scientifique sélective (Breda et al., 2023)."
  note: EDUCATION-note3-orienter.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [orientation]
  issue_de: "Note 3 : orienter plus tôt, et rendre au bac sa valeur (octobre 2026, mise à jour novembre 2026)"

- id: orient-gatsby
  theme: Orientation et bac
  titre: "Un cadre national d'orientation mesuré dans chaque établissement, à l'anglaise"
  explication: "Les huit repères Gatsby (information sur les métiers, rencontres avec des employeurs, stages, entretien individuel) sont mesurés dans chaque établissement anglais. Le rapport Milburn propose d'aller plus loin : une norme « prêt pour le travail » inspectée et la publication de ce que deviennent les élèves de chaque établissement."
  preuves:
    - "Les établissements anglais atteignent 6,0 repères sur 8 en moyenne ; ceux qui les atteignent tous comptent 8 % de jeunes sans emploi ni formation en moins, un lien qui n'est pas encore causal (Careers & Enterprise Company, 2024)."
    - "Norme « prêt pour le travail » inspectée par l'Ofsted et obligation légale de stage en entreprise (Milburn, 2026, p. 14-15)."
  note: EDUCATION-note3-orienter.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [orientation]
  issue_de: "Note 3 : orienter plus tôt, et rendre au bac sa valeur (octobre 2026, mise à jour novembre 2026)"

- id: orient-bac
  theme: Orientation et bac
  titre: "Un bac qui départage : épreuves nationales anonymes et admissions conditionnelles"
  explication: "Réduire la part du contrôle continu et faire peser les épreuves terminales de spécialité, corrigées anonymement, dans l'admission. Une proposition d'admission en licence est confirmée en juillet si l'élève atteint une note fixée par la formation dans les spécialités utiles, comme les offres conditionnelles britanniques. Ceux qui n'atteignent pas la barre ont une année préparatoire ou une place en BTS et en BUT."
  preuves:
    - "En 2025, 91,8 % des candidats ont été reçus au bac, 96,4 % dans la voie générale, et 58,8 % avec mention (DEPP, 2025)."
    - "Parmi les bacheliers 2018 inscrits en licence, 46,9 % l'ont obtenue en trois ou quatre ans ; parmi ceux de 2020, 40,3 % (SIES, 2023 et 2025)."
    - "Le passage en deuxième année atteint 70 % pour les bacheliers mention très bien, contre 49,1 % pour l'ensemble des néo-bacheliers en 2024 : le bac contient l'information, mais il ne s'en sert pas."
  note: EDUCATION-note3-orienter.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [orientation]
  issue_de: "Note 3 : orienter plus tôt, et rendre au bac sa valeur (octobre 2026, mise à jour novembre 2026)"

- id: orient-transparence
  theme: Orientation et bac
  titre: "La transparence sur tout le parcours, de la 4e au premier emploi"
  explication: "Mettre bout à bout les données publiques (DEPP, SIES, Parcoursup, InserSup, InserJeunes) pour montrer à un élève de 4e ou de 3e les débouchés de chaque voie, la réussite en licence selon le bac, l'emploi, les salaires et ce que l'IA sait déjà faire de ces métiers. C'est un outil d'égalité des chances, car les familles initiées connaissent déjà les règles que les autres découvrent trop tard. Prototype : la Boussole des formations (onglet Boussole)."
  preuves:
    - "Réussite en licence en 3 ou 4 ans : 46,1 % après un bac général contre 6,5 % après un bac professionnel (SIES, Note Flash 2025-29)."
    - "Emploi à 6 mois : 43 % après un bac pro, 59 % après un BTS (DEPP, InserJeunes, RERS 2025)."
    - "Au Chili, cette transparence a réduit de 4,6 % les choix de filières peu payées chez les jeunes modestes (Hastings, Neilson et Zimmerman, 2015)."
  note: EDUCATION-note3-orienter.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [orientation]
  issue_de: "Proposition 3 du GT : la transparence sur tout le parcours (novembre 2026)"

- id: orient-debouches
  theme: Orientation et bac
  titre: "Publier l'emploi, le salaire et l'exposition à l'IA de chaque formation, master compris"
  explication: "Pour chaque formation de Parcoursup, une note de résilience à l'IA de A à E, à côté du salaire et du taux d'emploi à 30 mois (InserSup), et les postes ouverts dans le bassin. Le rapport Milburn recommande aussi de rendre visibles les salaires des diplômés de chaque formation du supérieur."
  preuves:
    - "Entre novembre 2022 et mars 2026, les embauches en CDI des 21-29 ans ont baissé de 28,3 % dans les métiers les plus exposés à l'IA, contre 7,5 % dans les moins exposés (Palladino, Bergeaud, Bertheau, Bunel et Degos, 2026)."
    - "La Boussole classe les 13 819 formations de Parcoursup 2025 en 39 familles et affiche l'emploi et le salaire de 2 427 masters d'université (InserSup 2026)."
    - "Salaires des diplômés de chaque formation du supérieur rendus visibles (Milburn, 2026, p. 15-16)."
  note: EDUCATION-note3-orienter.pdf
  statut: proposition
  maj_le: 2026-11-18

# ---------- IA, jeunes et emploi
  sujets: [orientation, emploi]
  issue_de: "Note 3 : orienter plus tôt, et rendre au bac sa valeur (octobre 2026, mise à jour novembre 2026)"

- id: ia-master
  theme: IA, jeunes et emploi
  titre: "Un jeune a-t-il vraiment besoin d'un master ? Une licence qui mène à un métier"
  explication: "Interroger les employeurs publics et privés sur leurs vrais besoins en bac+5. Construire une licence qui mène à un métier et finie à temps : stage long ou alternance obligatoire en L3 et développement des licences professionnelles. Réserver le master à la recherche, aux études longues, à la réorientation ou à l'alternance. Le master sert souvent de filtre plus que de compétence : injuste pour les enfants d'ouvriers, coûteux, et il retarde de deux ans l'entrée dans la vie active."
  preuves:
    - "Emploi salarié à 30 mois : 78 % après une licence professionnelle, 69 % après un master, 50 % après une licence générale, 77 % après un master en alternance (InserSup 2026)."
    - "À 26-27 ans, avoir terminé le master plutôt qu'arrêté en dernière année ajoute 15 points à la probabilité d'être cadre, mais seulement 4 % au salaire, pour un emploi presque identique, 90 % contre 87 % (Insee Première n° 2109, juin 2026)."
    - "Le diplôme ne décide du choix final que dans 11 % des recrutements, 22 % pour les cadres, et 73 % des recruteurs auraient pu embaucher un candidat moins diplômé mais plus expérimenté (Dares, enquête Ofer 2016)."
    - "Les enfants d'ouvriers passent de 10 % des étudiants en licence à 6 % en master, contre 31 % à 42 % pour les enfants de cadres ; un master coûte environ 24 500 € par jeune à l'État (RERS 2025)."
    - "Seuls 30 % des étudiants obtiennent leur licence en trois ans (SIES, Note Flash n° 29, novembre 2025)."
  statut: à chiffrer
  maj_le: 2026-11-18
  sujets: [emploi]
  issue_de: "Note IA et jeunes (novembre 2026)"

- id: ia-garantie
  theme: IA, jeunes et emploi
  titre: "Une garantie pour chaque jeune sans emploi ni formation, sur le modèle Milburn"
  explication: "Le rapport Milburn propose une garantie légale d'opportunité et de soutien pour tout jeune de 18 à 24 ans sans emploi ni formation : un emploi, une formation professionnelle, un apprentissage, un stage jusqu'à 12 semaines ou un service civique, un conseiller sous 14 jours et un plan personnel sous 4 semaines. Le gouvernement britannique en soutient le principe. Transposition aux missions locales et au contrat d'engagement jeune à chiffrer (détail : onglet Milburn)."
  preuves:
    - "Aide à l'employeur de 3 000 £ par embauche d'un jeune resté six mois sans emploi ni formation, jusqu'à 7 000 £ pour une petite entreprise, et 2 500 £ par apprenti, pour environ 1,1 milliard de livres par an et 170 000 opportunités (Milburn, 2026, p. 12)."
    - "Kickstart (2020-2022) a ajouté 11 jeunes en emploi non aidé pour 100 participants à 24 mois et rapporté 1,18 £ par livre dépensée (DWP, 2024)."
    - "En France, la Garantie jeunes a relevé l'emploi de 6,3 points à environ 14 mois (évaluation intermédiaire, 2016), sans confirmation sur la seconde cohorte."
    - "Financement proposé : 500 millions de livres en 2027/28, 5,8 milliards par an d'ici 2036/37, pour 440 000 jeunes de plus en emploi durable (Milburn, 2026, p. 25 et 30-31) ; montants non engagés par le gouvernement."
  statut: à chiffrer
  maj_le: 2026-11-18
  sujets: [emploi]
  issue_de: "Note IA et jeunes (novembre 2026)"

- id: ia-observatoire
  theme: IA, jeunes et emploi
  titre: "Un suivi annuel des postes de débutants face à l'IA"
  explication: "L'Observatoire France Travail pourrait publier chaque année les secteurs et territoires où les postes d'entrée reculent face à l'IA, sur le modèle de l'observatoire proposé au Royaume-Uni. Sa première étude, parue le 17 novembre 2026 auprès de 16 000 employeurs, ne porte pas sur les débutants."
  preuves:
    - "Observatoire de l'IA et des jeunes, rapport annuel sur les voies d'entrée qui se ferment, par secteur et par territoire (Milburn, 2026, p. 72-73)."
    - "Embauches en CDI des 21-29 ans : -28,3 % dans le cinquième des métiers les plus exposés à l'IA entre novembre 2022 et mars 2026, une baisse dont une partie vient du télétravail (LIFT, 2026)."
  statut: à chiffrer
  maj_le: 2026-11-18
  sujets: [emploi]
  issue_de: "Note IA et jeunes (novembre 2026)"

- id: ia-bases
  theme: IA, jeunes et emploi
  titre: "De bonnes bases pour tous : les maths jusqu'en terminale, pas d'IA en accès libre avant les fondamentaux"
  explication: "Rétablir les mathématiques jusqu'en terminale pour tous les élèves visant le supérieur, et refuser l'IA en accès libre avant l'acquisition des fondamentaux. Seuil exact à trancher par l'équipe programme, coût à chiffrer."
  preuves:
    - "Les mathématiques sont suivies par 44,8 % des élèves de terminale aujourd'hui (DEPP, 2026)."
    - "L'IA en accès libre fait perdre 17 % à l'examen passé sans elle (Bastani et al., 2025)."
    - "À 15 ans, un tiers des élèves est en difficulté de lecture, contre 15 % en 2000 (DEPP, note d'information 26.40, septembre 2026)."
  statut: à chiffrer
  maj_le: 2026-11-18
  sujets: [emploi, ecrans]
  issue_de: "Note IA et jeunes (novembre 2026)"

- id: ia-marche
  theme: IA, jeunes et emploi
  titre: "Une orientation qui suit le marché du travail, jusqu'à la carte des bacs pro"
  explication: "Afficher sur Parcoursup et en bac pro l'emploi et le salaire à 30 mois, les postes ouverts dans le bassin (France Travail, BMO) et le profil d'exposition à l'IA ; revoir chaque année la carte des bacs pro selon les embauches locales."
  preuves:
    - "50 % des étudiants craignent que l'IA remplace le métier qu'ils visent (OpinionWay, 2026), alors qu'un métier exposé reste porteur, à l'image des diplômés de comptabilité qui sont 79 % en emploi à 30 mois (InserSup 2026, calculs GT Éducation)."
    - "À 20 ans, seuls 20 % des jeunes Français sont en emploi, contre environ 60 % en Allemagne, au Royaume-Uni et aux États-Unis (CAE, Bozio et Wasmer, 2026)."
  statut: à chiffrer
  maj_le: 2026-11-18

# ---------- Santé mentale et écrans
  sujets: [emploi]
  issue_de: "Note IA et jeunes (novembre 2026)"

- id: tuteur-public
  theme: Tuteur IA
  titre: "Un tuteur IA public, vocal, qui ne donne jamais la solution avant une tentative"
  explication: "Un tuteur à indices gradués, avec un volet orientation de la 6e à la terminale, commandé par appel d'offres et testé avant toute généralisation, plutôt que des cours d'IA."
  preuves:
    - "Les tuteurs structurés qui guident sans donner la réponse améliorent les résultats de 0,3 à 0,6 écart-type (De Simone et al., 2025 ; Henkel et al., 2024 ; Kestin et al., 2025)."
    - "L'accès libre à l'IA fait baisser les notes aux examens passés sans elle de 17 à 24 % (Bastani et al., 2025 ; Strömberg, Lei et Wu, 2026)."
  note: ""
  statut: proposition
  maj_le: 2026-11-18
  sujets: [ecrans]
  issue_de: "Note sur un tuteur IA pour l'Éducation nationale (octobre 2026)"

- id: tuteur-marche
  theme: Tuteur IA
  titre: "Un marché public en quatre lots, payé en partie selon les résultats d'un essai"
  explication: "Éviter l'erreur de MIA Seconde : séparer conception pédagogique et garde-fous, accès aux modèles par une passerelle publique (API Albert), voix sur des modèles français ouverts, et données d'orientation. Changer de modèle sous trois mois, remettre le modèle en concurrence tous les 12 à 24 mois, et lier 20 à 30 % du paiement aux résultats d'un essai indépendant."
  preuves:
    - "MIA Seconde, commandé en 2022 pour 2,8 M€ sur trois ans, a été livré avec un an de retard, sans résultats publiés (Next, 2024)."
  note: ""
  statut: proposition
  maj_le: 2026-11-18
  sujets: [ecrans]
  issue_de: "Note sur un tuteur IA pour l'Éducation nationale (octobre 2026)"

# ---------- Ce que le livret ne dit pas encore aux jeunes (22/11/2026) : research/26-lacunes-jeunes (protocole, ledgers, un cas étranger par proposition)
# Textes : Gemini 4 Carbon à partir des fiches de recherche ; preuves reprises des fiches (chiffres vérifiés dans les ledgers).
- id: j-emploi-tutore
  theme: Premier emploi des jeunes
  titre: "Un emploi tutoré de six mois en entreprise pour les jeunes sans emploi ni formation"
  explication: "En entreprise privée, un contrat aidé augmente de 23 points l'accès à un emploi non aidé deux ans et demi plus tard (Cour des comptes, 2018, p. 140). L'État financera une partie du salaire d'un emploi de six mois avec tuteur en entreprise privée, réservé aux jeunes restés 6 à 12 mois sans emploi ni formation. Comme ces contrats ne créent que 0,1 emploi net par embauche (Cour des comptes, 2018, p. 141), ils seront ciblés uniquement sur ces jeunes éloignés de l'emploi."
  preuves:
    - "Contrats aidés du secteur marchand (CIE) : +23 points d'emploi non aidé deux ans et demi après l'entrée, par rapport à des personnes comparables sans contrat (Cour des comptes, 2018, p. 140)"
    - "Mais 0,1 emploi net créé par contrat financé : la plupart des embauches auraient eu lieu sans aide (Cour des comptes, 2018, p. 141)"
    - "Coût : à chiffrer"
  statut: à chiffrer
  maj_le: 2026-11-22
  sujets: [emploi]
  issue_de: "Ce que le livret ne dit pas encore aux jeunes (GT Éducation, novembre 2026)"

- id: j-prime-conditionnelle
  theme: Premier emploi des jeunes
  titre: "Une prime d'embauche temporaire, versée seulement si l'effectif augmente, quand le chômage des jeunes monte"
  explication: "Le chômage des 15-24 ans atteint 21,0 % au 3e trimestre 2026 (Insee, 2026), mais une aide générale finance à 84 % des embauches qui auraient eu lieu sans elle (Cahuc, Carcillo et Le Barbanchon, 2019, version IZA p. 25). Nous proposons une prime temporaire aux petites entreprises, déclenchée au-dessus d'un seuil de chômage des jeunes et arrêtée à la décrue. Versée uniquement si l'effectif de l'entreprise augmente, elle crée 4,4 fois plus d'emplois à budget égal (Cahuc, Carcillo et Le Barbanchon, 2019, version IZA p. 27)."
  preuves:
    - "Zéro charges (2009, entreprises de moins de 10 salariés) : 84 % des embauches aidées auraient eu lieu sans l'aide (Cahuc, Carcillo et Le Barbanchon, 2019, version IZA p. 25)"
    - "Conditionnée à la hausse de l'effectif, la même enveloppe aurait créé 4,4 fois plus d'emplois (Cahuc, Carcillo et Le Barbanchon, 2019, version IZA p. 27)"
    - "Chômage des 15-24 ans : 21,0 % au 3e trimestre 2026 (Insee, 2026)"
    - "Coût : nul hors période de déclenchement ; seuil et montant à chiffrer"
  statut: proposition
  maj_le: 2026-11-22
  sujets: [emploi]
  issue_de: "Ce que le livret ne dit pas encore aux jeunes (GT Éducation, novembre 2026)"

- id: stages-garantie-rep
  theme: Stages
  titre: "Garantir par l'établissement un stage de 3e et de seconde à chaque élève d'éducation prioritaire"
  explication: "Deux tiers des stages passent par l'entourage, contre 4 % par l'établissement, et 41 % des enfants d'ouvriers cherchent sans proches (Guichard, DEPP, 2026). Comme l'accompagnement seul ne suffit pas (L'Horty, Duguet et Petit, 2012) et que moins de 10 000 des 33 000 offres dédiées ont trouvé preneur (circulaire du Premier ministre, 31/07/2019), recteurs et préfets réuniront des places publiques et privées. Les établissements de REP, REP+ et ruraux isolés affecteront directement les élèves restés sans stage à une date butoir, avec déploiement évalué par tirage au sort."
  preuves:
    - "Deux tiers des stages de 3e et de seconde sont trouvés grâce à la famille ou à l'entourage, 4 % grâce à l'établissement (Guichard, DEPP, 2026)"
    - "41 % des enfants d'ouvriers trouvent leur stage sans l'aide de proches, contre 24 % des enfants de cadres (Guichard, DEPP, 2026)"
    - "En REP/REP+, 12 % des stages sont trouvés par l'établissement contre 3 % ailleurs (Guichard, DEPP, 2026)"
    - "Moins de 10 000 des 33 000 offres de la plateforme REP+ pourvues en 2018-2019 (circulaire du Premier ministre, 31/07/2019)"
    - "Accompagnement à la recherche de stage en éducation prioritaire, tirage au sort de classes (550 élèves) : aucun effet sur l'accès au stage, mais 48,8 % contre 38,3 % d'élèves confortés dans leur choix d'orientation (L'Horty, Duguet et Petit, 2012)"
    - "Angleterre : 81 % des placements organisés par l'élève ou sa famille ; le rapport recommande une obligation légale et un service public de mise en relation (Milburn, 2026, p. 15, 50 et 62)"
    - "Coût : à chiffrer (temps d'un référent stages par établissement ; places publiques à coût marginal faible)"
  statut: proposition
  maj_le: 2026-11-22
  sujets: [emploi]
  issue_de: "Ce que le livret ne dit pas encore aux jeunes (GT Éducation, novembre 2026)"

- id: stages-jobs-ete
  theme: Stages
  titre: "Financer un job d'été de six semaines pour les lycéens des quartiers prioritaires"
  explication: "À Chicago, des jobs d'été tirés au sort ont réduit de 43 % les arrestations pour violence chez les lycéens (Heller, 2014). L'État et les collectivités financeront six semaines d'emploi tutoré au salaire minimum, 25 heures par semaine, pour les 16-18 ans des quartiers prioritaires. C'est une piste à tester par tirage au sort, conçue pour la sécurité et une première expérience, car ces dispositifs n'améliorent pas l'emploi formel ultérieur (Davis et Heller, 2017, résumé J-PAL)."
  preuves:
    - "Chicago, 1 634 lycéens tirés au sort : 43 % d'arrestations pour violence en moins sur 16 mois par rapport au groupe témoin (Heller, 2014)"
    - "Chicago 2012 : 35 % d'arrestations pour violence en moins sur un an, aucun effet sur l'emploi formel ni la scolarité, 45 % d'arrestations pour vol en plus (Davis et Heller, 2017, résumé J-PAL)"
    - "New York, 294 100 participants aux loteries : incarcération en baisse de 9,93 % et mortalité de 17,97 % par rapport au groupe témoin, mais salaires légèrement plus bas les trois années suivantes (Gelber, Isen et Kessler, 2016)"
    - "Coût à Chicago : environ 3 000 dollars par participant (Davis et Heller, résumé J-PAL)"
    - "Coût : à chiffrer pour la France (repère : environ 3 000 dollars par participant à Chicago, salaires et encadrement compris)"
  statut: piste
  maj_le: 2026-11-22
  sujets: [emploi]
  issue_de: "Ce que le livret ne dit pas encore aux jeunes (GT Éducation, novembre 2026)"

- id: stages-superieur-boursiers
  theme: Stages
  titre: "Garantir par l'établissement un stage en entreprise aux étudiants boursiers restés sans place"
  explication: "Un stage pendant les études augmente le salaire d'environ 6 % en Allemagne (Margaryan, Saniter, Schumann et Siedler, 2019), mais en France 26 % des étudiants le trouvent par leur réseau social (SIES, 2017, données Céreq Génération 2010). Chaque formation exigeant un stage attribuera aux boursiers sans solution à une date butoir une place chez ses entreprises partenaires, et publiera la part de stages fournis et gratifiés. Aucune étude n'évaluant encore cette garantie, c'est une piste à tester."
  preuves:
    - "Allemagne : environ 6 % de salaire en plus après un stage en entreprise pendant les études, estimé en utilisant les stages obligatoires de certains cursus (Margaryan, Saniter, Schumann et Siedler, 2019)"
    - "États-Unis, testing par CV : une expérience de stage augmente de 14 % (2,2 points) le taux de convocation à un entretien (Nunley, Pugh, Romero et Seals, 2015)"
    - "26 % des étudiants trouvent leur stage par leur réseau social ; père en emploi : +7 points de probabilité d'avoir fait un stage (SIES, 2017, données Céreq Génération 2010)"
    - "61 % des sortants de BTS-DUT ont fait un dernier stage court et non gratifié (SIES, 2017)"
    - "Coût : à chiffrer"
  statut: piste
  maj_le: 2026-11-22
  sujets: [emploi]
  issue_de: "Ce que le livret ne dit pas encore aux jeunes (GT Éducation, novembre 2026)"

- id: bourses-bareme-lineaire
  theme: "Étudiants : bourses et logement"
  titre: "Remplacer les échelons des bourses étudiantes par un barème continu et indexé sur les prix"
  explication: "Le nombre de boursiers a reculé à 662 000 en 2024-2025 (Sénat, 2025), alors qu'être éligible à 1 500 € par an augmente jusqu'à 5 points l'inscription et la réussite en master (Fack et Grenet, 2015). Le ministère remplacera les huit échelons par une formule continue indexée sur les prix, supprimant les effets de seuil. Ce barème, chiffré entre 350 et 400 M€ par an (Sénat, avis n° 144, 2025, p. 15), sera financé en recentrant les APL étudiantes et en supprimant la réduction d'impôt pour frais de scolarité."
  preuves:
    - "Jusqu'à +5 points d'inscription ou de réinscription pour l'éligibilité à 1 500 € par an, contre les candidats juste au-dessus du seuil (Fack et Grenet, 2015)"
    - "+5 points d'obtention du diplôme pour les entrants en master, jusqu'à +3 points en dernière année, même comparaison (Fack et Grenet, 2015)"
    - "+2 points (13 %) de diplômés en quatre ans et +5 à 8 % de salaire pour environ 711 $ de bourse en plus, contre les étudiants juste au-dessus du seuil ; dépense remboursée par l'impôt en dix ans (Denning, Marx et Turner, 2019)"
    - "662 000 boursiers en 2024-2025, plus bas depuis 2015, recul de 2,6 % en un an (Sénat, 2025)"
    - "31 % des boursiers touchent moins de 150 € par mois (Sénat, 2025)"
    - "Coût : 350 à 400 M€ par an selon le ministère (Sénat, avis n° 144, 2025, p. 15), soit 15 à 17 % des 2,32 Md€ de crédits de bourses 2026 ; gain des financements proposés à chiffrer"
  statut: proposition
  maj_le: 2026-11-22
  sujets: [emploi]
  issue_de: "Ce que le livret ne dit pas encore aux jeunes (GT Éducation, novembre 2026)"

- id: residences-etudiantes-zones-tendues
  theme: "Étudiants : bourses et logement"
  titre: "Construire les résidences étudiantes sociales d'abord dans les villes sous 5 places pour 100 étudiants"
  explication: "À Paris, on compte 3 places sociales pour 100 étudiants contre 8,2 en moyenne, pour un reste à charge de 375 € dans le privé contre 100 € dans le social (Cour des comptes, 2025). L'État, les Crous et les universités construiront des résidences à loyer plafonné dans les villes sous 5 places pour 100 étudiants, sur des terrains publics cédés gratuitement, avec compensation des places perdues. Augmenter l'offre contient les loyers (Grislain-Letrémy et Trevien, 2022), alors qu'une hausse d'aide au logement les relève (Fack, 2006)."
  preuves:
    - "Reste à charge après APL à Paris en 2023 : 375 € par mois dans le privé contre 100 € dans le parc social (Cour des comptes, 2025)"
    - "3 places à vocation sociale pour 100 étudiants à Paris contre 13 à Orléans et 8,2 en moyenne nationale (Cour des comptes, 2025)"
    - "Plan 60 000 : 37 435 places livrées en 2018-2022 (62 % de l'objectif), 33 600 nettes (56 %), 11 000 places perdues par les réhabilitations (Cour des comptes, 2025)"
    - "Une hausse d'aide au logement relève le loyer des nouveaux allocataires de 78 centimes par euro, contre une situation sans réforme (Fack, 2006)"
    - "Là où l'offre de studios a augmenté par la construction neuve, les loyers des petits logements ont cessé de monter malgré l'extension des APL (Grislain-Letrémy et Trevien, 2022)"
    - "Coût : À chiffrer ; repère : 4,9 Md€ de construction pour 69 300 places nettes entre 2012 et 2023, dont 607 M€ de subventions directes, soit environ 71 000 € par place (Cour des comptes, 2025, p. 12)"
  statut: à chiffrer
  maj_le: 2026-11-22
  sujets: [emploi]
  issue_de: "Ce que le livret ne dit pas encore aux jeunes (GT Éducation, novembre 2026)"

- id: emplois-etudiants-campus
  theme: "Étudiants : bourses et logement"
  titre: "Créer des emplois étudiants sur le campus de 15 heures maximum, d'abord pour les boursiers"
  explication: "Près de la moitié des étudiants, 44 %, travaillent pendant l'année (OVE, 2023), ce qui réduit fortement leurs chances de réussir, surtout au-delà de 16 heures hebdomadaires (Beffy, Fougère et Maurel, 2009). À l'inverse, des emplois courts sur le campus aux États-Unis augmentent de 3,2 points l'obtention de la licence (Scott-Clayton et Minaya, 2016). Les universités et les Crous recruteront prioritairement des boursiers jusqu'à 15 heures par semaine, adaptées aux cours et cofinancées par l'État : une piste à tester."
  preuves:
    - "Sans leur emploi, les étudiants salariés auraient eu 43 points de probabilité de plus de réussir leur année, effet plus fort au-delà de 16 heures par semaine (Beffy, Fougère et Maurel, 2009)"
    - "+3,2 points de licence en six ans pour les participants au Federal Work-Study contre des non-participants comparables ; 11 heures par semaine contre 18 pour les autres étudiants salariés (Scott-Clayton et Minaya, 2016)"
    - "Uruguay, loterie : pas d'effet sur les notes et +4 points d'inscription deux ans après pour les élèves tirés au sort, contre les non-tirés (Le Barbanchon, Ubfal et Araya, 2023)"
    - "44 % des étudiants ont une activité rémunérée pendant l'année (OVE, 2023)"
    - "Coût : À chiffrer"
  statut: piste
  maj_le: 2026-11-22
  sujets: [emploi]
  issue_de: "Ce que le livret ne dit pas encore aux jeunes (GT Éducation, novembre 2026)"

- id: batiments-inventaire-public
  theme: Bâtiments scolaires
  titre: "Inspecter et publier l'état de chaque école, collège et lycée public bâtiment par bâtiment"
  explication: "L'Assemblée nationale n'a pu obtenir d'état des lieux complet du bâti scolaire (rapport n° 1974, 2023, p. 42-43), et le dossier amiante manque dans la moitié des écoles du panel ministériel (question n° 5405, 2025, citant le ministère). En cinq ans, l'État et les collectivités inspecteront tous les établissements publics pour publier une note de A à D, la température, le CO2, l'amiante et l'énergie. Cet inventaire permettra de cibler les aides sur les besoins réels, même si l'effet propre de la publication reste non mesuré."
  preuves:
    - "L'Assemblée n'a pas pu obtenir un état des lieux complet du bâti scolaire et recommande un observatoire (rapport n° 1974, 2023, p. 42-43)"
    - "54 % des collectivités suivies par ÉduRénov n'ont qu'une vision partielle de leur patrimoine scolaire ; une sur cinq découvre un bâti plus dégradé que prévu (ÉduRénov, 2025, p. 9 ; échantillon non représentatif)"
    - "Le dossier technique amiante, obligatoire, n'existe que dans la moitié des écoles du panel du ministère, contre 100 % exigés (question n° 5405, 2025, citant le ministère)"
    - "En Angleterre, 345 des 1 000 écoles au plus fort besoin n'avaient pas candidaté au programme de reconstruction (NAO, 2023, p. 32)"
    - "Aucune étude causale ne mesure l'effet de la publication elle-même"
    - "Coût : à chiffrer (coût des inspections anglaises CDC non trouvé)"
  statut: à chiffrer
  maj_le: 2026-11-22
  sujets: [formation]
  issue_de: "Ce que le livret ne dit pas encore aux jeunes (GT Éducation, novembre 2026)"

- id: batiments-fonds-chaleur-air
  theme: Bâtiments scolaires
  titre: "Créer un fonds d'État pour la chaleur, l'air et les sanitaires des écoles défavorisées"
  explication: "D'ici 2030, 9,4 millions d'élèves subiront de fortes chaleurs (ÉduRénov, 2025), alors que rénover le chauffage et la ventilation améliore les résultats scolaires dans les quartiers pauvres (Biasi, Lafortune et Schönholzer, 2024) et que baisser le CO2 accélère de 12 % le travail scolaire (Wargocki et al., 2020, revue). L'État financera à 90 %, en REP+ puis REP selon l'inventaire national, les travaux thermiques, de ventilation, de sanitaires et de dépollution. Le fonds exclura les dépenses sans effet prouvé et sera évalué par vagues."
  preuves:
    - "Projets de chauffage-ventilation-climatisation : +0,27 écart-type de district (environ +0,09 écart-type élève) dans les districts pauvres, aucun effet dans les districts aisés (Biasi, Lafortune et Schönholzer, 2024)"
    - "Sans climatisation, une année plus chaude de 1 °F réduit l'apprentissage de l'année d'environ 1 %, par rapport au même élève lors d'un autre passage du test (Goodman et al., 2020)"
    - "Quatre ans dans un bâtiment neuf : +0,1 écart-type en maths et environ 4 jours de présence en plus par an, par rapport aux mêmes élèves avant (Lafortune et Schönholzer, 2019)"
    - "Baisser le CO2 de 2 100 à 900 ppm : +12 % de vitesse aux tests et tâches scolaires (Wargocki et al., 2020, revue)"
    - "Contre-exemples : près de 1 400 campagnes texanes sans effet sur les résultats (Martorell et al., 2016) ; Building Schools for the Future sans effet de court terme (Thomson, 2016)"
    - "9,4 millions d'élèves français exposés à 2 à 8 jours de fortes chaleurs par an d'ici 2030, 2 à 5 fois plus qu'en 1976-2005 (ÉduRénov, 2025)"
    - "Coût : à chiffrer ; repères : rénovation 300 à 1 700 €/m² (Sénat, 2023) ; 52 Md€ sur dix ans pour toutes les écoles publiques (estimation ministérielle citée par le Sénat, 2023)"
  statut: à chiffrer
  maj_le: 2026-11-22
  sujets: [formation]
  issue_de: "Ce que le livret ne dit pas encore aux jeunes (GT Éducation, novembre 2026)"

- id: batiments-ddec-perequation
  theme: Bâtiments scolaires
  titre: "Répartir la dotation d'équipement des collèges selon le nombre d'élèves et l'état du bâti"
  explication: "Figée depuis 2009, la dotation d'équipement de l'État couvre 9,28 % des investissements des collèges en Seine-Saint-Denis contre 84,25 % dans les Ardennes (Cour des comptes, 2023). À enveloppe constante d'environ 280 M€ par an, l'État la répartira selon le nombre de collégiens, leur origine sociale et l'état des bâtiments issu de l'inventaire, avec une transition pour les départements perdants. Recommandée par la Cour des comptes (2023, recommandation n° 3), cette piste à tester n'a pas encore fait l'objet d'évaluation causale."
  preuves:
    - "La DDEC couvre 9,28 % des investissements de la Seine-Saint-Denis contre 15,61 % en moyenne et 84,25 % dans les Ardennes, sur 2015-2019 (Cour des comptes, 2023)"
    - "La Cour des comptes recommande de renforcer la péréquation de la DDEC au profit des départements aux besoins les plus importants (2023, recommandation n° 3)"
    - "Aucune évaluation causale d'une telle réforme"
    - "Coût : nul à enveloppe constante (environ 280 M€ par an, calcul GT d'après la Cour des comptes, 2023, tableau n° 1)"
  statut: piste
  maj_le: 2026-11-22
  sujets: [formation]
  issue_de: "Ce que le livret ne dit pas encore aux jeunes (GT Éducation, novembre 2026)"

- id: disc-testing-grands-employeurs
  theme: Discriminations à l'embauche
  titre: "Tester chaque année par candidatures fictives les employeurs de plus de 1 000 salariés"
  explication: "À candidature égale, un nom maghrébin reçoit 31,5 % de rappels en moins qu'un nom français (Insee Références, 2023, p. 50). Une autorité indépendante fera tester chaque année par des chercheurs tous les employeurs publics et privés de plus de 1 000 salariés sur l'origine et l'adresse, stages et alternances compris, avant publication des résultats après un délai de correction de douze mois. Ce contrôle sera annuel, car l'effet d'un simple avertissement disparaît après quinze mois (Défenseur des droits, 2019, p. 4 et 8 ; logement)."
  preuves:
    - "22,8 % de rappels pour un nom maghrébin contre 33,3 % pour un nom français, soit 31,5 % de moins, 9 600 candidatures (Insee Références, 2023, p. 50)"
    - "Environ 20 % de réponses en moins dans 103 très grandes entreprises, 17 163 demandes ; près de 30 % avec contrôles (Challe, Chareyron, L'Horty et Petit, 2020, p. 19)"
    - "Courrier d'avertissement après test : écart de 1,49 point contre 11,45 dans le groupe témoin à 9 mois, effet disparu à 15 mois (Défenseur des droits, 2019, p. 4 et 8 ; logement)"
    - "Formation des recruteurs : aucun effet, écart de près de 50 % avant comme après, 202 entreprises formées contre 606 témoins (Challe et al., 2025, p. 3-4)"
    - "CV anonyme : taux d'entretien des candidats de minorités de 9,3 % à 4,7 %, écart creusé de 10,7 points par rapport au CV nominatif (Behaghel, Crépon et Le Barbanchon, 2015 ; IZA 2014, p. 13-14)"
    - "Coût : 80 000 à 100 000 € par campagne de testing sur un critère dans un domaine (Assemblée nationale, rapport n° 1903, 2023, p. 56) ; précédent de 3 M€ ajoutés à la Dilcrah en 2024 ; coût total du programme à chiffrer"
  statut: proposition
  maj_le: 2026-11-22
  sujets: [emploi]
  issue_de: "Ce que le livret ne dit pas encore aux jeunes (GT Éducation, novembre 2026)"

- id: disc-apprentissage-stages
  theme: Discriminations à l'embauche
  titre: "Tester les offres d'apprentissage et de stage et avertir nommément les employeurs qui discriminent"
  explication: "Pour trouver un apprentissage en restauration, il faut contacter 30 établissements avec un nom maghrébin contre 17 avec un nom français (Anne et al., 2025, p. 1), tandis qu'aucun écart n'apparaît chez les apprenties comptables (Anne et al., 2024, p. 2). L'État fera tester chaque année un échantillon d'offres de stage et d'apprentissage sur les plateformes publiques, d'abord dans les secteurs en tension. Les employeurs présentant un écart recevront un courrier nominatif, efficace à neuf mois (Défenseur des droits, 2019, p. 4), avant un nouveau test."
  preuves:
    - "Apprentissage en restauration : 17 restaurants contactés pour une réponse positive avec un nom français contre 30 avec un nom maghrébin, écart relatif de 46 %, 947 restaurants (Anne et al., 2025, p. 1)"
    - "Apprenties comptables : pas d'écart selon l'origine, 2 000 PME parisiennes (Anne et al., 2024, p. 2)"
    - "47 % des 18-34 ans jugent les discriminations fréquentes dans la recherche de stage (Défenseur des droits et OIT, 2021, p. 4)"
    - "Courrier d'avertissement : plus d'écart significatif à 3 et 9 mois dans les agences averties, contre un écart constant chez les témoins (Défenseur des droits, 2019, p. 4)"
    - "Coût : 80 000 à 100 000 € par campagne sur un critère dans un domaine (Assemblée nationale, rapport n° 1903, p. 56) ; coût annuel selon le nombre de secteurs à chiffrer"

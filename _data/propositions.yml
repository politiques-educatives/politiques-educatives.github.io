# Propositions du GT Éducation, une entrée par proposition.
# Champs : id, theme, sujets (hubs), issue_de (note d'origine), titre (une ligne), explication (2-4 phrases reprises des notes), preuves (liste : chiffre + source),
#          note (fichier PDF dans assets/notes/), statut (proposition | piste | à chiffrer), maj_le (AAAA-MM-JJ)
# Règle : chaque chiffre vient d'une note ou d'un dossier de recherche du GT, avec sa source. Aucune position du candidat inventée.

# ---------- Temps des professeurs
- id: heures-service-annuel
  theme: Temps des professeurs
  titre: "Convertir une heure de cours hebdomadaire en tutorat et en travail d'équipe"
  explication: "Comme au premier degré, le service d'enseignement baisse d'une heure de cours par semaine, placée dans l'emploi du temps pour le tutorat, la concertation et l'orientation, sans hausse du temps de service. Cette mesure accompagne la revalorisation de 20 % prévue au programme. Aujourd'hui, un certifié doit 18 heures de cours hebdomadaires, et le reste se paie en heures supplémentaires ou ne se fait pas. L'heure retirée devant être assurée par ailleurs, son coût reste à chiffrer."
  preuves:
    - "Un certifié doit 18 heures de cours par semaine, un agrégé 15, un professeur des écoles 24 heures plus 108 heures par an (décrets de 2008 et 2014)."
    - "Le contrat écossais fixe une semaine de 35 heures, dont 22,5 heures de cours au plus (SNCT) : 855 heures de cours sur 1 365 heures de travail par an (OCDE, 2026)."
    - "Le second professeur principal de terminale, créé fin 2017, est payé par une indemnité, sans aucune heure dégagée."
  note: EDUCATION-note1-allocation-heures-enseignement.pdf
  statut: à chiffrer
  maj_le: 2026-11-22
  sujets: [formation]
  issue_de: "Note 1 : l'allocation des heures d'enseignement (novembre 2026)"

- id: heures-emploi-du-temps
  theme: Temps des professeurs
  titre: "Construire l'emploi du temps par établissement, avec du tutorat pendant la journée"
  explication: "Le chef d'établissement et le conseil pédagogique organisent l'emploi du temps sans modèle imposé, avec des groupes temporaires réévalués toutes les six à huit semaines autour des mêmes programmes pour tous. L'heure de concertation hebdomadaire correspond à l'heure de cours convertie, sans heure imposée en plus. Des enseignants volontaires rémunérés assurent le tutorat en journée. L'équipe peut choisir un coordinateur de discipline ou de niveau, payé par une indemnité pour mission particulière plutôt que par une décharge, qui organise les groupes temporaires, le tutorat et les supports communs sans évaluer ses collègues. Le tutorat est plus efficace pendant le temps scolaire (0,40 écart-type) qu'après (0,21) (Nickow, Oreopoulos et Quan, 2020)."
  preuves:
    - "Coordinateur : dans 82 collèges anglais, l'observation mutuelle a gagné 0,07 écart-type au GCSE, et la doubler n'a rien ajouté (Burgess, Rawal et Taylor, 2021) ; l'évaluation officielle du même essai ne trouve aucun effet (EEF, 2017)."
    - "Sur 96 essais randomisés, le tutorat améliore les résultats de 0,37 écart-type, davantage pendant le temps scolaire (0,40) qu'après (0,21), avec des enseignants (0,50) qu'avec des bénévoles (0,21) (Nickow, Oreopoulos et Quan, 2020 ; 0,29 sur 89 essais dans la version publiée en 2024)."
    - "L'effet est plus faible au collège et au lycée ; dans les essais les plus proches d'un déploiement à grande échelle, il n'atteint qu'un tiers à la moitié de celui de l'ensemble des essais, surtout parce qu'il baisse quand le programme grandit (Kraft et al., 2024)."
    - "Les groupes de niveau au sein de la classe gagnent 0,19 à 0,30 écart-type ; les classes séparées par niveau, presque rien (Steenbergen-Hu et al., 2016), mais elles creusent les écarts (Terrin et Triventi, 2023)."
  note: EDUCATION-note1-allocation-heures-enseignement.pdf
  statut: proposition
  maj_le: 2026-11-22
  sujets: [formation]
  issue_de: "Note 1 : l'allocation des heures d'enseignement (novembre 2026)"

- id: heures-dotation
  theme: Temps des professeurs
  titre: "Calculer la dotation des établissements selon l'effectif et l'origine sociale, à budget constant"
  explication: "Aujourd'hui, la dotation horaire d'un collège dépend des heures dues aux classes, pas des besoins des élèves. Elle suivra une formule publique à budget national constant, avec un socle par élève et une majoration selon l'indice de position sociale (IPS). Une transition sur trois ans et un plancher par élève protègent les établissements perdants, dont la liste est publiée avant l'entrée en vigueur."
  preuves:
    - "La dotation horaire globale d'un collège se calcule à partir des heures de cours dues aux classes, puis le conseil d'administration en vote la répartition."
    - "En Angleterre, le programme national de tutorat est passé à partir de 2021 par les écoles ; ses effets mesurés sont faibles, un mois de progrès au plus (NFER, 2024)."
  note: EDUCATION-note1-allocation-heures-enseignement.pdf
  statut: proposition
  maj_le: 2026-11-22
  sujets: [formation]
  issue_de: "Note 1 : l'allocation des heures d'enseignement (novembre 2026)"

- id: heures-charge
  theme: Temps des professeurs
  titre: "Mesurer chaque année la charge de travail réelle des enseignants"
  explication: "Une enquête annuelle sur le temps de travail des enseignants, comme en Angleterre, pour que l'annualisation ne fasse pas glisser la charge, comme en Écosse. Un plafond seul ne suffit pas."
  preuves:
    - "En Écosse, les enseignants déclarent 46 heures de travail sur une semaine type, 11 de plus que leur semaine contractuelle (UWS pour l'EIS, 2024)."
    - "Un enseignant anglais de collège à temps plein déclarait 49,3 heures de travail par semaine, contre environ 41 dans l'OCDE (TALIS 2018) ; l'enquête anglaise de 2025 donne 50,1 heures (DfE, 2025)."
  note: EDUCATION-note1-allocation-heures-enseignement.pdf
  statut: proposition
  maj_le: 2026-11-18

# ---------- Gouvernance
  sujets: [formation]
  issue_de: "Note 1 : l'allocation des heures d'enseignement (novembre 2026)"

- id: gouv-recruter
  theme: Gouvernance de l'établissement
  titre: "Recruter jusqu'à 10 % des enseignants sur projet, d'abord dans les établissements peu demandés"
  explication: "Aujourd'hui, les débutants sont plus souvent affectés en éducation prioritaire (DEPP, 2026). Dans le cadre des postes à profil existants, jusqu'à 10 % des postes d'un établissement sont pourvus sur projet par une commission réunissant chef d'établissement, enseignants du conseil pédagogique et inspecteur, avec droit de recours. Une prime d'affectation est versée tant que l'enseignant reste dans l'établissement, et les autres postes suivent le barème."
  preuves:
    - "Les enseignants sont affectés par le mouvement inter et intra-académique selon un barème de points ; les débutants sont plus souvent affectés en éducation prioritaire (DEPP, 2026)."
    - "Les collèges en difficulté devenus academies de 2002 à 2010, qui changeaient souvent de direction, ont progressé d'environ 0,2 écart-type en quatre ans (Eyles et Machin, 2019) ; ceux convertis après 2010 n'ont pas gardé d'avance (EPI, 2017)."
    - "Le recrutement sur profil, par exemple dans les écoles de Marseille, n'a pas encore été évalué (Cour des comptes, 2024)."
  note: EDUCATION-note2-gouvernance-etablissement.pdf
  statut: à chiffrer
  maj_le: 2026-11-22
  sujets: [formation]
  issue_de: "Note 2 : qui décide dans l'établissement ? (novembre 2026)"

- id: gouv-visite
  theme: Gouvernance de l'établissement
  titre: "Instaurer une visite-conseil par des pairs formés tous les deux ans, annuelle pour les débutants"
  explication: "Chaque enseignant reçoit une visite formative tous les deux ans, et chaque année à ses débuts, menée par l'inspecteur ou par des enseignants expérimentés volontaires, rémunérés et formés à l'observation avec grille. Sans lien avec l'avancement, elle débouche sur un plan de formation d'une à deux journées par an. À Cincinnati, une année d'évaluation fondée sur quatre observations, dont trois par des pairs formés, a relevé les résultats en maths d'environ 0,10 écart-type les années suivantes (Taylor et Tyler, 2012)."
  preuves:
    - "À Cincinnati, une année d'évaluation fondée sur quatre observations, dont trois par des pairs formés, a relevé d'environ 0,10 écart-type les résultats en maths des élèves les années suivantes (Taylor et Tyler, 2012)."
    - "Les quelque 3 650 inspecteurs territoriaux (Cour des comptes, 2022) consacrent environ 30 % de leur activité à l'évaluation des enseignants dans le premier degré, 20 à 30 % dans le second."
    - "En France, l'inspection avec retour au professeur relève les résultats de ses élèves de 3 à 5 % d'écart-type au collège, jusqu'à 10 % en éducation prioritaire, pour moins de 100 € par élève : elle s'autofinance (Briole et Maurin, 2024 ; Grenet et Landais, CAE, 2025)."
  note: EDUCATION-note2-gouvernance-etablissement.pdf
  statut: à chiffrer
  maj_le: 2026-11-22
  sujets: [formation]
  issue_de: "Note 2 : qui décide dans l'établissement ? (novembre 2026)"

- id: gouv-evaluation
  theme: Gouvernance de l'établissement
  titre: "Évaluer en priorité les établissements où les élèves progressent le moins, sans nouveau corps"
  explication: "Sans créer de nouveau corps, le Conseil d'évaluation de l'école évalue les établissements à faible valeur ajoutée, mesurée par les IVAC et IVAL étendus au-delà du brevet et du bac, avec accompagnement et retour sous deux ans. Les résultats sont publiés par domaine, sans note globale ni classement. En Angleterre, un échec à l'inspection a relevé les résultats en maths de 0,12 écart-type au primaire (Hussain, 2015) et d'environ 0,1 au secondaire (Allen et Burgess, 2012)."
  preuves:
    - "Un échec à l'inspection a relevé les résultats des élèves de 0,12 écart-type en maths en primaire (Hussain, 2015) et d'environ 0,1 dans le secondaire (Allen et Burgess, 2012)."
    - "Depuis novembre 2025, l'Ofsted note chaque établissement sur cinq niveaux, domaine par domaine, sans note globale, environ tous les quatre ans."
  note: EDUCATION-note2-gouvernance-etablissement.pdf
  statut: à chiffrer
  maj_le: 2026-11-22

# ---------- Orientation et bac
  sujets: [formation]
  issue_de: "Note 2 : qui décide dans l'établissement ? (novembre 2026)"

- id: orient-4e
  theme: Orientation et bac
  titre: "Un référent d'orientation humain pour les élèves défavorisés et ruraux, et le tuteur IA pour tous"
  explication: "De la 4e à la terminale, les élèves défavorisés et ruraux (environ 1,1 million de collégiens) voient chaque trimestre un référent d'orientation humain, enseignant volontaire, formé aux filières et rémunéré ; tous les élèves ont accès au volet orientation du tuteur IA public. Le ciblage suit les preuves : en Allemagne, un mentorat par des étudiants a amélioré de 0,56 écart-type les perspectives des collégiens défavorisés, sans effet chez les autres (Resnjanskij et al., 2024). En 2018, 89 % des lycées avaient nommé un second professeur principal en terminale, mais seul un tiers avait tenu les deux semaines d'orientation (Cnesco, 2018). Le coût reste à chiffrer."
  preuves:
    - "Un tiers des lycées seulement a tenu les deux semaines d'orientation (Cnesco, 2018)."
    - "En Allemagne, un mentorat par des étudiants a amélioré de 0,56 écart-type un indice combinant notes en maths, patience et compétences sociales, et orientation vers l'emploi chez les collégiens défavorisés, mesuré un an après le début du programme, sans effet chez les élèves plus favorisés (Resnjanskij et al., JPE, 2024 ; mentorat prévu sur environ deux ans)."
    - "En fin de 3e, 38,6 % des élèves du public sont orientés en voie professionnelle, et les premiers vœux y sont les moins souvent satisfaits (58,1 %, contre 87 % en seconde générale et technologique ; DGESCO, 2025)."
    - "Coût : à chiffrer."
  note: EDUCATION-note3-orienter.pdf
  statut: à chiffrer
  maj_le: 2026-11-23
  sujets: [orientation]
  issue_de: "Note 3 : orienter plus tôt, et rendre au bac sa valeur (octobre 2026, mise à jour novembre 2026) ; référent ciblé depuis le 23/11/2026"

- id: orient-parents
  theme: Orientation et bac
  titre: "Organiser deux réunions d'orientation avec les parents des élèves de 4e et 3e en difficulté"
  explication: "Dans tous les collèges, les parents des élèves de 4e et de 3e en difficulté sont réunis deux fois par an pour préparer l'orientation. Déjà évaluées en France en classe de 3e, ces réunions ont rendu les projets plus réalistes et réduit de 25 à 40 % le redoublement et le décrochage (Goux, Gurgand et Maurin, 2017), pour un coût quasi nul."
  preuves:
    - "Deux réunions avec les parents d'élèves de 3e en difficulté ont réduit de 25 à 40 % le redoublement et le décrochage (Goux, Gurgand et Maurin, 2017)."
    - "Une heure d'intervention d'une scientifique en classe fait passer de 11 % à 14,5 % la part des filles qui entrent dans une formation scientifique sélective (Breda et al., 2023)."
  note: EDUCATION-note3-orienter.pdf
  statut: proposition
  maj_le: 2026-11-22
  sujets: [orientation]
  issue_de: "Note 3 : orienter plus tôt, et rendre au bac sa valeur (octobre 2026, mise à jour novembre 2026)"

- id: orient-gatsby
  theme: Orientation et bac
  titre: "Mesurer huit repères d'orientation par établissement et publier le devenir des élèves"
  explication: "Sur le modèle anglais des repères Gatsby, chaque collège et lycée mesure chaque année huit repères d'orientation : information sur les métiers, rencontres d'employeurs, stages et entretien individuel. Le devenir des élèves de chaque établissement est publié, suivant le rapport Milburn (2026, p. 14-15). En Angleterre, atteindre tous les repères est associé à 8 % de jeunes sans emploi ni formation en moins, un lien qui n'est pas encore causal (Careers & Enterprise Company, 2024)."
  preuves:
    - "Les établissements anglais atteignent 6,0 repères sur 8 en moyenne ; ceux qui les atteignent tous comptent 8 % de jeunes sans emploi ni formation en moins, un lien qui n'est pas encore causal (Careers & Enterprise Company, 2024)."
    - "Norme « prêt pour le travail » inspectée par l'Ofsted et obligation légale de stage en entreprise (Milburn, 2026, p. 14-15)."
  note: EDUCATION-note3-orienter.pdf
  statut: à chiffrer
  maj_le: 2026-11-22
  sujets: [orientation]
  issue_de: "Note 3 : orienter plus tôt, et rendre au bac sa valeur (octobre 2026, mise à jour novembre 2026)"

- id: orient-bac
  theme: Orientation et bac
  titre: "Un bac qui départage : épreuves nationales anonymes et admissions conditionnelles"
  explication: "Réduire la part du contrôle continu et faire peser les épreuves terminales de spécialité, corrigées anonymement, dans l'admission. Une proposition d'admission en licence est confirmée en juillet si l'élève atteint une note fixée par la formation dans les spécialités utiles, comme les offres conditionnelles britanniques. Ceux qui n'atteignent pas la barre ont une année préparatoire ou une place en BTS et en BUT."
  preuves:
    - "En 2025, 91,6 % des candidats ont été reçus au bac, 96,4 % dans la voie générale, et 58,8 % avec mention (DEPP, 2025)."
    - "Parmi les bacheliers 2018 inscrits en licence, 46,9 % l'ont obtenue en trois ou quatre ans ; parmi ceux de 2020, 40,3 % (SIES, 2023 et 2025)."
    - "Parmi les bacheliers 2020 inscrits en licence, 70 % des mentions très bien l'ont obtenue en 3 ou 4 ans, contre 40 % pour l'ensemble (SIES, 2025) : le bac contient l'information, mais il ne s'en sert pas."
  note: EDUCATION-note3-orienter.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [orientation]
  issue_de: "Note 3 : orienter plus tôt, et rendre au bac sa valeur (octobre 2026, mise à jour novembre 2026)"

- id: orient-transparence
  theme: Orientation et bac
  titre: "La transparence sur tout le parcours, de la 4e au premier emploi"
  explication: "Mettre bout à bout les données publiques (DEPP, SIES, Parcoursup, InserSup, InserJeunes) pour montrer à un élève de 4e ou de 3e les débouchés de chaque voie, la réussite en licence selon le bac, l'emploi, les salaires et ce que l'IA sait déjà faire de ces métiers. C'est un outil d'égalité des chances, car les familles initiées connaissent déjà les règles que les autres découvrent trop tard. Prototype : la Boussole des formations (onglet Boussole)."
  preuves:
    - "Réussite en licence en 3 ou 4 ans : 46,1 % après un bac général contre 6,5 % après un bac professionnel (SIES, Note Flash 2025-29)."
    - "Emploi à 6 mois : 43 % après un bac pro, 59 % après un BTS (DEPP, InserJeunes, RERS 2025)."
    - "Au Chili, cette transparence a réduit de 4,6 % les choix de filières peu payées chez les jeunes modestes (Hastings, Neilson et Zimmerman, 2015)."
  note: EDUCATION-note3-orienter.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [orientation]
  issue_de: "Proposition 3 du GT : la transparence sur tout le parcours (novembre 2026)"

- id: orient-debouches
  theme: Orientation et bac
  titre: "Publier l'emploi, le salaire et l'exposition à l'IA de chaque formation, master compris"
  explication: "Pour chaque formation de Parcoursup, une note de résilience à l'IA de A à E, à côté du salaire et du taux d'emploi à 30 mois (InserSup), et les postes ouverts dans le bassin. Le rapport Milburn recommande aussi de rendre visibles les salaires des diplômés de chaque formation du supérieur."
  preuves:
    - "Montrer aux familles les emplois industriels de leur bassin a un sens économique : là où l'État américain a implanté des usines pendant la guerre, les garçons du comté ont gagné 2,5 % de plus par an une fois adultes, surtout ceux de familles modestes (Garin et Rothbaum, 2025)."
    - "Entre novembre 2022 et mars 2026, les embauches en CDI des 21-29 ans ont baissé de 28,3 % dans les métiers les plus exposés à l'IA, contre 7,5 % dans les moins exposés (Palladino, Bergeaud, Bertheau, Bunel et Degos, 2026)."
    - "La Boussole classe les 13 819 formations de Parcoursup 2025 en 39 familles et affiche l'emploi et le salaire de 2 427 masters d'université (InserSup 2026)."
    - "Salaires des diplômés de chaque formation du supérieur rendus visibles (Milburn, 2026, p. 15-16)."
  note: EDUCATION-note3-orienter.pdf
  statut: proposition
  maj_le: 2026-11-18

# ---------- IA, jeunes et emploi
  sujets: [orientation, emploi]
  issue_de: "Note 3 : orienter plus tôt, et rendre au bac sa valeur (octobre 2026, mise à jour novembre 2026)"

- id: ia-master
  theme: IA, jeunes et emploi
  titre: "Professionnaliser la licence avec un stage long ou l'alternance en L3"
  explication: "Chaque licence intègre un stage long ou l'alternance en L3, les licences professionnelles se développent, et le master cible recherche, études longues, réorientation et alternance, après enquête auprès des employeurs publics et privés sur leurs besoins en bac+5. À 30 mois, l'emploi salarié atteint 78 % après une licence professionnelle, contre 69 % après un master et 50 % après une licence générale (InserSup 2026). Le diplôme ne tranche que 11 % des recrutements (Dares, enquête Ofer 2016), alors qu'un master coûte environ 24 500 € à l'État (RERS 2025) et retarde l'activité de deux ans."
  preuves:
    - "Emploi salarié à 30 mois : 78 % après une licence professionnelle, 69 % après un master, 50 % après une licence générale, 77 % après un master en alternance (InserSup 2026)."
    - "À 26-27 ans, avoir terminé le master plutôt qu'arrêté en dernière année ajoute 15 points à la probabilité d'être cadre, mais seulement 4 % au salaire, pour un emploi presque identique, 90 % contre 87 % (Insee Première n° 2109, juin 2026)."
    - "Le diplôme ne décide du choix final que dans 11 % des recrutements, 22 % pour les cadres, et 73 % des recruteurs auraient pu embaucher un candidat moins diplômé mais plus expérimenté (Dares, enquête Ofer 2016)."
    - "Les enfants d'ouvriers passent de 10 % des étudiants en licence à 6 % en master, contre 31 % à 42 % pour les enfants de cadres ; un master coûte environ 24 500 € par jeune à l'État (RERS 2025)."
    - "Seuls 30 % des étudiants obtiennent leur licence en trois ans (SIES, Note Flash n° 29, novembre 2025)."
  statut: à chiffrer
  maj_le: 2026-11-22
  sujets: [emploi]
  issue_de: "Note IA et jeunes (novembre 2026)"

- id: ia-garantie
  theme: IA, jeunes et emploi
  titre: "Garantir un conseiller sous 14 jours et une offre à chaque jeune sans emploi ni formation"
  explication: "Via le contrat d'engagement jeune, tout jeune de 18 à 24 ans sans emploi ni formation voit un conseiller de mission locale sous 14 jours, reçoit un plan sous quatre semaines, puis une offre : emploi tutoré, formation professionnelle, apprentissage, stage ou service civique. C'est la garantie du rapport Milburn (2026). La Garantie jeunes a relevé l'emploi de 6,3 points à environ 14 mois (évaluation intermédiaire, 2016), et Kickstart au Royaume-Uni a ajouté 11 emplois non aidés pour 100 participants à 24 mois (DWP, 2024)."
  preuves:
    - "Aide à l'employeur de 3 000 £ par embauche d'un jeune resté six mois sans emploi ni formation, jusqu'à 7 000 £ pour une petite entreprise, et 2 500 £ par apprenti, pour environ 1,1 milliard de livres par an et 170 000 opportunités (Milburn, 2026, p. 12)."
    - "Kickstart (2020-2022) a ajouté 11 jeunes en emploi non aidé pour 100 participants à 24 mois et rapporté 1,18 £ par livre dépensée (DWP, 2024)."
    - "En France, la Garantie jeunes a relevé l'emploi de 6,3 points à environ 14 mois (évaluation intermédiaire, 2016), sans confirmation sur la seconde cohorte."
    - "En lycée professionnel, un accompagnement vers l'emploi prolongé cinq mois après le bac (AvenirPro, essai randomisé dans 171 lycées) a fait passer l'emploi de 16 % à 23 %, et de 10 % à 20 % pour les élèves les plus éloignés de l'emploi (Cahuc et al., IPP, 2024)."
    - "Financement proposé : 500 millions de livres en 2027/28, 5,8 milliards par an d'ici 2036/37, pour 440 000 jeunes de plus en emploi durable (Milburn, 2026, p. 25 et 30-31) ; montants non engagés par le gouvernement."
  statut: à chiffrer
  maj_le: 2026-11-22
  sujets: [emploi]
  issue_de: "Note IA et jeunes (novembre 2026)"

- id: ia-observatoire
  theme: IA, jeunes et emploi
  titre: "Publier un suivi annuel des postes de débutants face à l'intelligence artificielle"
  explication: "L'Observatoire de France Travail publie chaque année les secteurs et territoires où les postes d'entrée reculent face à l'IA, sur le modèle proposé au Royaume-Uni (Milburn, 2026, p. 72-73). Sa première étude du 17 novembre 2026 auprès de 16 000 employeurs n'isole pas les débutants. Or, entre novembre 2022 et mars 2026, les embauches en CDI des 21-29 ans ont baissé de 28,3 % dans le cinquième des métiers les plus exposés à l'IA, une baisse que l'IA n'explique pas seule, car le resserrement monétaire, la correction du secteur technologique et le télétravail touchent les mêmes métiers (Palladino et al., Banque de France, 2026)."
  preuves:
    - "Observatoire de l'IA et des jeunes, rapport annuel sur les voies d'entrée qui se ferment, par secteur et par territoire (Milburn, 2026, p. 72-73)."
    - "Embauches en CDI des 21-29 ans : -28,3 % dans le cinquième des métiers les plus exposés à l'IA entre novembre 2022 et mars 2026, une baisse que l'IA n'explique pas seule, le télétravail et le resserrement monétaire touchant les mêmes métiers (Palladino et al., Banque de France, 2026)."
  statut: proposition
  maj_le: 2026-11-22
  sujets: [emploi]
  issue_de: "Note IA et jeunes (novembre 2026)"

- id: ia-bases
  theme: IA, jeunes et emploi
  titre: "Maintenir les mathématiques jusqu'en terminale vers le supérieur et encadrer l'accès libre à l'IA"
  explication: "Tout élève visant le supérieur suit des mathématiques jusqu'en terminale, alors qu'aujourd'hui 44,8 % des élèves de terminale générale suivent la spécialité mathématiques et 13,9 % l'option mathématiques complémentaires (DEPP, 2026). Les heures sont prises sur les dotations ou assurées en heures supplémentaires par des enseignants volontaires, sans heure imposée. L'IA en accès libre n'est ouverte qu'après l'acquisition des fondamentaux, car elle fait perdre 17 % à l'examen passé sans elle (Bastani et al., 2025)."
  preuves:
    - "La spécialité mathématiques est suivie par 44,8 % des élèves de terminale générale, et l'option mathématiques complémentaires par 13,9 % (DEPP, 2026)."
    - "L'IA en accès libre fait perdre 17 % à l'examen passé sans elle (Bastani et al., 2025)."
    - "À 15 ans, un tiers des élèves est en difficulté de lecture, contre 15 % en 2000 (DEPP, note d'information 26.40, septembre 2026)."
  statut: à chiffrer
  maj_le: 2026-11-22
  sujets: [emploi, ecrans]
  issue_de: "Note IA et jeunes (novembre 2026)"

- id: ia-marche
  theme: IA, jeunes et emploi
  titre: "Revoir chaque année la carte des bacs professionnels selon les embauches du bassin"
  explication: "La carte des bacs professionnels est réexaminée chaque année selon les embauches locales et les postes ouverts du bassin (France Travail, BMO). Si l'insertion décroche, la section reçoit d'abord des partenariats de stage et d'alternance, sans fermeture automatique sur ce seul critère. À 20 ans, moins d'un jeune Français sur trois travaille (environ 30 % en 2023), contre près de 60 % en Allemagne, au Royaume-Uni et aux États-Unis (CAE, Focus n° 110, 2025, lecture du graphique)."
  preuves:
    - "50 % des étudiants craignent que l'IA remplace le métier qu'ils visent (OpinionWay, 2026), alors qu'un métier exposé reste porteur, à l'image des diplômés de comptabilité qui sont 79 % en emploi à 30 mois (InserSup 2026, calculs GT Éducation)."
    - "À 20 ans, moins d'un jeune Français sur trois est en emploi (environ 30 % en 2023), contre près de 60 % en Allemagne, au Royaume-Uni et aux États-Unis (CAE, Focus n° 110, 2025, lecture du graphique)."
  statut: à chiffrer
  maj_le: 2026-11-22


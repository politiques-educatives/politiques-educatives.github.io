# Propositions du GT Éducation, une entrée par proposition.
# Champs : id, theme, sujets (hubs), issue_de (note d'origine), titre (une ligne), explication (2-4 phrases reprises des notes), preuves (liste : chiffre + source),
#          note (fichier PDF dans assets/notes/), statut (proposition | piste | à chiffrer), maj_le (AAAA-MM-JJ)
# Règle : chaque chiffre vient d'une note ou d'un dossier de recherche du GT, avec sa source. Aucune position du candidat inventée.

# ---------- Temps des professeurs
- id: heures-service-annuel
  theme: Temps des professeurs
  titre: "Un service annuel plafonné, avec du temps réservé au tutorat et au travail d'équipe"
  explication: "Un service en heures par an, avec un plafond d'heures de cours et une part réservée, inscrite dans l'emploi du temps, au tutorat, à la concertation, à l'orientation et à la formation. Proposé d'abord aux volontaires et aux nouveaux recrutés, avec la revalorisation de 20 % prévue par le programme. En France, tout ce qui n'est pas une heure de cours se paie en heures supplémentaires ou ne se fait pas."
  preuves:
    - "Un certifié doit 18 heures de cours par semaine, un agrégé 15, un professeur des écoles 24 heures plus 108 heures par an (décrets de 2008 et 2014)."
    - "Le contrat écossais fixe une semaine de 35 heures, dont 22,5 heures de cours au plus (SNCT) : 855 heures de cours sur 1 365 heures de travail par an (OCDE, 2026)."
    - "Le second professeur principal de terminale, créé fin 2017, est payé par une indemnité, sans aucune heure dégagée."
  note: EDUCATION-note1-allocation-heures-enseignement.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [formation]
  issue_de: "Note 1 : l'allocation des heures d'enseignement (novembre 2026)"

- id: heures-emploi-du-temps
  theme: Temps des professeurs
  titre: "Un emploi du temps construit par l'établissement, avec le tutorat pendant la journée"
  explication: "Le chef d'établissement répartit le service avec le conseil pédagogique : cours en barrette pour composer des groupes temporaires, une heure de concertation par semaine pour l'équipe de niveau, le tutorat dans la journée et non après la dernière heure, en petits groupes et par des enseignants."
  preuves:
    - "Sur 96 essais randomisés, le tutorat améliore les résultats de 0,37 écart-type, davantage pendant le temps scolaire (0,40) qu'après (0,21), avec des enseignants (0,50) qu'avec des bénévoles (0,21) (Nickow, Oreopoulos et Quan, 2020 ; 0,29 sur 89 essais dans la version publiée en 2024)."
    - "L'effet est plus faible au collège et au lycée et tombe au tiers ou à la moitié à grande échelle (Kraft et al., 2024)."
    - "Les groupes de niveau au sein de la classe gagnent 0,19 à 0,30 écart-type ; les classes séparées par niveau, presque rien (Steenbergen-Hu et al., 2016), mais elles creusent les écarts (Terrin et Triventi, 2023)."
  note: EDUCATION-note1-allocation-heures-enseignement.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [formation]
  issue_de: "Note 1 : l'allocation des heures d'enseignement (novembre 2026)"

- id: heures-dotation
  theme: Temps des professeurs
  titre: "Une dotation calculée selon les élèves et leurs besoins"
  explication: "Calculée en heures de service, selon le nombre d'élèves et la part d'élèves en difficulté aux évaluations nationales, avec une majoration par élève défavorisé sur le modèle du pupil premium. Aujourd'hui, les moyens suivent la structure des classes, pas les besoins des élèves."
  preuves:
    - "La dotation horaire globale d'un collège se calcule à partir des heures de cours dues aux classes, puis le conseil d'administration en vote la répartition."
    - "En Angleterre, le programme national de tutorat est passé à partir de 2021 par les écoles ; ses effets mesurés sont faibles, un mois de progrès au plus (NFER, 2024)."
  note: EDUCATION-note1-allocation-heures-enseignement.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [formation]
  issue_de: "Note 1 : l'allocation des heures d'enseignement (novembre 2026)"

- id: heures-mercredi
  theme: Temps des professeurs
  titre: "Le mercredi matin, décidé par bassin, avec la région et les communes"
  explication: "Le retour à neuf demi-journées se décide avec la région (transports) et les communes (périscolaire), par réseau de transport, et s'accompagne du service annuel."
  preuves:
    - "Le primaire français se fait sur 162 jours, contre 183 dans l'OCDE et 190 en Angleterre."
    - "À la rentrée 2023, 93 % des communes ayant une école publique étaient à la semaine de quatre jours (QE AN n° 3908, 2025) ; la Cour des comptes juge l'organisation du temps scolaire « en décalage avec les besoins des élèves » (2025)."
  note: EDUCATION-note1-allocation-heures-enseignement.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [formation]
  issue_de: "Note 1 : l'allocation des heures d'enseignement (novembre 2026)"

- id: heures-charge
  theme: Temps des professeurs
  titre: "Mesurer chaque année la charge de travail réelle des enseignants"
  explication: "Une enquête annuelle sur le temps de travail des enseignants, comme en Angleterre, pour que l'annualisation ne fasse pas glisser la charge, comme en Écosse. Un plafond seul ne suffit pas."
  preuves:
    - "En Écosse, les enseignants déclarent 46 heures de travail sur une semaine type, 11 de plus que leur semaine contractuelle (UWS pour l'EIS, 2024)."
    - "Un enseignant anglais de collège déclarait 49,3 heures de travail par semaine, contre environ 41 dans l'OCDE (TALIS 2018) ; l'enquête anglaise de 2025 donne 50,1 heures (DfE, 2025)."
  note: EDUCATION-note1-allocation-heures-enseignement.pdf
  statut: proposition
  maj_le: 2026-11-18

# ---------- Gouvernance
  sujets: [formation]
  issue_de: "Note 1 : l'allocation des heures d'enseignement (novembre 2026)"

- id: gouv-recruter
  theme: Gouvernance de l'établissement
  titre: "Recruter une part des enseignants sur projet, d'abord dans les établissements les moins demandés"
  explication: "Une part des postes de chaque établissement pourvue sur profil par le chef d'établissement et le conseil pédagogique, en priorité dans les établissements les moins demandés, avec une prime d'affectation, et une évaluation prévue dès le départ."
  preuves:
    - "Les enseignants sont affectés par le mouvement inter et intra-académique selon un barème de points ; les débutants sont plus souvent affectés en éducation prioritaire (DEPP, 2026)."
    - "Les collèges en difficulté devenus academies de 2002 à 2010, qui changeaient souvent de direction, ont progressé d'environ 0,2 écart-type en quatre ans (Eyles et Machin, 2019) ; ceux convertis après 2010 n'ont pas gardé d'avance (EPI, 2016)."
    - "Le recrutement sur profil, par exemple dans les écoles de Marseille, n'a pas encore été évalué (Cour des comptes, 2024)."
  note: EDUCATION-note2-gouvernance-etablissement.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [formation]
  issue_de: "Note 2 : qui décide dans l'établissement ? (novembre 2026)"

- id: gouv-coordinateurs
  theme: Gouvernance de l'établissement
  titre: "Un coordinateur par discipline et par niveau, avec une décharge de service"
  explication: "Un échelon intermédiaire qui organise les groupes, le tutorat et l'observation entre pairs. En Angleterre, les responsables de discipline et de niveau (middle leaders), payés par des primes de responsabilité, forment cet échelon qui manque en France."
  preuves:
    - "Dans 82 collèges anglais, l'observation mutuelle a gagné 0,07 écart-type au GCSE, et la doubler n'a rien ajouté (Burgess, Rawal et Taylor, 2021) ; l'évaluation officielle du même essai ne trouve aucun effet (EEF, 2017)."
  note: EDUCATION-note2-gouvernance-etablissement.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [formation]
  issue_de: "Note 2 : qui décide dans l'établissement ? (novembre 2026)"

- id: gouv-visite
  theme: Gouvernance de l'établissement
  titre: "Une visite-conseil tous les deux ans pour chaque enseignant, chaque année pour les débutants"
  explication: "Assurée par l'inspecteur ou par des enseignants expérimentés formés à l'observation, avec un plan de formation inscrit dans le service. Après le dernier rendez-vous de carrière, vers la dix-neuvième année de métier, aucune visite de classe n'est obligatoire."
  preuves:
    - "À Cincinnati, une année d'évaluation fondée sur quatre observations, dont trois par des pairs formés, a relevé d'environ 0,10 écart-type les résultats en maths des élèves les années suivantes (Taylor et Tyler, 2012)."
    - "Les quelque 3 650 inspecteurs territoriaux (Cour des comptes, 2022) consacrent environ 30 % de leur activité à l'évaluation des enseignants dans le premier degré, 20 à 30 % dans le second."
  note: EDUCATION-note2-gouvernance-etablissement.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [formation]
  issue_de: "Note 2 : qui décide dans l'établissement ? (novembre 2026)"

- id: gouv-evaluation
  theme: Gouvernance de l'établissement
  titre: "Un corps spécialisé pour évaluer les établissements, appuyé sur la valeur ajoutée"
  explication: "Distinct de l'inspection des enseignants, sur le modèle de l'Ofsted, il s'appuie sur des IVAC et IVAL étendus au-delà du brevet et du bac. La DEPP publie une valeur ajoutée par lycée depuis 1993 et par collège depuis 2024, sans rôle dans l'évaluation des établissements."
  preuves:
    - "Un échec à l'inspection a relevé les résultats des élèves de 0,12 écart-type en maths en primaire (Hussain, 2015) et d'environ 0,1 dans le secondaire (Allen et Burgess, 2012)."
    - "Depuis novembre 2025, l'Ofsted note chaque établissement sur cinq niveaux, domaine par domaine, sans note globale, environ tous les quatre ans."
  note: EDUCATION-note2-gouvernance-etablissement.pdf
  statut: proposition
  maj_le: 2026-11-18

# ---------- Orientation et bac
  sujets: [formation]
  issue_de: "Note 2 : qui décide dans l'établissement ? (novembre 2026)"

- id: orient-4e
  theme: Orientation et bac
  titre: "Orienter dès la 4e, avec un tuteur référent jusqu'en terminale"
  explication: "Le tuteur de l'élève est son référent d'orientation de la 4e à la terminale : un entretien par trimestre, des heures dans son service, une formation sur les filières. Le second professeur principal de terminale, sans heures ni formation, n'a pas marché."
  preuves:
    - "Un tiers des lycées seulement a tenu les deux semaines d'orientation (Cnesco, 2018)."
    - "En Allemagne, un an de mentorat par des étudiants a amélioré de 0,5 écart-type les perspectives des élèves défavorisés (Resnjanskij et al., 2024)."
    - "En fin de 3e, 38,6 % des élèves du public entrent en voie professionnelle, et les premiers vœux y sont les moins souvent satisfaits (58,1 %, contre 87 % en seconde générale ; DEPP, 2025)."
    - "Coût de travail du tuteur référent compté dans le service : 30 à 50 millions d'euros par an (calcul de travail à confirmer)."
  note: EDUCATION-note3-orienter.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [orientation]
  issue_de: "Note 3 : orienter plus tôt, et rendre au bac sa valeur (octobre 2026, mise à jour novembre 2026)"

- id: orient-parents
  theme: Orientation et bac
  titre: "Deux réunions avec les parents des élèves de 4e et de 3e en difficulté"
  explication: "Étendre à toute la 4e et la 3e un dispositif testé en France, pour un coût quasi nul."
  preuves:
    - "Deux réunions avec les parents d'élèves de 3e en difficulté ont réduit de 25 à 40 % le redoublement et le décrochage (Goux, Gurgand et Maurin, 2017)."
    - "Une heure d'intervention d'une scientifique en classe fait passer de 11 % à 14,5 % la part des filles qui entrent dans une formation scientifique sélective (Breda et al., 2023)."
  note: EDUCATION-note3-orienter.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [orientation]
  issue_de: "Note 3 : orienter plus tôt, et rendre au bac sa valeur (octobre 2026, mise à jour novembre 2026)"

- id: orient-gatsby
  theme: Orientation et bac
  titre: "Un cadre national d'orientation mesuré dans chaque établissement, à l'anglaise"
  explication: "Les huit repères Gatsby (information sur les métiers, rencontres avec des employeurs, stages, entretien individuel) sont mesurés dans chaque établissement anglais. Le rapport Milburn propose d'aller plus loin : une norme « prêt pour le travail » inspectée et la publication de ce que deviennent les élèves de chaque établissement."
  preuves:
    - "Les établissements anglais atteignent 6,0 repères sur 8 en moyenne ; ceux qui les atteignent tous comptent 8 % de jeunes sans emploi ni formation en moins, un lien qui n'est pas encore causal (Careers & Enterprise Company, 2024)."
    - "Norme « prêt pour le travail » inspectée par l'Ofsted et obligation légale de stage en entreprise (Milburn, 2026, p. 14-15)."
  note: EDUCATION-note3-orienter.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [orientation]
  issue_de: "Note 3 : orienter plus tôt, et rendre au bac sa valeur (octobre 2026, mise à jour novembre 2026)"

- id: orient-bac
  theme: Orientation et bac
  titre: "Un bac qui départage : épreuves nationales anonymes et admissions conditionnelles"
  explication: "Réduire la part du contrôle continu et faire peser les épreuves terminales de spécialité, corrigées anonymement, dans l'admission. Une proposition d'admission en licence est confirmée en juillet si l'élève atteint une note fixée par la formation dans les spécialités utiles, comme les offres conditionnelles britanniques. Ceux qui n'atteignent pas la barre ont une année préparatoire ou une place en BTS et en BUT."
  preuves:
    - "En 2025, 91,8 % des candidats ont été reçus au bac, 96,4 % dans la voie générale, et 58,8 % avec mention (DEPP, 2025)."
    - "Parmi les bacheliers 2018 inscrits en licence, 46,9 % l'ont obtenue en trois ou quatre ans ; parmi ceux de 2020, 40,3 % (SIES, 2023 et 2025)."
    - "Le passage en deuxième année atteint 70 % pour les bacheliers mention très bien, contre 49,1 % pour l'ensemble des néo-bacheliers en 2024 : le bac contient l'information, mais il ne s'en sert pas."
  note: EDUCATION-note3-orienter.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [orientation]
  issue_de: "Note 3 : orienter plus tôt, et rendre au bac sa valeur (octobre 2026, mise à jour novembre 2026)"

- id: orient-transparence
  theme: Orientation et bac
  titre: "La transparence sur tout le parcours, de la 4e au premier emploi"
  explication: "Mettre bout à bout les données publiques (DEPP, SIES, Parcoursup, InserSup, InserJeunes) pour montrer à un élève de 4e ou de 3e les débouchés de chaque voie, la réussite en licence selon le bac, l'emploi, les salaires et ce que l'IA sait déjà faire de ces métiers. C'est un outil d'égalité des chances, car les familles initiées connaissent déjà les règles que les autres découvrent trop tard. Prototype : la Boussole des formations (onglet Boussole)."
  preuves:
    - "Réussite en licence en 3 ou 4 ans : 46,1 % après un bac général contre 6,5 % après un bac professionnel (SIES, Note Flash 2025-29)."
    - "Emploi à 6 mois : 43 % après un bac pro, 59 % après un BTS (DEPP, InserJeunes, RERS 2025)."
    - "Au Chili, cette transparence a réduit de 4,6 % les choix de filières peu payées chez les jeunes modestes (Hastings, Neilson et Zimmerman, 2015)."
  note: EDUCATION-note3-orienter.pdf
  statut: proposition
  maj_le: 2026-11-18
  sujets: [orientation]
  issue_de: "Proposition 3 du GT : la transparence sur tout le parcours (novembre 2026)"

- id: orient-debouches
  theme: Orientation et bac
  titre: "Publier l'emploi, le salaire et l'exposition à l'IA de chaque formation, master compris"
  explication: "Pour chaque formation de Parcoursup, une note de résilience à l'IA de A à E, à côté du salaire et du taux d'emploi à 30 mois (InserSup), et les postes ouverts dans le bassin. Le rapport Milburn recommande aussi de rendre visibles les salaires des diplômés de chaque formation du supérieur."
  preuves:
    - "Entre novembre 2022 et mars 2026, les embauches en CDI des 21-29 ans ont baissé de 28,3 % dans les métiers les plus exposés à l'IA, contre 7,5 % dans les moins exposés (Palladino, Bergeaud, Bertheau, Bunel et Degos, 2026)."
    - "La Boussole classe les 13 819 formations de Parcoursup 2025 en 39 familles et affiche l'emploi et le salaire de 2 427 masters d'université (InserSup 2026)."
    - "Salaires des diplômés de chaque formation du supérieur rendus visibles (Milburn, 2026, p. 15-16)."
  note: EDUCATION-note3-orienter.pdf
  statut: proposition
  maj_le: 2026-11-18

# ---------- IA, jeunes et emploi
  sujets: [orientation, emploi]
  issue_de: "Note 3 : orienter plus tôt, et rendre au bac sa valeur (octobre 2026, mise à jour novembre 2026)"

- id: ia-master
  theme: IA, jeunes et emploi
  titre: "Un jeune a-t-il vraiment besoin d'un master ? Une licence qui mène à un métier"
  explication: "Interroger les employeurs publics et privés sur leurs vrais besoins en bac+5. Construire une licence qui mène à un métier et finie à temps : stage long ou alternance obligatoire en L3 et développement des licences professionnelles. Réserver le master à la recherche, aux études longues, à la réorientation ou à l'alternance. Le master sert souvent de filtre plus que de compétence : injuste pour les enfants d'ouvriers, coûteux, et il retarde de deux ans l'entrée dans la vie active."
  preuves:
    - "Emploi salarié à 30 mois : 78 % après une licence professionnelle, 69 % après un master, 50 % après une licence générale, 77 % après un master en alternance (InserSup 2026)."
    - "À 26-27 ans, avoir terminé le master plutôt qu'arrêté en dernière année ajoute 15 points à la probabilité d'être cadre, mais seulement 4 % au salaire, pour un emploi presque identique, 90 % contre 87 % (Insee Première n° 2109, juin 2026)."
    - "Le diplôme ne décide du choix final que dans 11 % des recrutements, 22 % pour les cadres, et 73 % des recruteurs auraient pu embaucher un candidat moins diplômé mais plus expérimenté (Dares, enquête Ofer 2016)."
    - "Les enfants d'ouvriers passent de 10 % des étudiants en licence à 6 % en master, contre 31 % à 42 % pour les enfants de cadres ; un master coûte environ 24 500 € par jeune à l'État (RERS 2025)."
    - "Seuls 30 % des étudiants obtiennent leur licence en trois ans (SIES, Note Flash n° 29, novembre 2025)."
  statut: à chiffrer
  maj_le: 2026-11-18
  sujets: [emploi]
  issue_de: "Note IA et jeunes (novembre 2026)"

- id: ia-garantie
  theme: IA, jeunes et emploi
  titre: "Une garantie pour chaque jeune sans emploi ni formation, sur le modèle Milburn"
  explication: "Le rapport Milburn propose une garantie légale d'opportunité et de soutien pour tout jeune de 18 à 24 ans sans emploi ni formation : un emploi, une formation professionnelle, un apprentissage, un stage jusqu'à 12 semaines ou un service civique, un conseiller sous 14 jours et un plan personnel sous 4 semaines. Le gouvernement britannique en soutient le principe. Transposition aux missions locales et au contrat d'engagement jeune à chiffrer (détail : onglet Milburn)."
  preuves:
    - "Aide à l'employeur de 3 000 £ par embauche d'un jeune resté six mois sans emploi ni formation, jusqu'à 7 000 £ pour une petite entreprise, et 2 500 £ par apprenti, pour environ 1,1 milliard de livres par an et 170 000 opportunités (Milburn, 2026, p. 12)."
    - "Kickstart (2020-2022) a ajouté 11 jeunes en emploi non aidé pour 100 participants à 24 mois et rapporté 1,18 £ par livre dépensée (DWP, 2024)."
    - "En France, la Garantie jeunes a relevé l'emploi de 6,3 points à environ 14 mois (évaluation intermédiaire, 2016), sans confirmation sur la seconde cohorte."
    - "Financement proposé : 500 millions de livres en 2027/28, 5,8 milliards par an d'ici 2036/37, pour 440 000 jeunes de plus en emploi durable (Milburn, 2026, p. 25 et 30-31) ; montants non engagés par le gouvernement."
  statut: à chiffrer
  maj_le: 2026-11-18
  sujets: [emploi]
  issue_de: "Note IA et jeunes (novembre 2026)"

- id: ia-observatoire
  theme: IA, jeunes et emploi
  titre: "Un suivi annuel des postes de débutants face à l'IA"
  explication: "L'Observatoire France Travail pourrait publier chaque année les secteurs et territoires où les postes d'entrée reculent face à l'IA, sur le modèle de l'observatoire proposé au Royaume-Uni. Sa première étude, parue le 17 novembre 2026 auprès de 16 000 employeurs, ne porte pas sur les débutants."
  preuves:
    - "Observatoire de l'IA et des jeunes, rapport annuel sur les voies d'entrée qui se ferment, par secteur et par territoire (Milburn, 2026, p. 72-73)."
    - "Embauches en CDI des 21-29 ans : -28,3 % dans le cinquième des métiers les plus exposés à l'IA entre novembre 2022 et mars 2026, une baisse dont une partie vient du télétravail (LIFT, 2026)."
  statut: à chiffrer
  maj_le: 2026-11-18
  sujets: [emploi]
  issue_de: "Note IA et jeunes (novembre 2026)"

- id: ia-bases
  theme: IA, jeunes et emploi
  titre: "De bonnes bases pour tous : les maths jusqu'en terminale, pas d'IA en accès libre avant les fondamentaux"
  explication: "Rétablir les mathématiques jusqu'en terminale pour tous les élèves visant le supérieur, et refuser l'IA en accès libre avant l'acquisition des fondamentaux. Seuil exact à trancher par l'équipe programme, coût à chiffrer."
  preuves:
    - "Les mathématiques sont suivies par 44,8 % des élèves de terminale aujourd'hui (DEPP, 2026)."
    - "L'IA en accès libre fait perdre 17 % à l'examen passé sans elle (Bastani et al., 2025)."
    - "À 15 ans, un tiers des élèves est en difficulté de lecture, contre 15 % en 2000 (DEPP, note d'information 26.40, septembre 2026)."
  statut: à chiffrer
  maj_le: 2026-11-18
  sujets: [emploi, ecrans]
  issue_de: "Note IA et jeunes (novembre 2026)"

- id: ia-marche
  theme: IA, jeunes et emploi
  titre: "Une orientation qui suit le marché du travail, jusqu'à la carte des bacs pro"
  explication: "Afficher sur Parcoursup et en bac pro l'emploi et le salaire à 30 mois, les postes ouverts dans le bassin (France Travail, BMO) et le profil d'exposition à l'IA ; revoir chaque année la carte des bacs pro selon les embauches locales."
  preuves:
    - "50 % des étudiants craignent que l'IA remplace le métier qu'ils visent (OpinionWay, 2026), alors qu'un métier exposé reste porteur, à l'image des diplômés de comptabilité qui sont 79 % en emploi à 30 mois (InserSup 2026, calculs GT Éducation)."
    - "À 20 ans, seuls 20 % des jeunes Français sont en emploi, contre environ 60 % en Allemagne, au Royaume-Uni et aux États-Unis (CAE, Bozio et Wasmer, 2026)."
  statut: à chiffrer
  maj_le: 2026-11-18

# ---------- Santé mentale et écrans
  sujets: [emploi]
  issue_de: "Note IA et jeunes (novembre 2026)"

- id: tuteur-public
  theme: Tuteur IA
  titre: "Un tuteur IA public, vocal, qui ne donne jamais la solution avant une tentative"
  explication: "Un tuteur à indices gradués, avec un volet orientation de la 6e à la terminale, commandé par appel d'offres et testé avant toute généralisation, plutôt que des cours d'IA."
  preuves:
    - "Les tuteurs structurés qui guident sans donner la réponse améliorent les résultats de 0,3 à 0,6 écart-type (De Simone et al., 2025 ; Henkel et al., 2024 ; Kestin et al., 2025)."
    - "L'accès libre à l'IA fait baisser les notes aux examens passés sans elle de 17 à 24 % (Bastani et al., 2025 ; Strömberg, Lei et Wu, 2026)."
  note: ""
  statut: proposition
  maj_le: 2026-11-18
  sujets: [ecrans]
  issue_de: "Note sur un tuteur IA pour l'Éducation nationale (octobre 2026)"

- id: tuteur-marche
  theme: Tuteur IA
  titre: "Un marché public en quatre lots, payé en partie selon les résultats d'un essai"
  explication: "Éviter l'erreur de MIA Seconde : séparer conception pédagogique et garde-fous, accès aux modèles par une passerelle publique (API Albert), voix sur des modèles français ouverts, et données d'orientation. Changer de modèle sous trois mois, remettre le modèle en concurrence tous les 12 à 24 mois, et lier 20 à 30 % du paiement aux résultats d'un essai indépendant."
  preuves:
    - "MIA Seconde, commandé en 2022 pour 2,8 M€ sur trois ans, a été livré avec un an de retard, sans résultats publiés (Next, 2024)."
  note: ""
  statut: proposition
  maj_le: 2026-11-18
  sujets: [ecrans]
  issue_de: "Note sur un tuteur IA pour l'Éducation nationale (octobre 2026)"

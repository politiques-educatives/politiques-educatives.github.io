- id: disc-inspection-tests
  theme: Discriminations à l'embauche
  titre: "Autoriser l'inspection du travail à tester d'office les employeurs pour constater les discriminations"
  explication: "Seules 15 % des personnes discriminées à l'embauche engagent une démarche (Défenseur des droits, décembre 2025, p. 6), et aucune condamnation pénale n'a été prononcée en 2020 (Sénat, rapport de CMP n° 525, 2024, p. 4). Les inspecteurs du travail pourront réaliser des candidatures fictives et appels mystère de leur propre initiative, sans attendre une plainte, en ciblant leurs contrôles grâce aux testings statistiques. Aucune évaluation causale ne mesurant encore ce pouvoir, il s'agit d'une piste à tester."
  preuves:
    - "15 % des personnes discriminées à l'embauche engagent une démarche, en 2024 (Défenseur des droits, décembre 2025, p. 6)"
    - "Aucune condamnation pénale pour discrimination en 2020, selon le rapporteur de la proposition de loi sur les tests (Sénat, rapport de CMP n° 525, 2024, p. 4)"
    - "Aucune évaluation causale de ce pouvoir d'inspection trouvée"
    - "Coût : à chiffrer"
  statut: piste

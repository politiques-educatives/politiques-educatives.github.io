- titre: "Andy Burnham, « This is huge. »"
  url: https://www.instagram.com/reel/Ddw6blOxZJn/
  meta: "49 s ; 55 900 mentions « j'aime »"
  resume: "Un problème de la vie courante : beaucoup de jeunes ont renoncé à devenir propriétaires. Il lance « Your First Home » : acheter un logement neuf avec un apport de 2,5 %. Un escabeau jaune à l'image figure « l'échelle du logement »."
  lecon: "Un problème du quotidien et un objet-métaphore à l'image."
- titre: "rosie_wrighting, « My take on calling Gen Z the snowflake generation »"
  url: https://www.instagram.com/reel/Df2jFXMq7Sh/
  meta: "79 s, devant le Parlement"
  resume: "Elle conteste le cliché d'une génération « flocon de neige » qui ne voudrait pas travailler : près d'un jeune sur huit est hors emploi, études ou formation. Les jeunes veulent ces opportunités mais peinent à y accéder. Elle termine en demandant aux jeunes d'écrire en commentaire les obstacles rencontrés."
  lecon: "Une voix jeune qui retourne un cliché ; le commentaire comme suite de la vidéo."
- titre: "Andy Burnham, « Licence to skill... »"
  url: https://www.instagram.com/reel/Df2Xu9BnK_j/
  meta: "29 s ; 16 000 mentions « j'aime »"
  resume: "Ouverture humoristique : « work as hard as Robert Pattinson's agent to get you a job ». Puis : investir maintenant dans les jeunes ou en payer le prix. Trois leviers : apprentissages, formation, santé mentale plus tôt."
  lecon: "Une blague d'ouverture, trois leviers, une chute qui revient à la blague."
- titre: "Andy Burnham, « Young people deserve better. »"
  url: https://www.instagram.com/reel/Df2EVpqADpZ/
  meta: "50 s ; 10 300 mentions « j'aime », 924 commentaires"
  resume: "Billets en main : pour 25 £ dépensées en allocations pour les jeunes, 1 £ seulement va à les aider vers le travail ou la formation. Cinq mesures en rafale, de l'apprentissage aussi normal que l'université à une nouvelle allocation pour les moins de 25 ans. Les commentaires attaquent surtout la réforme des aides aux jeunes handicapés."
  lecon: "Un chiffre comparatif en une phrase ; prévoir la riposte sur les aides."
- titre: "Sky News (Lucy McDaid), « Under 25? Here's the plan to get you a job »"
  url: https://www.instagram.com/reel/Df2ofDfBsPu/
  meta: "80 s ; environ 1 000 mentions « j'aime », 403 partages"
  resume: "Une journaliste politique résume le plan Milburn en cinq points, rapport en main, un mot-clé incrusté par point : « Youth Allowance », « Job opportunity / Help to get job », « £7,000 for small businesses », « More apprenticeships », « £500m to get it started ». Les chiffres correspondent au rapport (p. 12 et 25)."
  lecon: "Un explicateur neutre en cinq points numérotés, un chiffre par point, ouvert par une question directe au public."

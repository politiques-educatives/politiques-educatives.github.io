- titre: 'Le rapport Milburn : ce que le Royaume-Uni propose pour ses jeunes sans emploi ni formation'
  auteur: Adrien Joly, GT Éducation
  pdf: EDUCATION-note-rapport-milburn.pdf
  date: 19 novembre 2026
  pays: Royaume-Uni
  sujets:
  - emploi
  - orientation
  bref:
  - 'Le 17 novembre 2026, Alan Milburn a remis au ministère du Travail britannique (DWP) un rapport de 278 pages intitulé « From a Welfare State to a Working State: a new settlement for the next generation », alors que 981 000 jeunes de 16 à 24 ans ne sont ni en emploi, ni en études, ni en formation (NEET), soit 13,0 % (ONS, 2026).'
  - Le texte propose une garantie légale d'opportunité pour les 18-24 ans, un emploi payé en dernier recours et un objectif de taux de NEET ramené vers 5 % d'ici 2036 (Milburn, 2026, p. 8, p. 21-23).
  - Le gouvernement reprend le principe de cette garantie et préparera un livre blanc début 2027 avant une loi (déclaration du ministre du Travail, 17 novembre 2026).
  sections:
  - titre: Le constat
    paragraphes:
    - En avril-juin 2026, le Royaume-Uni compte 981 000 NEET de 16 à 24 ans, soit 13,0 % de cette classe d'âge (ONS, 2026). Six sur dix n'ont jamais occupé d'emploi (Milburn, 2026, p. 4). Chez les 15-24 ans, ce taux atteint 13,6 % au Royaume-Uni contre environ 4 % aux Pays-Bas (OCDE 2025, cité par Milburn, 2026, p. 31 et 160).
    - 'La santé pèse lourd : 28,4 % des NEET citent un handicap ou une maladie comme raison principale (Milburn, 2026, p. 120). Parmi les NEET handicapés, la part évoquant la santé mentale est passée de 24,3 % en 2011 à 42,6 % en 2025 (Milburn, 2026, p. 120). Face à la technologie, 55 % des jeunes disent que le progrès technique les rend incertains sur leur avenir, et 19 % pensent qu''il créera plus d''opportunités (Youth Voice Census 2026, cité par Milburn, 2026, p. 37).'
    - En 2024-2025, l'État dépense 25 £ en prestations pour 1 £ d'accompagnement vers l'emploi. Le rapport vise un ratio de 2 pour 1 en dix ans (Milburn, 2026, p. 25).
  - titre: Ce que propose le rapport
    paragraphes:
    - 'L''objectif national est de ramener le taux de NEET vers 5 % d''ici 2036 (Milburn, 2026, p. 8). Pour chaque jeune de 18 à 24 ans sans emploi ni formation, la loi inscrirait une garantie d''opportunité, quelle que soit sa situation face aux prestations : emploi, formation, apprentissage, stage jusqu''à 12 semaines ou service civique, assortie d''une garantie de soutien en santé, emploi et aide pratique (Milburn, 2026, p. 21-22). En dernier recours, un emploi payé de six mois serait proposé après 12 mois sans emploi ni formation, contre 18 aujourd''hui (Milburn, 2026, p. 22-23). En Angleterre, un service local assurerait un conseiller sous 14 jours et un plan d''insertion sous 4 semaines (Milburn, 2026, p. 23), avec un accès accéléré aux thérapies de santé mentale pour ceux qui suivent un plan (Milburn, 2026, p. 18).'
    - À l'école, le rapport prévoit un repérage obligatoire des élèves à risque, une obligation légale de stage, une norme « prêt pour le travail » inspectée par l'Ofsted et la publication du devenir des élèves par établissement (Milburn, 2026, p. 14-15). Il vise environ 270 000 entrées annuelles en apprentissage chez les moins de 25 ans d'ici 2036 (Milburn, 2026, p. 9 et 16-17), ainsi qu'un observatoire de l'intelligence artificielle (IA) publiant chaque année les secteurs et territoires où les postes de débutants reculent (Milburn, 2026, p. 72-73). Le coût irait de 500 M£ en 2027-2028 jusqu'à 5,8 Md£ par an en 2036-2037, compensés en partie par 3,6 Md£ d'économies sur les prestations (Milburn, 2026, p. 25 et 30-31).
  - titre: Ce que le gouvernement a retenu
    paragraphes:
    - 'Le gouvernement soutient le principe de la garantie et le service local, crée une unité auprès du Premier ministre et publiera un livre blanc début 2027 avant une loi (déclaration du ministre du Travail, 17 novembre 2026). Il s''appuie sur une garantie d''emploi déjà annoncée pour les 18-24 ans bénéficiaires de l''Universal Credit : jusqu''à 25 heures par semaine pendant six mois, ouverte après 12 mois dès avril 2027 pour plus de 90 000 jeunes d''ici mars 2029, avec 3 000 £ pour l''employeur qui embauche ensuite (DWP, 14 novembre 2026). Il ne répond pas encore sur l''observatoire de l''IA, l''objectif d''apprentissage, la baisse de cotisations ni la réforme des prestations.'
  - titre: Le débat
    paragraphes:
    - La Resolution Foundation juge l'ambition à la bonne échelle. Elle estime toutefois l'allocation des moins de 25 ans insuffisante et craint des perdants parmi les jeunes qui ne peuvent pas travailler (Resolution Foundation, 17 novembre 2026).
  - titre: Et en France ?
    paragraphes:
    - Chez les 15-24 ans, le taux de NEET est de 10,5 % en France en 2023 (Insee, 2025), contre 13,6 % au Royaume-Uni sur cette même tranche d'âge (OCDE 2025, cité par Milburn, 2026, p. 31 et 160). La France dispose déjà d'une obligation de formation de 16 à 18 ans depuis 2020, d'un réseau local (missions locales, France Travail) et du contrat d'engagement jeune, successeur de la Garantie jeunes. Celle-ci avait accru de 6,3 points le taux d'emploi environ 14 mois après l'entrée pour la première cohorte (comité scientifique, 2016), résultat non confirmé pour la deuxième cohorte.
    - 'Trois propositions de Milburn n''ont pas d''équivalent français : l''emploi garanti en dernier recours, la publication du devenir des élèves de chaque établissement et le suivi public des postes de débutants touchés par l''IA. La première étude de l''Observatoire France Travail, menée auprès de plus de 16 000 employeurs, ne dit encore rien des débutants (France Travail, 17 novembre 2026).'
  sources: Milburn (2026), rapport final, DWP ; ONS (2026), NEET, août 2026 ; DWP (2026), communiqués des 14 et 17 novembre ; déclaration du ministre du Travail, 17 novembre 2026 ; Resolution Foundation (2026) ; comité scientifique de la Garantie jeunes (2016) ; Insee (2025), Formations et emploi ; France Travail (2026), Observatoire.

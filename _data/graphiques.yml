# Graphiques interactifs (Vega-Lite, dessinés dans le navigateur depuis assets/charts/data/<csv>.csv, colonnes categorie, serie, valeur).
# type : barres (categorie en x, serie en couleur) | barres-h (categorie en y) | ligne (categorie = année en x, serie en couleur)
#        | carte (départements de métropole, contours assets/charts/geo/departements.geojson ; CSV : categorie = code du département,
#          serie = nom, valeur ; DROM dans le CSV mais pas sur la carte ; données écrites par scripts/build_cartes.py depuis ../data/raw-new/)
#          options de carte : echelle (palette Vega, défaut blues), inverse: true (couleur la plus foncée pour la plus petite valeur),
#          milieu (valeur centrale d'une palette divergente, ex. 0)
# auto : true = données actualisées chaque mois par .github/workflows/charts.yml (InserSup)
- id: aesh
  sujet: inclusion
  titre: "Trois fois plus d'AESH qu'en 2017"
  type: barres
  unite: "AESH"
  source: "Sénat, rapport PLF 2026 (139 993 en 2025) ; Cnesco, Regards actualisés n° 1, juin 2026 (environ 43 000 en 2017, valeur arrondie)"
  note: "Les AESH gagnent en moyenne 1 030 euros nets par mois, pour une quotité moyenne de 62 % ; 72 % sont en CDI (Assemblée nationale, rapport n° 3382, octobre 2026)."
- id: mdph
  sujet: inclusion
  titre: "Les MDPH traitent les demandes au-delà du délai légal"
  type: ligne
  unite: "mois"
  source: "CNSA, Mon Parcours Handicap (délai moyen de traitement, tous droits, T4 2021 et T2 2022) ; réponse à la question écrite AN n° 16046, août 2026 (T2 2025)"
  note: "Le délai légal est de 4 mois ; il varie de 2,2 mois (Cantal) à bien davantage selon les départements."
- id: seconde
  sujet: ecrans
  titre: "Plus d'élèves de seconde dans les groupes les plus faibles qu'en 2019"
  type: barres
  unite: "% des élèves"
  source: "DEPP, test de positionnement de début de seconde 2026"
  note: "Le communiqué du ministère compare à 2021 ; le rapport de la DEPP compare à 2019."
- id: pisa
  sujet: ecrans
  titre: "Un tiers des élèves de 15 ans en difficulté de lecture"
  type: ligne
  unite: "% sous le niveau 2 (PISA, compréhension de l'écrit)"
  source: "DEPP, note d'information 26.40, septembre 2026 (PISA 2025)"
  note: "La baisse n'est pas propre à la France : son score a perdu 18 points depuis 2022, contre 14 en moyenne dans l'OCDE."
- id: depression
  sujet: ecrans
  titre: "Un lycéen sur cinq à risque important de dépression, deux fois plus chez les filles"
  type: barres-h
  unite: "% des lycéens"
  source: "Santé publique France, enquête EnCLASS 2024 (juin 2026)"
  note: "Les études ne relient pas encore la santé mentale à la baisse des résultats scolaires."
- id: psy
  sujet: ecrans
  titre: "Jusqu'à deux fois plus d'élèves par psychologue qu'en Finlande"
  type: barres-h
  unite: "élèves par psychologue"
  source: "Cour des comptes, avril 2020, annexe 12 (France, PsyEN, 2018-2019) ; Finlande : loi sur le bien-être des élèves modifiée en 2021"
  note: "La Finlande garantit aussi un rendez-vous sous 7 jours."
- id: insersup
  sujet: emploi
  titre: "La licence professionnelle insère mieux que le master"
  type: barres-h
  unite: "% en emploi salarié en France à 30 mois"
  source: "MESR, InserSup"
  note: "Les diplômés de licence générale qui s'arrêtent sont sélectionnés : la plupart poursuivent en master. Le salaire net mensuel médian s'affiche au survol."
  auto: true
- id: insersup-tendance
  sujet: emploi
  titre: "Un écart stable depuis cinq promotions"
  type: ligne
  unite: "% en emploi salarié en France à 30 mois"
  source: "MESR, InserSup"
  note: "Par promotion de diplômés ; valeurs au survol."
  auto: true
  etiquettes: false
- id: filtre
  sujet: emploi
  titre: "Le master trie par origine sociale"
  type: barres
  unite: "% des étudiants"
  source: "MESR, Repères et références statistiques 2025, tableau 7.16-3"
  note: "Part des enfants d'ouvriers et de cadres parmi les étudiants français des universités, 2024-2025."
- id: embauches
  sujet: emploi
  titre: "Les premières embauches reculent là où l'IA est la plus présente"
  type: barres-h
  unite: "% de variation, novembre 2022 à mars 2026"
  source: "Palladino, Bergeaud, Bertheau, Bunel et Degos (2026), LIFT WP 2026-02"
  note: "Cinquième des métiers les plus et les moins exposés à l'IA ; une partie de la baisse vient du télétravail."
- id: voeux
  sujet: orientation
  titre: "En voie professionnelle, un premier vœu sur deux à trois seulement est satisfait"
  type: barres-h
  unite: "% des premiers vœux satisfaits, 2025"
  source: "DGESCO, Repères pour l'orientation et l'affectation 2025"
  note: "Les places en lycée professionnel ont baissé de 3 391 en 2025."
- id: boursiers
  sujet: orientation
  titre: "Les boursiers sont plus souvent orientés vers la voie professionnelle"
  type: barres-h
  unite: "% des élèves de 3e"
  source: "DGESCO, Repères 2025 (chiffres bruts)"
  note: "À notes et vœux équivalents, les décisions restent influencées par le contexte social (Cour des comptes, 2025)."
- id: licence-bac
  sujet: orientation
  titre: "La réussite en licence dépend du bac"
  type: barres-h
  unite: "% obtenant la licence en 3 ou 4 ans"
  source: "SIES, Note Flash 2025-29, novembre 2025 (bacheliers 2020)"
  note: ""
- id: emploi6mois
  sujet: orientation
  titre: "Six mois après le diplôme, le BTS fait mieux que le bac pro"
  type: barres-h
  unite: "% en emploi à 6 mois"
  source: "DEPP, InserJeunes, RERS 2025"
  note: ""
- id: heures
  sujet: formation
  titre: "La France compte des heures de cours, pas un temps de travail"
  type: barres
  unite: "heures de cours par an"
  source: "OCDE, Regards sur l'éducation 2026"
  note: "France et OCDE : heures réglementaires ; Angleterre : heures réellement faites (pas de plafond réglementaire)."
- id: formation
  sujet: formation
  titre: "Un enseignant se forme quatre fois moins qu'un autre cadre de l'État"
  type: barres-h
  unite: "jours de formation par an"
  source: "Cour des comptes, 2023 (enseignants, 2021 ; autres cadres A, 2019)"
  note: "Années différentes : comparer les ordres de grandeur."
# --- Le Monde, hors-série nov.-déc. 2026, p. 78-79 « Handicap : la bataille de l'égalité » (graphiques refaits, 23/11/2026)
- id: handicap-limitations-dep
  sujet: inclusion
  titre: "Limitation fonctionnelle sévère : de 4,9 % à 12,5 % des 25-59 ans selon le département"
  type: carte
  echelle: purples
  unite: "% des 25-59 ans"
  source: "DREES, enquête Vie quotidienne et santé 2021, données départementales (onglet LIMFONC) ; carte de Le Monde, hors-série, nov.-déc. 2026, refaite sur les données ouvertes"
  note: "Le Monde cartographie les 15-64 ans à domicile (8 % en France, de 5,1 % à 11,4 %) ; les données ouvertes de la DREES ne donnent que les 25-59 ans. Outre-mer dans le fichier CSV (Guadeloupe et Martinique 10 %)."
- id: handicap-pauvrete
  sujet: inclusion
  titre: "Un adulte handicapé sur quatre vit sous le seuil de pauvreté"
  type: barres
  unite: "% des 15-64 ans"
  source: "DREES (2021), repris par Le Monde, hors-série, nov.-déc. 2026"
  note: "Personnes handicapées = fortes limitations fonctionnelles. Les fiches de la DREES consultées donnent, pour les 15-59 ans, 25,5 % à 25,8 % contre 14,4 % : chiffre exact de Le Monde à vérifier."
- id: handicap-emploi
  sujet: inclusion
  titre: "41 % des personnes reconnues handicapées ont un emploi, contre 69 % de la population"
  type: barres
  unite: "% des 15-64 ans en emploi"
  source: "Agefiph, tableau de bord emploi et chômage des personnes handicapées, année 2025 (enquête Emploi de l'Insee) ; repris par Le Monde, hors-série, nov.-déc. 2026"
  note: "Bénéficiaires de l'obligation d'emploi : personnes ayant une reconnaissance administrative du handicap. Leur taux de chômage est de 11,5 %, contre 7,7 %."
- id: handicap-accessibilite
  sujet: inclusion
  titre: "Un commissariat sur trois accessible aux personnes handicapées"
  type: barres-h
  unite: "% des établissements accessibles"
  source: "Le Monde, hors-série, nov.-déc. 2026 (avril 2026 ; producteur des données non précisé)"
  note: "En août 2026, 12 % seulement des démarches administratives essentielles en ligne étaient pleinement accessibles (même source)."
- id: handicap-scolarises
  sujet: inclusion
  titre: "Cinq fois plus d'élèves handicapés en classe ordinaire du second degré qu'en 2006"
  type: barres
  unite: "élèves"
  source: "DEPP, Note d'information 25.63 (rentrées 2006 et 2024) ; repris par Le Monde, hors-série, nov.-déc. 2026"
  note: "Hausse de 122 % dans le premier degré et de 464 % dans le second degré ordinaire ; stable en établissement hospitalier ou médico-social (+2 %)."
# --- Le Monde, hors-série nov.-déc. 2026, p. 30-31 « L'école et ses disparités persistantes » (graphiques refaits, 23/11/2026)
- id: ecole-projections
  sujet: inegalites
  titre: "1,7 million d'élèves en moins d'ici 2035"
  type: ligne
  unite: "milliers d'élèves"
  source: "DEPP, Document de travail 2026-E08 et Note d'information 26.09, avril 2026 (scénario intermédiaire) ; repris par Le Monde, hors-série, nov.-déc. 2026"
  note: "Premier degré en 2035 : 5 431 000 élèves (scénario haut) à 5 001 000 (scénario bas). Second degré 2015 déduit de la hausse de 112 100 élèves entre 2015 et 2025 donnée par la DEPP."
- id: ecole-effectifs-dep
  sujet: inegalites
  titre: "De 2015 à 2025, l'école primaire a perdu jusqu'à 23 % de ses élèves selon le département"
  type: carte
  echelle: redblue
  milieu: 0
  unite: "évolution des effectifs 2015-2025 (%)"
  source: "DEPP, effectifs d'élèves par école (data.education.gouv.fr), public et privé sous contrat, calcul GT ; carte de Le Monde (DEPP, Géographie de l'école 2026), refaite sans les écoles fermées"
  note: "En métropole, de -21,7 % (Haute-Saône) à +2,2 % (Haute-Savoie). Outre-mer, dans le CSV : de -22,9 % (Martinique) à +24,4 % (Mayotte). Sur la France entière, le fichier donne -9,2 %, comme la DEPP."
- id: ecole-projection-dep
  sujet: inegalites
  titre: "D'ici 2035, tous les départements perdent des élèves du primaire, Paris près de 30 %"
  type: carte
  echelle: blues
  inverse: true
  unite: "évolution projetée 2025-2035 (%)"
  source: "DEPP, projections d'effectifs à horizon 2035, scénario intermédiaire (fichiers académiques, mis au format CSV sur data.gouv.fr ; totaux nationaux contrôlés) ; carte de Le Monde refaite"
  note: "14 départements perdraient au moins 20 % de leurs élèves du premier degré. En métropole, de -29,4 % (Paris ; -29,3 % dans la publication de la DEPP) à -5,1 % (Alpes-de-Haute-Provence) ; outre-mer, dans le CSV, de -23,0 % (Martinique) à -4,5 % (Mayotte)."
- id: ecole-classes
  sujet: inegalites
  titre: "Des classes plus chargées en France que dans l'OCDE et l'UE"
  type: barres
  unite: "élèves par classe"
  source: "DEPP ; OCDE (moyennes du premier cycle du secondaire pour le collège), repris par Le Monde, hors-série, nov.-déc. 2026 (année non précisée)"
  note: "Lycée général et technologique : 30,2 élèves par classe ; lycée professionnel : 18,4."
- id: ecole-ips
  sujet: inegalites
  titre: "Les collèges privés accueillent les élèves les plus favorisés"
  type: barres
  unite: "indice de position sociale (IPS) moyen"
  source: "DEPP (2025), repris par Le Monde, hors-série, nov.-déc. 2026"
  note: "L'IPS résume le milieu social des élèves à partir des professions des parents : plus il est élevé, plus le milieu est favorisé."
- id: ecole-brevet
  sujet: inegalites
  titre: "21 points d'écart de réussite au brevet entre REP+ et privé"
  type: barres
  unite: "% de réussite"
  source: "DEPP (session 2025), repris par Le Monde, hors-série, nov.-déc. 2026"
  note: "L'écart suit celui de l'origine sociale des élèves (graphique de l'IPS)."
- id: ecole-prive-social
  sujet: inegalites
  titre: "Le privé compte 42 % de collégiens très favorisés, contre 30 % en 2004"
  type: barres
  unite: "% des collégiens du secteur"
  source: "DEPP (2004, 2014, 2024), repris par Le Monde, hors-série, nov.-déc. 2026"
  note: "Dans le public, la part des élèves défavorisés reste proche de 43 %."
- id: ecole-pisa
  sujet: inegalites
  titre: "En maths, la France est passée au-dessus de la moyenne de l'OCDE en 2003 à en dessous en 2025"
  type: barres
  unite: "score PISA"
  source: "OCDE, PISA 2003 et 2025, repris par Le Monde, hors-série, nov.-déc. 2026 (moyennes OCDE hors Costa Rica, Luxembourg et Espagne) ; scores France 2025 : DEPP, NI 26.40"
  note: "Le Monde chiffre aussi à environ 100 points l'écart en sciences entre les élèves les plus et les moins favorisés (lecture de graphique, légende ambiguë)."

  source: "Urssaf (2026), effectifs salariés du secteur privé par zone d'emploi x NA88, au 31/12, 2015 et 2025 ; zonage en zones d'emploi 2020, Insee ; d'après la carte du Monde, hors-série, nov.-déc. 2026 (p. 110-111), refaite sur données ouvertes"

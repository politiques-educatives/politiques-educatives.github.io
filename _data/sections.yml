    titre: "Comment mieux orienter, et dès quand ?"
    bref:   # note 3, partie 2
      - "La première décision tombe en fin de 3e : 38,6 % des élèves du public entrent en voie professionnelle, et les premiers vœux y sont les moins souvent satisfaits (58,1 %, contre 87 % en seconde générale ; DEPP, 2025)."
      - "Le second professeur principal de terminale, sans heures ni formation, n'a pas marché : un tiers des lycées seulement a tenu les deux semaines d'orientation (Cnesco, 2018)."
      - {source: goux-2017}

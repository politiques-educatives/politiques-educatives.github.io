      - "Plus d'un étudiant sur deux inscrit en licence ne l'a pas obtenue au bout de quatre ans. Le baccalauréat, obtenu par 91,8 % des candidats, ne dit plus aux élèves ni aux formations ce qu'ils savent."
      - "Le passage en deuxième année atteint 70 % pour les bacheliers mention très bien, contre 49,1 % pour l'ensemble des néo-bacheliers en 2024 : le bac contient l'information, mais il ne s'en sert pas."
      - "Le master sert souvent de filtre plus que de compétence : il trie par origine sociale, retarde de deux ans l'entrée dans la vie active, et une licence professionnelle insère mieux."

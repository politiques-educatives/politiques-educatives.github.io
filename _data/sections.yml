# Les sections de chaque thème (refonte du 19/11/2026) : un thème = 3 ou 4 sections lues dans l'ordre, et tout part d'elles.
# Fichier à éditer à la main : titres, ordre des sections, et ce qui est rattaché à chacune.
# Vérifier après chaque modification : python3 scripts/check_sections.py (chaque élément rattaché une seule fois).
#
# Une section :
#   id        : court, sans accent ; donne l'adresse #<thème>/<id>
#   titre     : libellé affiché (thématique ; questions dans Orientation et emploi)
#   bref      : « En bref », 2 ou 3 phrases EXISTANTES, jamais de texte nouveau. Chaque élément est :
#                 "texte"              repris tel quel (indiquer la provenance en commentaire)
#                 {source: id}         le « chiffre à citer » (cle) d'une fiche de sources.yml
#                 {vp: clé[.n]}        un texte de voie_pro.yml (ex. bref.0, chine)
#                 {note_ia: constat.n} titre et texte d'un constat de note_ia.yml
#                 {graphique: id}      la note d'un graphique de graphiques.yml
#   chiffre   : « Le chiffre clé », un seul : {graphique: id} | {source: id} | {vp: clé} | {vp: carte} (capture de la carte des lycées pro)
#   graphiques_plus : autres graphiques, montrés dans « Pour aller plus loin »
#   carte     : faits de la carte internationale (_data/ailleurs.json) : theme (onglet de la carte), pays (pays sélectionné par « Voir sur la carte »), faits (ids, 2 à 4)
#   ailleurs_sources : études étrangères de sources.yml montrées dans « Ce que font les autres pays » : {id, pays}
#   propositions : ids de propositions.yml (cartes dépliables, avec « Ailleurs : le cas le plus proche »)
#   livret    : mesures du livret du programme (numéros) ; ajouts : ids de livret_ajouts.yml
#   sources, dossiers (slugs de recherche.yml), notes (PDF de notes.yml ou politiques.yml), notes_generees (dossier), blocs (masters, comms, note_ia)
#   voiepro / voiepro_plus : blocs de voie_pro.yml montrés dans la section / dans « Pour aller plus loin »
#                 (portefeuille, indice, resultats, methode, batiment, limites, chine, donnees, carte)
# « reste » : ce qui n'est rattaché à aucune section, montré replié en bas du thème (« Tout le reste du thème »).
# Tout élément des fichiers de données qui n'est rattaché nulle part va aussi, automatiquement, dans « Tout le reste » de son thème.

themes:
- theme: ecole
  sections:
  - id: temps
    titre: "Le temps des professeurs"
    bref:   # note 1, En bref (« Le constat », « La proposition ») et partie 1
      - "**Le constat.** En France, tout ce qui n'est pas une heure de cours se paie en heures supplémentaires ou ne se fait pas. Le tutorat, le second professeur principal ou les groupes de besoins butent sur ce verrou."
      - "La différence tient moins au volume qu'à la règle : la France compte des heures de cours, l'Angleterre et l'Écosse un temps de travail total."
      - "**La proposition.** Un service annuel, avec un plafond d'heures de cours et une part réservée, inscrite dans l'emploi du temps, au tutorat et au travail d'équipe ; une dotation selon les élèves et leurs besoins ; une mesure régulière de la charge réelle, car un plafond seul ne suffit pas."
    chiffre: {graphique: heures}
    graphiques_plus: [formation]
    carte: {theme: temps, pays: SCO, faits: [f16, f18, f11, f27]}
    propositions: [heures-service-annuel, heures-emploi-du-temps, heures-dotation, heures-mercredi, heures-charge]
    livret: ["65", "72", "71"]
    sources: [ocde-heures-2026, stpcd-2026, talis, uws-eis-2024, cdc-formation-2023, senat-formation-2023, formation-pd-research, depp-ni-25-65, nickow-2020, kraft-2024, guryan-2023, ntp-nfer, apfee, eef-setting, steenbergen-2016, duflo-2011]
    dossiers: [02-groupes-niveau-tutorat, 08-formation-enseignants, 10-brief-formation-continue-enseignants, 16-calendrier-formation-continue]
    notes: [EDUCATION-note1-allocation-heures-enseignement.pdf]
  - id: decider
    titre: "Qui décide dans l'établissement"
    bref:   # note 2, En bref (« Le constat ») et partie 3
      - "**Le constat.** Le chef d'établissement français est responsable des résultats sans tenir les leviers : il ne choisit pas ses enseignants, n'évalue pas leur pédagogie et ne fixe pas leur service. L'enseignant n'a plus d'inspection obligatoire après le milieu de sa carrière."
      - "L'autonomie a marché là où elle s'accompagnait d'une nouvelle direction et de résultats publiés ; seule, elle n'a rien changé."
    chiffre: {source: cdc-inspecteurs-2022}
    carte: {theme: gouvernance, pays: ENG, faits: [f39, f40, f43, f46]}
    propositions: [gouv-recruter, gouv-coordinateurs, gouv-visite]
    livret: ["64"]
    sources: [eyles-machin-2019, taylor-tyler-2012, cdc-inspecteurs-2022]
    dossiers: [01-england-governance-ors]
    notes: [EDUCATION-note2-gouvernance-etablissement.pdf]
  - id: evaluer
    titre: "Évaluer les établissements"
    bref:   # note 2, partie 5
      - "Depuis la loi de 2019 (premières évaluations en 2020-2021), chaque établissement s'auto-évalue puis reçoit une évaluation externe tous les cinq ans. La DEPP publie une valeur ajoutée par lycée (IVAL) depuis 1993 et par collège (IVAC) depuis 2022, limitée au bac et au brevet et sans rôle dans cette évaluation."
      - "Un échec à l'inspection a relevé les résultats des élèves de 0,12 écart-type en maths en primaire (Hussain, 2015) et d'environ 0,1 dans le secondaire (Allen et Burgess, 2012), sous l'ancien système de notes."
    chiffre: {source: evaluation-etablissements-fr}
    carte: {theme: gouvernance, pays: ENG, faits: [f41, f141, f142, f138]}
    propositions: [gouv-evaluation]
    sources: [ofsted-2025, evaluation-etablissements-fr]
    dossiers: [03-inspection-evaluation]
  - id: batiments
    titre: "L'état des bâtiments scolaires"
    bref:   # même encadré (outils IA et jeunes, 21/11/2026)
      - "État des écoles : aucune mesure sur la rénovation des bâtiments scolaires dans le livret."
    propositions: [batiments-inventaire-public, batiments-fonds-chaleur-air, batiments-ddec-perequation]
  reste:
    livret: ["66"]


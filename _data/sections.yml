    dossiers: [19-indice-risque-filieres-techniques, 21-codifiabilite-revue, 21-codifiabilite-donnees]
  - id: lycees
    titre: "Les lycées pro face à l'IA et à la concurrence chinoise"
    bref:
      - {vp: chine}
      - "Dans la Boussole des formations : un clic sur un lycée affiche sa fiche."
    chiffre: {vp: carte}
    voiepro_plus: [chine]
    sources: [hosseini-2026]
  - id: pointe
    edl:   # éléments de langage, repris tels quels des notes (à dire tels quels)
      - {amorce: "Ambition industrielle", texte: "Nous avons besoin de la jeunesse pour bâtir l'industrie française de demain, avec des filières techniques à la pointe face à la concurrence internationale, notamment chinoise, où personne ne reste sans solution.", source: "Note « L'IA et les jeunes », GT Éducation, novembre 2026"}
      - {amorce: "Aux élèves des voies pro", texte: "On a besoin de vous pour bâtir l'industrie française de demain. Une usine qui se modernise ne se passe pas de ses techniciens et de ses ouvriers, elle s'appuie sur leur maîtrise des nouvelles machines pour conquérir des marchés. Choisir un métier technique aujourd'hui, c'est choisir d'être au cœur de la production de demain.", source: "Note « Filières techniques, IA et concurrence chinoise », GT Éducation, novembre 2026"}
    titre: "Mettre la voie pro à la pointe"
    bref:   # note « filières techniques » du 19/11/2026 (constat et proposition 3, non publiée en PDF) ; fiche orient-transparence (preuves)

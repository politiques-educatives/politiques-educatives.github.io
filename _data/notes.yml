# Notes finalisées du GT publiées en PDF (assets/notes/, copiées depuis out/). Pas de versions anglaises.
# La note « L'IA et les jeunes » est publiée en PDF depuis la v5 (19/11/2026) ; la v18 (26/11/2026) remplace la v7, avec un lien vers le Google Doc ; la v7 (22/11/2026) remplace la v5, retirée de la liste le 23/11/2026 (le PDF reste dans assets/notes/).
notes:
  - titre: "Apprendre avec ceux qui savent : écoles, entreprises et seniors à l'heure de l'IA"
    fichier: EDUCATION-note-ecole-entreprise.pdf
    date: "22 novembre 2026"
    pages: 3
    sujets: [emploi]
    resume: "Pour les jeunes : le réseau que leurs parents n'ont pas, un adulte payé pour leur apprendre le métier dès le premier jour, un projet qu'ils choisissent, et d'abord savoir faire seul, puis plus vite avec l'IA. Sept mesures en pilotes évalués : sections lycée-branche, rencontres avec des professionnels, diplômes écrits avec ceux qui les enseignent, tuteurs payés, binômes junior-senior, projets et portfolio."
  - titre: "Gagner du temps de vie : le premier salaire plus tôt, à l'heure de l'IA"
    fichier: EDUCATION-note-temps-de-vie.pdf
    date: "22 novembre 2026"
    pages: 5
    sujets: [orientation]
    resume: "Six mesures concrètes, du lycée au doctorat, volontaires, progressives et évaluées : passer le bac un an plus tôt quand on est prêt, la dernière année de bac pro payée chez un employeur, un bonus pour les boursiers qui finissent leur licence à l'heure, des concours de l'État à bac+3, le financement de chaque doctorant en sciences humaines et un assistant d'IA pour chaque doctorant ; avec leur coût, leur bilan et les leçons des autres pays."
  - titre: "Comment éviter une crise de l'embauche en France ? (L'IA et les jeunes)"
    fichier: EDUCATION-note-ia-jeunes-v18.pdf
    gdoc: "https://docs.google.com/document/d/1PN9DwcmHm8ZAJoqU1S-PvAKOj3lm3g7QiyUXpt3CFUs/edit"
    date: "26 novembre 2026"
    pages: 4
    sujets: [emploi]
    resume: "Ce que proposent les candidats sur l'embauche des débutants face à l'IA, puis cinq propositions : voir avant de choisir (N°75 complétée), un premier contrat pour les débutants (N°81 et N°119 corrigées), le temps des anciens (N°80 complétée), des formations qui rendent des comptes (N°76 corrigée, carte des formations), une première expérience dans chaque licence."
  - titre: "L'allocation des heures d'enseignement, comparaison internationale et britannique"
    fichier: EDUCATION-note1-allocation-heures-enseignement.pdf
    date: "novembre 2026"
    pages: 2
    sujets: [formation]
    resume: "Passer d'un service compté en heures de cours à un service annuel qui réserve du temps au tutorat et au travail d'équipe, avec une formation continue en deux temps : deux à trois jours fin août, puis un suivi chaque trimestre."
  - titre: "Qui décide dans l'établissement ? Comparaison avec le Royaume-Uni"
    fichier: EDUCATION-note2-gouvernance-etablissement.pdf
    date: "novembre 2026"
    pages: 2
    sujets: [formation]
    resume: "Donner au chef d'établissement des leviers sur le recrutement et l'organisation, avec visites-conseil et évaluation des établissements."
  - titre: "Orienter plus tôt, et rendre au bac sa valeur"
    fichier: EDUCATION-note3-orienter.pdf
    date: "octobre 2026, mise à jour novembre 2026"
    pages: 2
    sujets: [orientation]
    resume: "Un tuteur d'orientation dès la 4e, des réunions avec les parents, la transparence sur les débouchés et un bac qui départage."

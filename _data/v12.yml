# Comparaison : programme actuel (note v12 « Éducation : penser pratique », octobre 2026, discutée avec le rectorat de Normandie le 26 octobre 2026)
# et ajouts proposés par le GT. Source v12 : EDUCATION-penser-pratique-v12.pdf (16 octobre 2026), paraphrasée, section entre parenthèses.
# statut : nouveau (absent de la v12) | précise (la v12 le prévoit, l'ajout dit comment) | modifie (l'ajout change la règle v12) | inchangé (repris tel quel)
# carte : id d'une entrée de propositions.yml
- theme: Temps des professeurs
  resume: "Un service annuel avec du temps réservé"
  v12: "Formation continue de 80 heures par an, prise sur le service existant et sur six jours rémunérés pendant les vacances (§ 1)."
  ajout: "Un service annuel plafonné, avec une part réservée dans l'emploi du temps au tutorat, à la concertation, à l'orientation et à la formation, sur le modèle écossais."
  statut: précise
  carte: heures-service-annuel
- theme: Temps des professeurs
  resume: "Le tutorat compté dans le service, pendant la journée"
  v12: "Deux heures de tutorat par semaine pour les élèves en difficulté, pendant l'étude, payées en heures supplémentaires ; autonomie des établissements pour composer groupes et classes de renforcement (§ 3)."
  ajout: "Le tutorat compté dans le service, pendant la journée, par des enseignants ; un emploi du temps construit par l'établissement avec cours en barrette et une heure de concertation par semaine."
  statut: modifie
  carte: heures-emploi-du-temps
- theme: Temps des professeurs
  resume: "Une dotation selon les besoins des élèves"
  v12: "Groupes de niveau du CM1 à la terminale, plus petits pour les élèves en difficulté (§ 3)."
  ajout: "Une dotation calculée selon le nombre d'élèves et la part d'élèves en difficulté, majorée par élève défavorisé (modèle pupil premium)."
  statut: nouveau
  carte: heures-dotation
- theme: Temps des professeurs
  resume: "Le mercredi matin, par bassin"
  v12: "Rien sur la semaine de quatre jours."
  ajout: "Le retour au mercredi matin, décidé par bassin avec la région et les communes."
  statut: nouveau
  carte: heures-mercredi
- theme: Temps des professeurs
  resume: "Mesurer la charge réelle chaque année"
  v12: "Une politique d'établissement pour le bien-être des enseignants, avec moins de charge administrative (§ 4)."
  ajout: "Une enquête annuelle sur la charge de travail réelle, pour que l'annualisation ne fasse pas glisser la charge."
  statut: précise
  carte: heures-charge
- theme: Gouvernance de l'établissement
  resume: "Une part des postes pourvue sur profil"
  v12: "Des collèges autonomes là où c'est le plus difficile, sur volontariat, avec une large autonomie de recrutement ; le Capes reste national et le rang au concours détermine l'académie (§ 4)."
  ajout: "Une part des postes de chaque établissement pourvue sur profil, d'abord dans les établissements les moins demandés, avec une prime et une évaluation prévue dès le départ."
  statut: précise
  carte: gouv-recruter
- theme: Gouvernance de l'établissement
  resume: "Des coordinateurs par discipline et par niveau"
  v12: "Pas d'échelon intermédiaire prévu."
  ajout: "Un coordinateur par discipline et par niveau, avec décharge de service, qui organise groupes, tutorat et observation entre pairs."
  statut: nouveau
  carte: gouv-coordinateurs
- theme: Gouvernance de l'établissement
  resume: "Une visite-conseil tous les deux ans"
  v12: "Des inspecteurs qui conseillent : l'inspection diagnostique les méthodes de l'enseignant et l'oriente vers des formations (§ 1)."
  ajout: "Une visite-conseil tous les deux ans pour chaque enseignant, chaque année pendant les trois premières, aussi par des pairs formés à l'observation."
  statut: précise
  carte: gouv-visite
- theme: Gouvernance de l'établissement
  resume: "Un corps qui évalue les établissements"
  v12: "Des évaluations d'élèves qui servent : résultats en moins d'un mois, nouvelles évaluations chaque trimestre (§ 3)."
  ajout: "Un corps spécialisé pour évaluer les établissements, distinct de l'inspection des enseignants, appuyé sur des indicateurs de valeur ajoutée étendus."
  statut: nouveau
  carte: gouv-evaluation

# Généré par scripts/build_note_ia.py depuis la note IA et jeunes ; ne pas modifier à la main.
source: 2026-11-16-note-ia-jeunes-emploi-orientation.md
titre: 'IA et jeunes : parler du lendemain, dire la vérité sur l''emploi, et laisser les jeunes faire'
intro: Cette note propose cinq messages pour le candidat sur l'intelligence artificielle et l'emploi des jeunes. Elle présente aussi les quatre conditions concrètes qui rendent ces propositions crédibles auprès des étudiants et de leurs familles.
pourquoi: 'Dans les jurys d''entrée en master d''une grande école parisienne, les candidats posent tous la même dernière question : « Qu''est-ce que vous allez faire sur l''IA ? » (témoignage d''un économiste membre de jury, conversation avec le GT, novembre 2026). Tandis qu''un analyste de banque est passé de cinq stagiaires à un seul (même conversation) et qu''un ingénieur en informatique produit vingt fois plus qu''il y a un an (témoignage recueilli par l''auteur, novembre 2026), la première marche vers l''emploi se resserre. Le candidat qui dit aux jeunes « j''ai compris, voilà ce qu''il faut faire » prend le sujet.'
constat:
- titre: L'IA ferme des portes d'entrée sans vider les métiers en place
  texte: entre novembre 2022 et mars 2026, les embauches en CDI des 21-29 ans ont reculé de 28,3 % dans le cinquième des métiers les plus exposés à l'IA, une baisse que l'IA n'explique pas seule, le télétravail et le resserrement monétaire touchant les mêmes métiers (Bergeaud, Bertheau, Bunel, Degos et Palladino, LIFT, 2026).
- titre: Elle percute un marché du travail déjà bloqué pour la jeunesse
  texte: à 20 ans, moins d'un jeune Français sur trois est en emploi (environ 30 % en 2023), contre près de 60 % en Allemagne, au Royaume-Uni et aux États-Unis (CAE, Focus n° 110, 2025, lecture du graphique).
- titre: L'IA dévalue le savoir purement scolaire mais revalorise l'expérience et l'envie de faire
  texte: dans les métiers exposés, le rendement d'une année d'études baisse d'un demi-point et celui de trois ans d'expérience monte (Levy Yeyati, Judzik et Barbiero, 2026) ; le tiers des entreprises américaines qui investissent le plus en IA a augmenté ses postes de débutants de 12 % (Kharazian, Simon et Stevens, 2026).
- titre: L'orientation actuelle ne suit pas et nourrit l'inquiétude
  texte: 50 % des étudiants craignent que l'IA remplace le métier qu'ils visent (OpinionWay, 2026), alors qu'un métier exposé reste porteur, à l'image des diplômés de comptabilité qui sont 79 % en emploi à 30 mois (InserSup 2026, calculs GT Éducation).
- titre: 'Royaume-Uni : 981 000 jeunes sans emploi ni formation'
  texte: Le pays compte 981 000 jeunes de 16 à 24 ans ni en emploi, ni en études, ni en formation, soit 13,0 % (ONS, avril-juin 2026) ; Milburn juge faux d'attribuer cette hausse récente à l'IA, mais alerte sur le risque pour les débutants si les tâches d'entrée disparaissent plus vite que les nouvelles voies (Milburn, 2026, p. 72).
- titre: Le master sert souvent de filtre plus que de compétence
  texte: À 26-27 ans, l'avoir terminé plutôt qu'avoir arrêté en dernière année ajoute 15 points à la probabilité d'être cadre, mais seulement 4 % au salaire, pour un emploi presque identique à 90 % contre 87 % (Insee Première n° 2109, juin 2026). Le diplôme ne décide du choix final que dans 11 % des recrutements, 22 % pour les cadres, et 73 % des recruteurs auraient pu embaucher un candidat moins diplômé mais plus expérimenté (Dares, enquête Ofer 2016).
messages:
- Partons de ce que vous vivez aujourd'hui et parlons de votre avenir immédiat, d'ici un à deux ans, plutôt que d'un horizon lointain.
- 'Regardons la réalité sans dramatiser : l''IA bouscule déjà l''entrée dans la vie active, mais c''est aussi un accélérateur immense qui permet à un jeune ingénieur de produire vingt fois plus qu''il y a un an.'
- Nous vous devons la vérité sur l'emploi, chiffres publics en main, et des solutions concrètes pour franchir la première marche.
- 'Bâtissons une nouvelle ascension sociale : le diplôme seul pèse moins, et les employeurs cherchent d''abord la motivation, le travail personnel et l''envie de créer de vraies choses.'
- 'Cassons la course sans fin aux stages et aux diplômes pour vous donner les moyens d''agir vraiment : c''est par votre énergie que la France retrouvera de la croissance, des emplois et son rayonnement dans le monde.'
- 'Vous ne devriez pas avoir à sacrifier deux ans de votre vie pour un diplôme qui rassure les recruteurs sans vous apprendre un métier : nous allons redonner toute sa valeur à votre licence pour que vous puissiez travailler plus tôt.'
conditions:
- titre: Une école parmi les meilleures du monde et une économie dynamique
  texte: donner aux chefs d'établissement l'autonomie sur le temps des professeurs et leur équipe (notes du GT Éducation, octobre et novembre 2026), et faire payer le travail au-dessus du Smic côté économie, où l'employeur débourse aujourd'hui 300 à 400 € pour 100 € de revenu en plus (CAE, 2026). Non arbitré, coût à chiffrer.
- titre: De bonnes bases pour tous
  texte: rétablir les mathématiques jusqu'en terminale pour tous les élèves visant le supérieur, alors que 44,8 % des élèves de terminale générale suivent la spécialité mathématiques, et 13,9 % l'option mathématiques complémentaires (DEPP, 2026), et refuser l'IA en accès libre avant l'acquisition des fondamentaux, car elle fait perdre 17 % à l'examen (Bastani et al., 2025). Les 16-19 ans passent aujourd'hui plus de cinq heures par jour sur les écrans contre 14 minutes à lire (CNL, 2026), un usage en corrélation avec les résultats scolaires. À 15 ans, un tiers des élèves est désormais en difficulté de lecture, contre 15 % en 2000 (DEPP, note d'information 26.40, septembre 2026). Seuil exact à trancher par l'équipe programme, coût à chiffrer.
- titre: Une orientation qui suit le marché du travail
  texte: afficher sur Parcoursup et en bac pro l'emploi et le salaire à 30 mois (InserSup), les postes ouverts dans le bassin (France Travail, BMO) et le profil d'exposition à l'IA via notre prototype la [Boussole des formations](https://ajoly35.github.io/tuteur-ia/boussole/) ; revoir chaque année la carte des bacs pro selon les embauches locales ; conditionner la licence aux notes du bac comme au Royaume-Uni avec des places garanties en BTS, BUT et apprentissage. Intégration sur données publiques à chiffrer, et un tuteur référent de la 4e à la terminale compté dans le service pour 30 à 50 millions d'euros par an (calcul de travail à confirmer).
- titre: Un suivi annuel des postes de débutants
  texte: L'Observatoire France Travail, dont la première étude auprès de 16 000 employeurs parue le 17 novembre 2026 ne porte pas sur les débutants, pourrait publier chaque année les secteurs et territoires où les postes d'entrée reculent face à l'IA, sur le modèle de l'observatoire proposé au Royaume-Uni (Milburn, 2026, p. 72-73 ; à vérifier, coût à chiffrer).
- titre: Une garantie pour chaque jeune sans emploi ni formation, sur le modèle Milburn
  texte: Le rapport Milburn propose une garantie légale d'opportunité et de soutien pour tout jeune de 18 à 24 ans sans emploi ni formation, donnant droit à un emploi, une formation professionnelle, un apprentissage, un stage jusqu'à 12 semaines ou un service civique (Milburn, 2026, p. 21-22), dont le gouvernement britannique soutient le principe avec un livre blanc début 2027 puis une loi (déclaration du ministre au Parlement, 17 novembre 2026). Le rapport prévoit aussi un conseiller sous 14 jours et un plan personnel sous 4 semaines partout en Angleterre d'ici 2029 (Milburn, 2026, p. 23 ; services locaux acceptés en principe pour 2027), un accès en moins de 3 mois à une thérapie, un conseil ou une réadaptation professionnelle pour les jeunes qui ont un plan (Milburn, 2026, p. 18), et une aide de 3 000 £ à l'employeur embauchant un jeune resté six mois sans emploi ni formation (Milburn, 2026, p. 12). Cette aide augmente de 2 000 £ pour un jeune faisant face à de forts obstacles à l'emploi
    et de 2 000 £ supplémentaires pour une entreprise de moins de 50 salariés, soit jusqu'à 7 000 £ pour une petite entreprise, en plus d'une prime à l'apprentissage de 2 500 £, pour un coût d'environ 1,1 milliard de livres par an finançant 170 000 opportunités (Milburn, 2026, p. 12). Un emploi payé de six mois est également proposé après 12 mois sans emploi ni formation au lieu de 18 (Milburn, 2026, p. 22-23), mesure appliquée par le gouvernement aux allocataires du Universal Credit dès avril 2027. Côté preuves, le programme britannique Kickstart (2020-2022) a ajouté 11 jeunes en emploi non aidé pour 100 participants à 24 mois et rapporté 1,18 £ par livre dépensée (DWP, 2024), tandis qu'en France la Garantie jeunes a relevé l'emploi de 6,3 points à environ 14 mois (évaluation intermédiaire, 2016), sans confirmation sur la seconde cohorte. Le financement proposé débute à 500 millions de livres en 2027/28 par redéploiement des budgets existants et atteint 5,8 milliards par an d'ici 2036/37,
    un montant largement compensé par 3,6 milliards d'économies sur les prestations sociales et 2,4 milliards d'effets fiscaux et sociaux, avec à la clé 440 000 jeunes supplémentaires en emploi durable et +0,4 % de PIB attendus (Milburn, 2026, p. 25 et 30-31), même si le gouvernement ne s'est pas engagé sur ces sommes qui sont renvoyées à la Spending Review de 2027. Transposition aux missions locales et au contrat d'engagement jeune à chiffrer ; position du candidat à vérifier.
- titre: Un jeune a-t-il vraiment besoin d'un master ?
  texte: 'Interrogeons les employeurs publics et privés sur leurs vrais besoins en bac+5, en reposant enfin la question oubliée depuis l''enquête Ofer de 2016 (Dares, enquête Ofer 2016). Construisons une licence qui mène à un métier et finie à temps, alors que seuls 30 % des étudiants l''obtiennent en trois ans (SIES, Note Flash n° 29, novembre 2025) : stage long ou alternance obligatoire en L3 et développement des licences professionnelles, qui mènent à 78 % d''emploi salarié à 30 mois contre 69 % en master et 50 % en licence générale (InserSup 2026). Réservons le master à la recherche, aux études longues, à la réorientation, ou à l''alternance qui place 77 % des diplômés en emploi salarié (InserSup 2026). L''État doit montrer l''exemple en ouvrant d''abord ses propres portes aux jeunes, tout en publiant les salaires par formation et en priorisant l''apprentissage (Milburn, 2026), comme il le fait depuis la session 2026 avec les concours de professeurs dès la L3 suivis d''un M1 payé environ
    1 400 € net par mois. Maintenir ce filtre est injuste pour les enfants d''ouvriers qui chutent de 10 % en licence à 6 % en master contre 31 % à 42 % pour les enfants de cadres (RERS 2025), coûte environ 24 500 € par jeune à l''État (RERS 2025), et retarde de deux ans l''entrée dans la vie active de jeunes déjà prêts. Coût à chiffrer ; position du candidat à vérifier.'
- titre: Des choix individuels, élève par élève, famille par famille
  texte: instaurer un entretien d'orientation trimestriel avec le tuteur et deux réunions dédiées aux parents d'élèves de 3e en difficulté, un dispositif qui réduit de 25 à 40 % le redoublement et le décrochage (Goux, Gurgand et Maurin, 2017). Coût à chiffrer.
argumentaire: Les jeunes ont raison de s'interroger sur l'IA, car ce sont leurs premières embauches qui se resserrent aujourd'hui, pas les postes déjà installés. Nous leur disons la vérité avec des données publiques, nous adaptons l'orientation à la réalité du travail et nous leur donnons les moyens d'agir plutôt que d'accumuler les stages et les diplômes. Notre économie repartira en recrutant une jeunesse formée qui maîtrise l'IA pour créer, et non en reculant devant la technologie. En revalorisant la licence pour mettre fin à l'obligation implicite du master, nous rendons deux ans de vie active et de salaire aux jeunes déjà capables, tout en corrigeant un tri social coûteux pour eux comme pour l'État (RERS 2025).

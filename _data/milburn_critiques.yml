# Critiques du rapport Milburn et ce que le GT en retient (22/11/2026). Texte : Gemini 4 Carbon, à partir de research/12-milburn-review/2026-11-22-reactions-simons.md
titre: "Les critiques du rapport, et ce que nous en retenons"
paragraphes:
  - "Sur Substack (novembre 2026), Jonathan Simons, ancien conseiller au 10 Downing Street aujourd'hui chez PF Global, juge le rapport tourné vers le passé : il suppose une seule « première marche » et des parcours linéaires, et dit peu dans ses conclusions sur l'IA, la reconversion ou l'auto-entrepreneuriat. Il lui reproche de présumer un rôle de l'État partout, via un guichet unique, un test d'impact obligatoire, des quotas de jeunes dans les recrutements publics et des critères obligatoires dans les marchés publics. S'il retient les volets petite enfance et après 16 ans, il reprend le jugement de Sam Freedman sur le scolaire avant 16 ans, composé de mesures « déjà en cours, irréalisables, mauvaises ou vides de sens ». Simons estime le chiffrage fragile (5,8 Md£ de dépenses par an pour 6 Md£ d'économies en 2036-2037, soit une marge d'environ 3 % que la moindre dérive efface) et dénonce l'écart entre l'ambition de « changer le principe organisateur » de l'éducation et des mesures modestes. Un commentateur, Mark Corney, ajoute que 44 % des 18-24 ans touchant la prestation handicap britannique (PIP) sont en formation, soit environ 100 000 jeunes (chiffre non vérifié par le GT), et que la leur supprimer pourrait les pousser hors des études."
  - "Nos propositions suivent la méthode que réclame Simons : peu de mesures, chiffrées, testées en pilotes évalués et arrêtées si elles ne marchent pas. Nous préférons des contreparties simples et des aides conditionnelles aux obligations imposées aux employeurs, avec une ambition proportionnée aux moyens. Trois apports du rapport Milburn restent utiles pour la France : une garantie et un emploi payé pour les jeunes sans emploi ni formation, un suivi des postes de débutants face à l'IA, et la redevabilité des établissements sur le devenir de leurs élèves."
source: "[Jonathan Simons, « The fundamental weakness of the Milburn report », Substack Ardour And Diligence, novembre 2026](https://jonathansimons.substack.com/p/the-fundamental-weakness-of-the-milburn) et commentaires de son post LinkedIn."

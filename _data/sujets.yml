# Les thèmes du site (refonte du 19/11/2026). Chaque thème a les mêmes trois sous-onglets : essentiel, recherche, ailleurs.
# donnees      : étiquettes de sujet utilisées dans sources.yml, livret.yml, notes.yml, recherche.yml (tout ce qui porte l'une d'elles est rangé ici)
# propositions : étiquettes des fiches de propositions.yml montrées dans « L'essentiel » (la note IA et jeunes garde ses propres recommandations)
# bref         : trois sources dont le « chiffre à citer » (champ cle) fait l'« En bref » ; voiepro : textes de _data/voie_pro.yml
# graphiques   : essentiel = graphiques clés ; recherche = les autres
# groupes      : sources rangées par sous-thème dans « Recherche et données » (le reste va dans « Autres sources du thème »)
# carte        : thèmes de la carte internationale (comparaisons.js) montrés dans « Ailleurs », groupés par pays
# Les onglets Accueil, International et Boussole sont dans index.html ; les anciens liens (#ia/…, #gouvernance/…) sont redirigés dans assets/app.js (LEGACY).

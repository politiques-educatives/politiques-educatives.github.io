# Les quatre thèmes du site (refonte du 19/11/2026). Le contenu de chaque thème est rangé par sections dans _data/sections.yml.
# court : libellé de l'onglet ; intro : une phrase sous le titre.
# Les onglets Accueil, International et Boussole sont dans index.html ; les anciens liens (#ia/…, #gouvernance/…, #<thème>/essentiel…) sont redirigés dans assets/app.js (LEGACY).
- id: ecole
  titre: "École et enseignants"
  court: "École et enseignants"
  intro: "Organisation de l'école, autonomie de l'établissement, temps et formation des professeurs : notes 1 et 2 du GT."
- id: handicap
  titre: "Handicap et santé mentale"
  court: "Handicap et santé mentale"
  intro: "Inclusion, santé mentale, écrans et IA à l'école. La note inclusion est rédigée par d'autres membres du groupe : le site apporte la recherche et les sources ; propositions du GT limitées au tuteur IA."
- id: orientation
  titre: "Orientation et emploi des jeunes"
  court: "Orientation et emploi"
  intro: "Orienter plus tôt, dès la 4e (note 3 du GT), et l'emploi des débutants face à l'IA (note IA et jeunes) : masters, licence, premières embauches."
- id: voiepro
  titre: "Voie pro et technologies de pointe"
  court: "Voie pro et techno de pointe"
  intro: "Valoriser la voie technologique et professionnelle pour en faire un atout de la France dans les technologies de pointe, face à la concurrence internationale, notamment chinoise."

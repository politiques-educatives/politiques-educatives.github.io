# Onglets du site : un par sujet de travail du GT, puis la Boussole. Chaque sujet a des sous-onglets.
# donnees : étiquettes de sujet utilisées dans propositions.yml, sources.yml, livret.yml, notes.yml, graphiques
# sous-onglets (type) : synthese | ressource (graphiques + sources + dossiers + bloc) | sources (toutes les sources du sujet) | lien (va vers un autre onglet)
- id: ia

  sujets: [inclusion]
  type: rapport
  statut: vérifié
  resume: "L'avis budgétaire du Sénat détaille les crédits de l'école inclusive et leur dynamique. Le rapporteur juge non soutenable la « déconnexion entre le prescripteur et le payeur » : l'Éducation nationale paie les accompagnants notifiés par les MDPH, dont le nombre varie fortement d'un département à l'autre, sans maîtrise des volumes."
  sections:
    - "Budget : 4,74 Md€ en 2026 (+100 M€ sur 2025), dont 3,16 Md€ d'AESH et 1,55 Md€ d'enseignants spécialisés ; +25 % entre 2022 et 2026 ; 1 200 ETP d'AESH créés en 2026."

  lien: ""
  sujets: [formation]
  type: étude causale
  statut: vérifié
  resume: "Les collèges en difficulté convertis en academies de 2002 à 2010, qui changeaient souvent de direction, progressent d'environ 0,2 écart-type en quatre ans. Ceux convertis après 2010 n'ont pas gardé d'avance (EPI, 2017), et les écoles primaires converties sans difficulté n'ont pas progressé (Eyles, Machin et McNally, 2017). L'autonomie a marché avec une nouvelle direction et des résultats publiés ; seule, elle n'a rien changé."
  cle: "Les collèges en difficulté devenus academies avant 2010 ont progressé d'environ 0,2 écart-type en quatre ans (Eyles et Machin, 2019)."

  resume: "Session 2026, la première avec deux concours externes (bac+3 et bac+5). Postes non pourvus = postes moins admis (calcul du GT). CAPES externe public : 7 830 postes (3 697 à bac+3 et 4 133 à bac+5, +60 % sur 2025), 7 634 admis, 196 postes non pourvus (2,5 %), contre 546 (11,2 %) en 2025. Maths : 1 332 admis pour 1 430 postes (700 sur 700 à bac+3, 632 sur 730 à bac+5), 93,1 % des postes pourvus contre 74,4 % en 2025. Restent difficiles : lettres classiques (56 admis pour 80 postes) et allemand (105 pour 118)."
  cle: "Au premier CAPES à bac+3, en 2026, 93 % des postes de maths sont pourvus, contre 74 % en 2025 (ministère de l'Éducation nationale, calcul du GT)."
- id: dang-do-2026
  titre: "Dang et Do (2026), le tutorat par IA dans les écoles pauvres : ce qui marche"
  ref: "Dang, H.-A. et Do, Q.-T. (2026), « Making AI Tutoring Work for Poorer Schools », IZA Discussion Paper n° 19025, octobre 2026."
  lien: https://docs.iza.org/dp19025.pdf
  sujets: [ecrans]
  type: revue
  statut: vérifié
  resume: "Revue des essais randomisés de tutorat par IA. Les programmes complets, avec encadrement et contenus conçus par des enseignants, donnent +0,36 écart-type au Ghana, +0,31 au Nigeria, +0,26 en Sierra Leone. En Chine rurale (315 classes), la personnalisation par IA ne fait pas mieux qu'un entraînement non personnalisé (-0,04). En Turquie, des élèves entraînés avec un chatbot simple font 17 % de moins à l'examen passé sans IA (Bastani et al., 2025). Repère : le tutorat humain donne +0,29 écart-type (Nickow et al.). Conclusion des auteurs : le gain tient au programme, pas à l'IA en soi."
  cle: "Le tutorat par IA donne +0,26 à +0,36 écart-type dans des programmes encadrés, et rien quand l'IA seule personnalise les exercices (Dang et Do, IZA, 2026)."

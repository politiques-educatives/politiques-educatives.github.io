  cle: "En début de 6e, les élèves de REP+ ont 35 points de moins en maths que ceux du public hors éducation prioritaire (DEPP, NI 26.21, 2026)."
- id: estonie-pisa-2025
  titre: "Estonie, résultats de PISA 2025"
  ref: "Ministère estonien de l'Éducation et de la Recherche (2026), « Summary of Estonia's PISA 2025 results », Tartu, septembre 2026."
  lien: https://hm.ee/sites/default/files/documents/2026-09/PISA_2025_Estonia_results_summary_EN_0.pdf
  sujets: [formation]
  type: données
  statut: vérifié
  resume: "L'Estonie reste le premier pays d'Europe en maths à PISA 2025 : 508 points, -2 depuis 2022 alors que l'OCDE en perd 11 ; 82,8 % des élèves au niveau 2 ou plus ; 13,3 % de très bons élèves, contre 7,8 % dans l'OCDE. Sciences : 527 points, stable. Compréhension de l'écrit : 499 points, -12 depuis 2022 et -24 depuis 2018. L'écart entre élèves favorisés et défavorisés en sciences est de 68 points, contre 86 dans l'OCDE. Le modèle estonien tient en maths et en sciences, moins en lecture."
  cle: "En maths, l'Estonie perd 2 points à PISA 2025 quand l'OCDE en perd 11 (ministère estonien de l'Éducation, 2026)."
- id: bechichi-kenedi-2025
  titre: "IPP, Note n° 119 (2025) : les choix des anciens élèves orientent ceux des suivants"
  ref: "Bechichi, N. et Kenedi, G. (2025), « Orientation post-bac : les choix des anciens élèves du lycée influencent-ils ceux des générations suivantes ? », Note IPP n° 119, décembre 2025."
  lien: https://www.ipp.eu/wp-content/uploads/2025/12/Note_IPP_119_orientation_post_bac.pdf
  sujets: [orientation]
  type: étude causale
  statut: vérifié
  resume: "Données d'Admission Post-Bac 2012-2017. Les auteurs comparent les lycées où un ancien élève a été admis de justesse dans une formation à ceux où il a été refusé de justesse. Quand l'ancien est admis, la probabilité que les élèves de l'année suivante candidatent à la même formation passe de 35 % à 40 %, et celle d'y être admis de 7 % à 9 %. L'effet passe par les professeurs principaux et est fort de fille à fille (+7,4 points). Parmi les 10 % meilleurs au bac, 47 % des élèves défavorisés candidatent aux 10 % de formations les plus sélectives, contre 74 % des très favorisés. Plus de mixité sociale réduirait cet écart d'aspiration d'environ 10 %."
  cle: "Quand un ancien élève du lycée est admis dans une formation, les candidatures de l'année suivante à cette formation passent de 35 % à 40 % (IPP, Note n° 119, 2025)."
- id: filles-maths-2026
  titre: "Plan « Filles et maths » : objectifs (PLF 2026) et premier point de suivi (DEPP, 2026)"
  ref: "Annexe au PLF 2026 (2025), « Impact du budget sur l'égalité entre les femmes et les hommes » ; Leduc, Miconnet (2026), « Les choix d'enseignements de spécialité et d'enseignements optionnels à la rentrée 2025 », Note d'information DEPP n° 26.06, février 2026."
  lien: https://www.assemblee-nationale.fr/dyn/dyn/contenu/visualisation/1089983/file/5-Jaune2026_Impact_Budget_Egalite_FH.pdf
  sujets: [orientation]
  type: texte officiel
  statut: vérifié
  resume: "Le plan, en vigueur depuis la rentrée 2025, vise 30 000 filles de plus en spécialité maths en terminale en 2030 (environ 5 000 de plus par an à partir de 2026), la parité en spécialité maths en 2030 et au moins 30 % de filles en classe prépa. Coût estimé : environ 28 M€ (formation des enseignants et classes Chams, 31 collèges pilotes en 2025). Constat de départ : 40,1 % des filles abandonnent la spécialité maths entre la 1re et la terminale, contre 23,5 % des garçons. Premier suivi (DEPP, rentrée 2025) : les filles font 41,8 % des élèves de terminale en spécialité maths, exactement comme en 2024 ; 33,7 % des filles la suivent, contre 58,8 % des garçons. Aucune évaluation n'est prévue, seulement des indicateurs par sexe. Lien : https://www.education.gouv.fr/sites/default/files/document/NI_2026-06_Enseignements%20de%20sp%C3%A9cialit%C3%A9s_2025.pdf-480377.pdf"
  cle: "À la rentrée 2025, les filles restent 41,8 % des élèves de terminale en spécialité maths, comme en 2024 (DEPP, NI 26.06, 2026)."
- id: capes-2026

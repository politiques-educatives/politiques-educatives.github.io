- id: evaluation-etablissements-fr
  titre: "Conseil d'évaluation de l'école : l'évaluation des établissements en France"
  ref: "Loi n° 2019-791 pour une école de la confiance ; Conseil d'évaluation de l'école, cadres d'évaluation 2020-2024 ; IH2EF."
  lien: https://www.ih2ef.gouv.fr/evaluation-des-etablissements-scolaires
  sujets: [formation]
  type: texte officiel
  statut: vérifié
  resume: "Depuis 2019, chaque établissement s'auto-évalue puis reçoit une évaluation externe tous les cinq ans (environ 20 % par an), par des équipes d'inspecteurs et de personnels de direction d'autres établissements. Les rapports ne sont pas notés et pas systématiquement publiés (non vérifié). La valeur ajoutée par lycée (IVAL, depuis 1993) et par collège (IVAC, depuis 2022) n'y joue aucun rôle."
  cle: "Chaque établissement français reçoit une évaluation externe tous les cinq ans, sans note ni lien avec la valeur ajoutée (Conseil d'évaluation de l'école)."

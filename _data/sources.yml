  resume: "Le Cnesco fait le point sur la scolarisation des élèves handicapés. 86 % sont en milieu ordinaire, 12 % en établissement hospitalier ou médico-social, 2 % en scolarité partagée (2024). Les accompagnants sont passés d'environ 43 000 en 2017 à près de 140 000, mais 98 % travaillent à temps incomplet (quotité moyenne de 62 à 63 %, salaire net moyen d'environ 1 000 euros). Plus de 40 000 élèves notifiés n'avaient pas d'accompagnant fin octobre 2025, sur 352 000 ayant droit. Le Cnesco cite l'Italie (enseignant co-intervenant plutôt qu'accompagnant individuel) comme référence."

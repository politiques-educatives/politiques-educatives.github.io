- id: ofsted-2025
  titre: "Ofsted, cadre d'inspection des écoles (novembre 2025)"
  ref: "Ofsted (2025), School inspection toolkit and report cards, novembre 2025."
  lien: https://www.gov.uk/guidance/understanding-ofsted-report-cards-and-grades
  sujets: [formation]
  type: texte officiel
  statut: vérifié
  resume: "Depuis novembre 2025, l'Ofsted note chaque établissement sur cinq niveaux, domaine par domaine (inclusion, enseignement, résultats, assiduité, bien-être, direction), sans note globale, environ tous les quatre ans ; une école « à surveiller » est revue sous 24 mois. Les enseignants ne sont plus notés individuellement depuis 2014. Un échec à l'ancienne inspection relevait les résultats de 0,12 écart-type en maths en primaire (Hussain, 2015)."
  cle: "Un échec à l'inspection a relevé les résultats des élèves de 0,12 écart-type en maths en primaire (Hussain, 2015)."
  propositions: [gouv-evaluation]

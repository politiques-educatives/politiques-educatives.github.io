  resume: "TALIS 2018 : un enseignant anglais de collège à temps plein déclare 49,3 heures de travail par semaine, dont 20,5 de cours et 32,7 d'autres tâches. TALIS 2024 : un enseignant français de collège déclare 37,2 heures (19,0 de cours), contre 38,5 (21,2) dans l'OCDE ; l'Angleterre n'y a pas participé. Seuls 35 % des enseignants français jugent que leur formation a amélioré leur pratique, contre 55 % dans l'OCDE ; 17 % des débutants ont un mentor attitré, contre 26 %."

- id: formation-pd-research
  titre: "Ce qui marche en formation continue : Fletcher-Wood et Zuccollo (2020), Sims et al. (2021), Kraft et al. (2018)"
  ref: "Fletcher-Wood, H. et J. Zuccollo (2020), EPI/Wellcome ; Sims, S. et al. (2021), EEF ; Kraft, M., D. Blazar et D. Hogan (2018), Review of Educational Research 88(4)."
  lien: https://discovery.ucl.ac.uk/10136274/1/Teacher-professional-development.pdf
  sujets: [formation]
  type: méta-analyse
  statut: vérifié
  resume: "Sur 53 essais randomisés, la formation continue améliore les résultats des élèves de 0,09 écart-type en moyenne, « comparable aux interventions les plus efficaces » par son coût (Fletcher-Wood et Zuccollo). Sur 104 essais, ce qui distingue les programmes efficaces, ce sont des mécanismes précis : gérer la charge cognitive, fixer des objectifs, modéliser, pratiquer, retour d'un expert (Sims et al.). Le coaching (60 études) gagne 0,49 écart-type sur la qualité de l'enseignement et 0,18 sur les résultats, mais bien moins à grande échelle (Kraft et al.). Les journées isolées ne changent rien."
  cle: "La formation continue améliore les résultats des élèves de 0,09 écart-type en moyenne sur 53 essais (Fletcher-Wood et Zuccollo, 2020)."
  propositions: [heures-service-annuel]
  dossier: 10-brief-formation-continue-enseignants

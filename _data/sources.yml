# ================= ÉCOLE : DÉMOGRAPHIE ET INÉGALITÉS (Le Monde, hors-série nov.-déc. 2026, et sources d'origine ; 23/11/2026) =================
- id: lemonde-hs-2026-ecole
  titre: "Le Monde, hors-série, « L'école et ses disparités persistantes » (novembre-décembre 2026)"
  ref: "Pommiers, E. (2026), « L'école et ses disparités persistantes », Le Monde, hors-série « Le modèle social tient-il encore ? », novembre-décembre 2026, p. 30-31."
  lien: ""
  sujets: [inegalites]
  type: revue
  statut: secondaire
  resume: "La chute de la natalité va transformer l'école. D'ici 2035, écoles, collèges et lycées perdraient environ 1,7 million d'élèves, près de 15 % des effectifs, le primaire d'abord, le secondaire ensuite. Les territoires ne sont pas égaux devant cette baisse : les campagnes ont déjà absorbé une bonne part des fermetures d'écoles publiques depuis 2012, et près de la moitié des écoles qui restent ont moins de quatre classes. L'autrice demande à l'État et aux élus d'anticiper en repensant la carte scolaire, faute de quoi les fractures territoriales s'élargiront. Elle pose aussi l'alternative budgétaire : rendre les postes libérés par la baisse des effectifs ou les réinvestir là où le système est fragile. Les professeurs français sont moins bien payés que leurs voisins européens, enseignent davantage d'heures, devant des classes plus chargées, et le recrutement est en crise. Les inégalités sociales restent parmi les plus fortes de l'OCDE : l'éducation prioritaire concentre les élèves défavorisés, le privé sous contrat attire de plus en plus d'élèves très favorisés, et la baisse démographique pourrait attiser cette concurrence. Les scores PISA reculent."
  sections:
    - "Démographie : environ 1,7 million d'élèves de moins entre 2025 et 2035, près de 15 % (DEPP, projections, scénario intermédiaire)."
    - "Effectifs : 6,5 millions d'élèves dans le premier degré en 2011 et 6,1 millions en 2025 ; 5,6 millions dans le second degré en 2025 ; en 2035, environ 5,4, 5,2 et 5 millions dans le premier degré (scénarios haut, intermédiaire, bas) et 4,9 millions dans le second degré. L'attribution de ces quatre points, incertaine sur le graphique, est confirmée par le Document de travail de la DEPP (5 431 387, 5 216 439, 5 001 491 et 4 875 900)."
    - "Réseau : plus de 5 000 écoles publiques fermées depuis 2012, soit 11 % ; près de 45 % des écoles ont moins de quatre classes et 8 % une seule ; les collèges de moins de 300 élèves forment 17 % des établissements (année non précisée)."
    - "Taille des classes : 21,1 élèves en élémentaire contre 20 dans l'OCDE et 19,2 dans l'UE ; 25,7 au collège (DEPP) ; 25,9 contre 23,0 dans l'OCDE et 20,8 dans l'UE au premier cycle du secondaire (OCDE, Regards sur l'éducation 2025, données 2023) ; 30,2 en lycée général et technologique, 18,4 en lycée professionnel (DEPP ; OCDE)."
    - "Écoles selon la taille moyenne des classes (rentrée 2025) : 41,4 % sous 20 élèves, 50,2 % de 20 à 24, 20,3 % de 25 à 29, 0,1 % à 30 ou plus. La somme imprimée dépasse 100 % : chiffres à vérifier, non repris en graphique."
    - "Éducation prioritaire et privé : IPS moyen des collèges de 75,1 en REP+, 86,3 en REP, 104,5 dans le public hors REP et 125,5 dans le privé ; réussite au brevet de 75 %, 78 %, 86 % et 96 % (DEPP, 2025)."
    - "Recrutement social du privé : 41,9 % de collégiens très favorisés en 2024 contre 29,7 % en 2004, et 18 % de défavorisés contre 26 % ; dans le public, 19,5 % et 42,5 % (DEPP)."
    - "PISA : en maths, 511 points en 2003 et 458 en 2025 (OCDE : 502 en 2003 pour les 24 pays présents à chaque cycle ; 463 en 2025 pour l'ensemble de l'OCDE) ; en compréhension de l'écrit, 496 puis 456 (OCDE : 505 puis 461), moyennes OCDE hors Costa Rica, Luxembourg et Espagne. Écart d'environ 100 points en sciences entre les élèves les plus et les moins favorisés : lecture de graphique, légende vraisemblablement inversée, à vérifier dans PISA."
    - "Cartes : évolution des effectifs du premier degré de 2015 à 2025, de -22,9 % à +24,4 % selon le territoire, avec les écoles fermées (DEPP, Géographie de l'école 2026) ; projection 2025-2035, de -29,3 % à -4,5 % par département (DEPP)."
  cle: "D'ici 2035, l'école perdrait 1,7 million d'élèves, près de 15 % de ses effectifs (DEPP, repris par Le Monde, hors-série, nov.-déc. 2026)."
  propositions: []
  dossier: ""

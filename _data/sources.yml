  titre: "Ministère de l'Éducation nationale, Cadre d'usage de l'IA en éducation (juin 2025)"
  ref: "MENJ (2025), Cadre d'usage de l'IA en éducation, 14 juin 2025 (BO du 19 juin 2025)."
  lien: ""
  sujets: [ecrans]
  type: texte officiel
  statut: secondaire
  resume: "Après une consultation de janvier à mai 2025 : l'IA soutient le jugement de l'enseignant sans le remplacer ; outils libres recommandés, outils grand public tolérés sans données personnelles ; usage pédagogique par les élèves à partir de la 4e, en classe et sous la supervision de l'enseignant ; les devoirs rédigés par l'IA sans autorisation relèvent de la fraude."
  cle: "Le cadre ministériel autorise l'usage de l'IA par les élèves à partir de la 4e, en classe et sous supervision (MENJ, juin 2025)."

- id: inclusion-international
  titre: "L'inclusion à l'étranger : Italie, New York, Québec, Finlande, Portugal, Pays-Bas, Angleterre"
  ref: "ISTAT (2018, 2020, 2026) ; NYC DOE et Research Alliance ; OPHQ (2026) ; Protecteur du citoyen (2022) ; Statistics Finland (2024-2025) ; OCDE (2022) ; DfE (2026)."
  lien: ""
  sujets: [inclusion]
  type: revue
  statut: vérifié
  resume: "Revue des modèles étrangers par le GT, sans évaluation causale disponible pour aucun. Italie : 1,6 élève par enseignant de soutien, mais 57,6 % changent d'enseignant chaque année et un enseignant sur trois n'est pas formé. New York : 23,2 % d'élèves avec un plan individuel, la moitié en classes à deux enseignants, des unités autisme (Nest, Horizon) populaires mais non évaluées, 21 000 recours par an. Québec : 23,9 % d'élèves en difficulté ou handicapés, 78,2 % en classe ordinaire, jusqu'à 16 mois d'attente entre le besoin et le service ; 42 % des parents paient en privé. Finlande : l'école décide seule des deux premiers paliers de soutien (26 % des élèves), loi sur un psychologue pour 780 élèves et un rendez-vous sous 7 jours. Portugal : décret de 2018 sans catégories de handicap, mesures décidées par une équipe de l'école. Pays-Bas : enveloppe fermée par partenariat régional d'écoles. Angleterre : un coordinateur formé (SENCO) dans chaque école, 538 547 plans éducation-santé-soins en 2026 et des déficits locaux de 3,3 Md£."
  sections:
    - "Leçon 1 : la stabilité de l'adulte compte autant que le nombre (Italie : 57,6 % de changements d'enseignant par an)."
    - "Leçon 2 : former avant de recruter (Italie : un enseignant de soutien sur trois non formé)."
    - "Leçon 6 : un financement conditionné au diagnostic crée des files d'attente et un marché privé (Québec : 16 mois, 42 % des parents paient)."
    - "Leçon 7 : des droits opposables sans offre déplacent l'argent vers les avocats (New York : 21 000 recours par an, 1,3 Md$)."
  cle: "En Finlande, l'école décide seule des deux premiers paliers de soutien, dont bénéficient 26 % des élèves (Statistics Finland, 2024)."
  propositions: []
  dossier: 04-inclusion

- id: taylor-tyler-2012
  titre: "Taylor et Tyler (2012), l'évaluation des enseignants par observation à Cincinnati"
  ref: "Taylor, E. et J. Tyler (2012), American Economic Review ; Burgess, Rawal et Taylor (2021), Journal of Labor Economics ; EEF (2017), Teacher Observation."
  lien: ""
  sujets: [formation]
  type: étude causale
  statut: vérifié
  resume: "À Cincinnati, une année d'évaluation fondée sur quatre observations, dont trois par des pairs formés, relève d'environ 0,10 écart-type les résultats en maths des élèves de ces enseignants les années suivantes. En Angleterre, dans 82 collèges, l'observation mutuelle gagne 0,07 écart-type au GCSE et la doubler n'ajoute rien (Burgess, Rawal et Taylor, 2021) ; l'évaluation officielle du même essai ne trouve aucun effet (EEF, 2017)."
  cle: "Une année d'évaluation par observation a relevé de 0,10 écart-type les résultats des élèves à Cincinnati (Taylor et Tyler, 2012)."

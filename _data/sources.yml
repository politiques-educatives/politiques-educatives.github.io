# ================= AUDIT DU 23/11/2026 : études ajoutées (figures relues dans la source indiquée) =================
- id: cae-84-grenet-landais-2025
  titre: "CAE, Note n° 84 (Grenet et Landais, 2025) : le rendement de chaque euro de dépense éducative"
  ref: "Grenet, J. et C. Landais (2025), « Éducation : comment mieux orienter la dépense publique », Les notes du Conseil d'analyse économique, n° 84, mai 2025."
  lien: https://cae-eco.fr/static/pdf/CAE084_Education_250520.pdf
  sujets: [formation]
  type: revue
  statut: vérifié
  resume: "La note classe les politiques éducatives françaises selon un indice d'efficacité de la dépense publique (EDP, en anglais MVPF) : le gain pour les élèves rapporté au coût net pour l'État, une fois comptées les recettes fiscales futures dues à leurs salaires plus élevés. Une politique est dite autofinancée (EDP infini) quand ces recettes dépassent son coût. Champ : premier et second degrés, politiques évaluées par essai ou quasi-expérience, surtout en France. Sont autofinancés le dédoublement des classes en primaire, le tutorat quel que soit le tuteur, les logiciels adaptatifs en maths, un programme de compétences socio-comportementales, la formation continue intensive, les inspections pédagogiques et la Mallette des parents. Le redoublement, la formation continue ponctuelle et les dotations en ordinateurs ou tablettes ont une efficacité nulle ou très faible. Limite : les effets à long terme sont extrapolés à partir des gains de résultats scolaires (9,5 % de salaire par écart-type)."
  sections:
    - "Taille des classes (p. 5) : 1,62 % d'écart-type de plus à la fin du CP par élève en moins (évaluation du dédoublement en REP+) ; autofinancé en primaire ; à expérimenter au collège."
    - "Redoublement (p. 6) : environ 6 000 € l'année en primaire, 8 400 € au collège, 11 500 € au lycée (2015), près de 2 Md€ par an au total, pour des effets nuls ou négatifs à long terme."
    - "Tutorat (p. 7-8) : +0,37 écart-type en moyenne sur 96 essais (Nickow et al., 2020) ; 400 000 étudiants payés au Smic 20 heures par an couvriraient les 10 % d'élèves de primaire les plus faibles pour environ 290 € par élève, contre près de 10 000 € de gains de salaire et 6 500 € de recettes fiscales par élève."
    - "Énergie Jeunes (p. 8) : 97 collèges défavorisés, +3 % d'écart-type en 6e et +5 % en 3e, 65 € par élève : autofinancé."
    - "Enseignants (p. 9-10) : un enseignant d'un écart-type au-dessus de la moyenne relève les résultats de 10 à 20 % d'écart-type par an ; transposé à la France, environ 92 000 € de gains de salaire cumulés par classe. Formation de 80 heures sur deux ans en sciences au primaire : +0,12 écart-type, qui s'estompe sans suivi. Inspections : +3 à 5 % d'écart-type au collège, jusqu'à 10 % en éducation prioritaire, pour moins de 100 € par élève (Briole et Maurin)."
    - "Mallette des parents (p. 11) : environ 8 € par élève, absences et sanctions en baisse de 15 % d'écart-type, résultats en hausse de 8 % d'écart-type."
    - "Citation, tutorat (p. 7-8) : le tutorat « apparaît à la lumière des travaux de recherche comme l'un des dispositifs les plus efficaces » ; « le rapport coût-efficacité du tutorat est tel que le dispositif est autofinancé quel que soit le type de tuteur mobilisé » ; « Le format le plus prometteur reste toutefois celui déployé en primaire, sur le temps scolaire, avec des tuteurs paraprofessionnels (assistants d'éducation, étudiants) ». Seule preuve citée : la méta-analyse de 96 essais randomisés de Nickow, Oreopoulos et Quan (2020), aucune évaluation française du tutorat. Recommandation 4 : « Déployer à grande échelle des dispositifs de tutorat pour renforcer l'accompagnement des élèves en difficulté »."
    - "Citation, formation continue (p. 10) : « Les formats classiques, ponctuels, peu ciblés et centrés sur des contenus généraux, se révèlent le plus souvent inefficaces, tant pour faire évoluer les pratiques pédagogiques que pour améliorer les résultats des élèves. » Preuves citées : l'essai français de Bellue, Bouguen, Gurgand, Munier et Tricot (2023, Economics of Education Review), 80 heures de formation en sciences sur deux ans, +12 % d'écart-type qui s'estompe sans suivi, et la revue de 196 expériences de terrain du Handbook of Field Experiments. Plus d'un milliard d'euros par an ; la formation continue est la première cause d'absence hors maladie (18 % des absences). Recommandation 6 : « Réformer la formation continue des enseignants en privilégiant des formats intensifs, ciblés et ancrés dans la pratique, accompagnés d'évaluations rigoureuses pour en mesurer l'impact à long terme »."
    - "Citation, groupes de niveau (p. 6) : les classes de niveau instituées pour une année ou plus « n'ont pas d'effet positif sur le niveau moyen des élèves et ont tendance à creuser les inégalités » ; les regroupements souples « produisent des résultats plus encourageants. […] Toutefois, les études d'impact restent limitées ». Source citée : la synthèse d'Aisenberg et Lobut (2023, Note IDEE n° 1), pas une étude causale."
  cle: "Le tutorat, le dédoublement en primaire, les inspections et la Mallette des parents s'autofinancent par les recettes fiscales futures ; le redoublement coûte près de 2 Md€ par an pour un effet nul (Grenet et Landais, CAE, Note n° 84, 2025)."
  propositions: [heures-emploi-du-temps, gouv-visite]
  dossier: 10-brief-formation-continue-enseignants
- id: cae-93-dintilhac-2026
  titre: "CAE, Note n° 93 (Dintilhac, Houzel et Jaravel, 2026) : un plan pour rattraper le retard scolaire"
  ref: "Dintilhac, C., G. Houzel et X. Jaravel (2026), « École : un plan d'action pour rattraper le retard français », Les notes du Conseil d'analyse économique, n° 93, septembre 2026."
  lien: https://cae-eco.fr/static/pdf/CAE093_Education_260903.pdf
  sujets: [formation]
  type: revue
  statut: vérifié
  resume: "La note part des systèmes qui ont remonté leur niveau en une dizaine d'années et en tire cinq leviers communs : un objectif simple décliné par matière et par classe, un enseignement explicite avec des supports structurés et des manuels labellisés, une formation intensive et un accompagnement des enseignants en classe, des évaluations régulières des élèves qui déclenchent l'aide, et un tutorat ciblé. Elle propose de viser +0,6 écart-type en fin de collège en dix ans (plus d'une année d'apprentissage), de diviser par deux la part d'élèves sous le seuil minimal et de ramener l'écart social à la moyenne de l'OCDE, pour environ 4 Md€ par an, moins que les 5 Md€ au moins d'économies liées à la baisse du nombre d'élèves d'ici 2035. Limite : les effets sont des ordres de grandeur tirés d'études faites ailleurs."
  sections:
    - "Tableau 1 (p. 3) : en maths, l'Angleterre gagne 0,57 écart-type au TIMSS de CM1 entre 1995 et 2007 (élèves sous le seuil de 18 % à 6 %) ; le Mississippi +0,64 entre 2003 et 2019 (38 % à 16 %) ; le Maroc +0,93 sur 22 800 élèves (évaluation J-PAL) ; la France recule de 530 à 483 points au TIMSS de 4e entre 1995 et 2019 (-0,62 écart-type)."
    - "Preuves causales (p. 5-6) : enseignement explicite +0,50 à +0,60 écart-type en conditions expérimentales (méta-analyse de 328 études, Stockard et al., 2018), +0,08 en lecture une fois généralisé en Angleterre (Machin et McNally, 2008) ; formation couplée à un accompagnement en classe environ +0,2 (Kraft et al., 2018) ; tutorat +0,50 par des enseignants, +0,40 par des paraprofessionnels, +0,21 par des non-professionnels (Nickow et al., 2020)."
    - "France (p. 6) : 3,5 jours de formation continue par an au collège contre 8 dans l'OCDE ; aucun mécanisme de certification des manuels ; 22 élèves par classe en primaire contre 19 en Europe."
    - "Adhésion (p. 9) : sondage de 800 enseignants du primaire et du collège (juillet 2026) : 93 % favorables à moins d'élèves par classe en primaire, 83 % au tutorat, 81 % à la formation continue et à l'accompagnement, 74 % à de meilleures ressources pédagogiques, 48 % à l'usage des évaluations."
    - "Citation, tutorat et formation (p. 6) : « Les dispositifs de soutien personnalisés, avec des sessions en très petits groupes tels que le tutorat par des paraprofessionnels formés, dont l'efficacité a pourtant été documentée par la littérature internationale, restent très marginaux. » Sur la formation continue, les heures françaises « restent trop théoriques, peu ancrées dans la réalité du terrain ». Preuves citées : Nickow et al. (2020) pour le tutorat (+0,50 écart-type par des enseignants, +0,40 par des paraprofessionnels, +0,21 par des non-professionnels), EEF (2026) pour les petits groupes (+0,3) ; Kraft, Blazar et Hogan (2018, 60 études causales) pour la formation avec accompagnement en classe (+0,2), Visscher et al. (2025, 128 études) pour ses conditions. Chiffrage (tableau 3) : tutorat en groupes de 2 à 4 élèves par des paraprofessionnels formés pour 10 à 15 % des élèves du CP au CM2, +0,07 à +0,11 écart-type en 3e pour 240 à 360 M€ par an ; 80 heures de formation par an, +0,23 pour 715 M€."
  cle: "Plusieurs pays ont gagné plus d'une année d'apprentissage en dix ans ; un plan de 4 Md€ par an le permettrait en France, moins que le dividende démographique (Dintilhac, Houzel et Jaravel, CAE, Note n° 93, 2026)."
  propositions: [heures-service-annuel]

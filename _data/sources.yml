- id: enfants-ecrans-2024
  titre: "Commission « Enfants et écrans. À la recherche du temps perdu » (avril 2024)"
  ref: "Benyamina, A. et S. Mouton (dir.) (2024), Enfants et écrans. À la recherche du temps perdu, rapport de la commission d'experts, avril 2024, 142 pages, 29 propositions."
  lien: https://www.elysee.fr/admin/upload/default/0001/16/fbec6abe9d9cc1bff3043d87b9f7951e62779b09.pdf
  sujets: [ecrans]
  type: rapport
  statut: vérifié
  resume: "Commission d'experts installée par le Président de la République. Elle conclut à un consensus net sur les effets somatiques des écrans (sommeil, sédentarité, obésité, myopie), avec une relation dose-effet, et appelle à la vigilance sur le neurodéveloppement. L'« addiction aux écrans » n'est pas reconnue scientifiquement ; les réseaux sociaux « semblent être » un facteur de risque supplémentaire quand il existe une vulnérabilité préexistante, surtout chez les filles. Ses 29 propositions « font système »."
  sections:
    - "Synthèse (p. 6-8) : effets somatiques établis, prudence sur la santé mentale, 10 écrans en moyenne par foyer."
    - "Proposition 13, bornes d'âge : pas de téléphone avant 11 ans ; sans internet à 11 ans ; connecté sans réseaux sociaux à 13 ans ; réseaux sociaux « éthiques » à 15 ans ; pas d'écran avant 3 ans."
    - "Proposition 15 : toute ressource numérique éducative passe par une expérimentation, une étude d'impact et une labellisation."
    - "Proposition 16 : un cadre strict pour Pronote et les ENT, avec des paramétrages protecteurs par défaut."
    - "Proposition 17 : faire appliquer l'interdiction du téléphone au collège."
    - "Proposition 20 : adapter les horaires scolaires au sommeil."
  cle: "Les réseaux sociaux « semblent être » un facteur de risque supplémentaire quand il existe une vulnérabilité préexistante (commission Enfants et écrans, 2024)."
  propositions: []
  dossier: ""
- id: proteger-sans-empecher-2026
  titre: "CIANum, « Protéger sans empêcher : les vulnérabilités à l'ère de l'IA générative » (10 novembre 2026)"
  ref: "Commission « IA générative et vulnérabilités » du CIANum (2026), Protéger sans empêcher, remis le 10 novembre 2026, 193 pages, 18 recommandations."
  lien: https://www.elysee.fr/admin/upload/default/0001/20/eaaf28c592b0cc1e10cdeaa5ba0c0e9f4d746543.pdf
  sujets: [ecrans]
  type: rapport
  statut: vérifié
  resume: "Commission saisie par la ministre déléguée à l'IA (février 2026), 9 experts, 55 auditions. Elle décrit trois risques pour les jeunes utilisateurs de l'IA générative (cognitif, affectif, violences numériques) et des bénéfices éducatifs « variés et conditionnels ». Elle ne propose pas d'interdire, mais des garde-fous validés par des organismes indépendants et des modèles adaptés aux mineurs."
  sections:
    - "Usages (p. 20-21) : 26 % des 12-17 ans utilisent l'IA générative chaque jour (Baromètre du numérique 2026) ; près de 70 % des 15-24 ans y ont régulièrement recours (Arcom, juin 2026)."
    - "Risques (p. 17-18) : « dette cognitive » ; la moitié des mineurs abordent des sujets personnels avec des chatbots (VYV/CNIL, mars 2026) ; 92 % des adolescents disent passer plus de temps qu'ils ne le voudraient sur les applications d'IA (YouGov, octobre 2026)."
    - "Santé mentale (p. 39-44) : cas de suicides après des interactions prolongées ; les garde-fous des modèles « peuvent se dégrader » dans les conversations longues ; benchmark KORA de 28 % à 44 % sur la sécurité face à la détresse."
    - "Bénéfices (p. 26-29) : « aucune étude scientifique d'envergure » ne montre qu'un outil seul fait mieux qu'un enseignant ; risque d'inégalité par l'abonnement (30 % d'erreurs pour une version gratuite contre 14 % pour la payante, AlgorithmWatch 2024)."
    - "Recommandation 2 : « mode mineurs » (minuteur, pauses, horaires scolaires et sommeil), désactivation par défaut de l'anthropomorphisme et de la flagornerie."
    - "Recommandation 12 : un programme d'éducation à l'IA dès le primaire, avec un nombre minimal d'heures."
    - "Recommandation 13 : dans les classes, des modèles adaptés aux mineurs, « socratiques », labellisés après évaluation par le Conseil scientifique de l'Éducation nationale."
  cle: "26 % des 12-17 ans utilisent l'IA générative chaque jour (rapport « Protéger sans empêcher », 2026, p. 20)."
  propositions: [tuteur-public, ia-bases]
  dossier: ""
- id: cianum-clandestinite-2026
  titre: "CIANum, « Sortir de la clandestinité. Mettre l'IA au service d'une nouvelle ambition pour le système éducatif » (juin 2026)"
  ref: "Conseil de l'intelligence artificielle et du numérique (2026), Sortir de la clandestinité, rapport du groupe IA et éducation, juin 2026, 76 pages (308 avec annexes), 11 recommandations."
  lien: ""
  sujets: [ecrans, formation]
  type: rapport
  statut: vérifié
  resume: "Thèse : l'IA est déjà dans l'éducation, mais de façon « clandestine » (usages dissimulés des élèves, des enseignants et des parents) ; le contrefactuel n'est pas l'absence d'IA mais « son omniprésence dans l'ombre » (p. 12). Le rapport propose une « éducation duale » (des temps avec et sans IA), des outils souverains labellisés « socratiques » et une formation massive des enseignants. Aucune recommandation n'est chiffrée en euros. Près de 50 auditions."
  sections:
    - "Usages (p. 15-17) : 90 % des élèves de seconde avaient utilisé l'IA pour leurs devoirs (Sénat, 2024) ; 91 % des enseignants l'utilisent, mais 3 % régulièrement avec leurs élèves (IGESR, 2025)."
    - "Formation (p. 16, 50) : 9 % des enseignants français formés à l'IA dans l'année, contre 38 % dans l'OCDE (TALIS 2024) ; 14 % l'utilisent dans leur travail contre 41 % ; 10 % touchés par les formations déployées en mai 2025."
    - "Preuves (p. 17-18) : sur 818 articles, 20 seulement ont un groupe de contrôle (Stanford, avril 2026) ; l'EEF mesure environ 30 % de temps de préparation gagné avec ChatGPT."
    - "Principes (p. 43-48) : faire entrer l'IA en classe en décidant explicitement ce qui est autorisé ; éducation duale ; évaluation préalable ; formation, « clé de voûte » ; acheter ou produire des outils de qualité."
    - "Recommandations (p. 49-66) : formation nationale des enseignants à et avec l'IA ; éducation à l'IA dès le primaire ; évaluer le processus et l'oral ; ateliers santé mentale dès 2027 ; conférence de consensus sur les barrières d'âge ; charte ; labellisation des applications socratiques ; évaluation systématique ; kiosque national d'outils souverains ; expérimentations ; conférence de financement État-collectivités."
  cle: "9 % des enseignants français ont été formés à l'IA dans l'année, contre 38 % dans l'OCDE (CIANum, 2026, p. 16, d'après TALIS 2024)."
  propositions: [tuteur-public, tuteur-marche]
  dossier: 09-lecture-rapport-cianum-sortir-clandestinite
- id: milburn-2026
  titre: "Rapport Milburn, « From a Welfare State to a Working State » (17 novembre 2026)"
  ref: "Milburn, A. (2026), From a Welfare State to a Working State: a new settlement for the next generation, Department for Work and Pensions, 17 novembre 2026, 278 pages."
  lien: https://assets.publishing.service.gov.uk/media/6afb1fc5ccb3ea58ac8743c1/from-a-welfare-state-to-a-working-state-full-report.pdf
  sujets: [emploi, orientation]
  type: rapport
  statut: vérifié
  resume: "Revue indépendante commandée par le gouvernement britannique sur les jeunes sans emploi ni formation (981 000 jeunes de 16 à 24 ans, 13,0 %, ONS avril-juin 2026). Elle propose une garantie légale d'opportunité et de soutien, financée par un redéploiement des aides, et un volet école, apprentissage et IA. Le gouvernement en soutient le principe (livre blanc début 2027) ; les montants sont renvoyés à la Spending Review 2027. Détail des 17 recommandations dans l'onglet IA et jeunes."
  sections:
    - "Diagnostic (p. 25, 30-31, 37) : 25 £ d'allocations pour 1 £ d'aide à l'emploi en 2024/25 ; coût des jeunes sans emploi ni formation d'environ 125 Md£ par an ; 69 % des jeunes ont utilisé l'IA, 55 % s'en disent inquiets."
    - "Garantie (p. 21-23) : emploi, formation, apprentissage, stage jusqu'à 12 semaines ou service civique ; conseiller sous 14 jours ; emploi payé de six mois après 12 mois sans emploi ni formation."
    - "Employeurs (p. 12) : 3 000 £ par embauche, jusqu'à 7 000 £ pour une petite entreprise, 2 500 £ par apprenti ; environ 1,1 Md£ par an pour 170 000 opportunités."
    - "École et supérieur (p. 14-16) : repérage précoce du décrochage, stage obligatoire, norme « prêt pour le travail » inspectée, devenir des élèves publié par établissement, salaires des diplômés publiés par formation."
    - "Apprentissage (p. 16-17) : 35 % d'une génération apprentie avant 25 ans, environ 270 000 entrées par an d'ici 2036."
    - "IA (p. 72-73) : un observatoire de l'IA et des jeunes, rapport annuel sur les voies d'entrée qui se ferment par secteur et par territoire."
    - "Financement (p. 25, 30-31) : 500 M£ en 2027/28, 5,8 Md£ par an en 2036/37, compensés par 3,6 Md£ d'économies et 2,4 Md£ d'effets fiscaux ; 440 000 jeunes de plus en emploi durable."
  cle: "Le rapport Milburn propose 3 000 £ par embauche d'un jeune resté six mois sans emploi ni formation, jusqu'à 7 000 £ pour une petite entreprise (Milburn, 2026, p. 12)."
  propositions: [ia-garantie, ia-observatoire, orient-gatsby, orient-debouches]
  dossier: 12-milburn-review
- id: cdc-formation-2023
  titre: "Cour des comptes, La formation continue des enseignants (2023)"
  ref: "Cour des comptes (2023), La formation continue des enseignants de l'Éducation nationale."
  lien: ""
  sujets: [formation]
  type: rapport
  statut: vérifié
  resume: "La Cour mesure le peu de temps de formation des enseignants et la sous-consommation des crédits. Un enseignant suit en moyenne 2 jours de formation par an au premier degré et 1,5 au second (2021), contre 9,2 jours pour les autres cadres A de l'État (2019). La formation continue coûte plus de 1,1 Md€ en 2021, avec 458 M€ de sous-consommation (p. 7). Les formations d'initiative locale, demandées par le chef d'établissement, sont « appréciées mais minoritaires » (p. 6) ; la Cour demande « des délégations de moyens à la main des cadres locaux » (p. 7)."

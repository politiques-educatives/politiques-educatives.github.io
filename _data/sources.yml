  sujets: [formation]
  type: texte officiel
  statut: vérifié
  resume: "Le contrat national anglais fixe 195 jours et 1 265 heures de « temps dirigé » par an, réparties par le chef d'établissement (paragraphe 52.5), dont au moins 10 % du temps d'enseignement pour la préparation et la correction (53.4). Il n'y a pas de plafond d'heures de cours. Depuis 2024, la progression salariale n'est plus obligatoirement liée à l'évaluation annuelle. 94 % des trusts appliquent encore les conditions nationales."
  cle: "En Angleterre, le contrat fixe 1 265 heures de temps dirigé par an, dont 10 % au moins pour la préparation (STPCD 2026, 52.5 et 53.4)."

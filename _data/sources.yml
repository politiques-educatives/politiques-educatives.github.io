- id: cdc-inclusion-2024
  titre: "Cour des comptes, L'inclusion scolaire des élèves en situation de handicap (septembre 2024)"
  ref: "Cour des comptes (2024), L'inclusion scolaire des élèves en situation de handicap, rapport public thématique, septembre 2024."
  lien: https://www.vie-publique.fr/files/rapport/pdf/295363.pdf
  sujets: [inclusion]
  type: rapport
  statut: vérifié
  resume: "Le rapport fait le bilan de vingt ans de scolarisation des élèves handicapés depuis la loi de 2005. Il constate une hausse massive des effectifs et des moyens (accompagnants, ULIS) sans pilotage par les besoins : l'Éducation nationale finance ce que les MDPH prescrivent, sans visibilité sur les volumes. Il chiffre le coût pour l'Éducation nationale à environ 3,7 Md€ en 2022, le coût global (collectivités comprises) restant inconnu."
  sections:
    - "Effectifs et dispositifs : les ULIS passent de 8 600 à 11 400 entre 2017 et 2025 (+30 %, chiffre repris par le Cnesco en 2026)."
    - "Matériel pédagogique adapté : taux de couverture des prescriptions de 67 % en 2022 ; délais de 18 mois à 2 ans dans certains territoires."
    - "Livret de parcours inclusif (p. 38-39) : généralisation prévue en 2022 non réalisée ; 164 000 élèves couverts en juin 2023, dont 19 % seulement avec un projet personnalisé de scolarisation ; de 4,5 livrets pour 100 élèves en Guadeloupe à moins de 0,1 à Paris et Mayotte."
    - "Recommandation n° 9 : un référentiel harmonisé des prescriptions des MDPH, notamment pour les AESH individualisés et mutualisés."
    - "Recommandation n° 10 : une base de données exhaustive avec l'identifiant national élève, étendue au médico-social."
  cle: "Le livret de parcours inclusif ne couvrait que 164 000 élèves en juin 2023, dont 19 % avec un PPS (Cour des comptes, 2024, p. 38-39)."
  propositions: []
  dossier: 09-brief-sante-mentale-handicap-inclusion

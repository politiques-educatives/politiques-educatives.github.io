- id: insee-ic-2026
  titre: "Insee, Note de conjoncture (24 mars 2026) : l'emploi des jeunes dans l'information-communication"
  ref: "Adjerad et Vermersch (2026), Insee, Note de conjoncture, 24 mars 2026."
  lien: ""
  sujets: [emploi]
  type: données
  statut: vérifié
  resume: "L'emploi de l'information-communication baisse de 3,0 % entre fin 2023 et fin 2025, entièrement du fait des moins de 30 ans. L'emploi salarié des 15-29 ans (hors apprentis) dans les activités informatiques recule de 7,4 % sur un an fin 2025, contre -0,7 % dans l'ensemble du privé."
  cle: "L'emploi salarié des 15-29 ans dans l'informatique a reculé de 7,4 % sur un an fin 2025, contre 0,7 % dans l'ensemble du privé (Insee, 2026)."
  propositions: [ia-observatoire]
  dossier: 06-index-ia-formations
- id: orr-2026
  titre: "Orr, Tucker et Warren (2026), l'exposition à l'IA par spécialité de diplôme"
  ref: "Orr, Tucker et Warren (2026), US Census CES-WP-26-56, septembre 2026."
  lien: ""
  sujets: [emploi, orientation]
  type: étude causale
  statut: vérifié
  resume: "Données administratives américaines sur les diplômés, par spécialité. Pour le dixième des spécialités les plus exposées à l'IA, l'emploi initial baisse de 5 points et les premiers revenus trimestriels de 13 %, un choc « comparable à une entrée sur le marché du travail en grande récession ». La moitié vient de salaires plus bas dans le même secteur, la moitié d'un déplacement vers le commerce."
  cle: "Pour les spécialités les plus exposées à l'IA, les premiers revenus des diplômés américains baissent de 13 % (Orr, Tucker et Warren, 2026)."
  propositions: [orient-debouches]
  dossier: 06-index-ia-formations
- id: hosseini-2026
  titre: "Hosseini et Lichtinger (2026), exposition des métiers à l'IA par tâche (base de la Boussole)"
  ref: "Hosseini, S. M. et G. Lichtinger (2026), « Generative AI and Occupational Entry Barriers: The Labor Supply Channel of Technological Change », Harvard University, SSRN 6059674 ; données GenAI_Expertise (Final_Occupation_Dataset), https://github.com/s-mahdihosseini/GenAI_Expertise."
  lien: https://github.com/s-mahdihosseini/GenAI_Expertise
  sujets: [orientation, emploi]
  type: données
  statut: vérifié
  resume: "Mesure, pour chaque métier O*NET, la part des tâches qu'une IA peut faire à plus de 80 % (avg_auto_hl_bi). La Boussole l'applique aux premiers métiers de chaque formation : la licence de maths, l'informatique et la comptabilité mènent à des premiers emplois très automatisables, l'école d'ingénieurs et les doubles cursus résistent. L'exposition n'est pas une prévision : un métier exposé peut rester porteur (diplômés de comptabilité : 79 % en emploi à 30 mois)."
  cle: "La licence de maths, l'informatique et la comptabilité mènent à des premiers emplois très automatisables (Hosseini et Lichtinger, 2026)."
  propositions: [orient-debouches, orient-transparence]
  dossier: 06-index-ia-formations
- id: deming-2017
  titre: "Deming (2017), l'importance croissante des compétences sociales"
  ref: "Deming, D. (2017), « The Growing Importance of Social Skills in the Labor Market », Quarterly Journal of Economics."
  lien: https://scholar.harvard.edu/sites/scholar.harvard.edu/files/ddeming/files/deming_socialskills_qje.pdf
  sujets: [orientation, emploi]
  type: étude causale
  statut: vérifié
  resume: "Aux États-Unis de 1980 à 2012, l'emploi et les salaires progressent le plus dans les métiers qui combinent compétences mathématiques et compétences sociales ; les métiers très mathématiques mais peu sociaux reculent. Base du critère « maths × contact humain » de la note de A à E de la Boussole."
  cle: "Les emplois qui associent maths et compétences sociales progressent le plus (Deming, 2017)."
  propositions: [orient-debouches]
  dossier: 06-index-ia-formations
- id: bastani-2025
  titre: "Bastani et al. (2025), l'IA générative peut nuire à l'apprentissage (PNAS)"
  ref: "Bastani, H. et al. (2025), « Generative AI without guardrails can harm learning », PNAS 122(26)."
  lien: ""
  sujets: [ecrans]
  type: étude causale
  statut: vérifié
  resume: "Essai randomisé dans un grand lycée turc, environ 1 000 élèves de la 9e à la 11e année, 50 classes, quatre séances de maths de 90 minutes. Pendant l'entraînement, GPT-4 sans garde-fou améliore les résultats de 48 % et un tuteur à indices (sans réponse directe) de 127 %. À l'examen passé sans IA, le groupe GPT-4 libre fait 17 % de moins que les élèves sans accès ; le tuteur à indices n'a pas d'effet négatif."
  cle: "L'IA en accès libre fait perdre 17 % à l'examen passé sans elle ; un tuteur à indices ne fait rien perdre (Bastani et al., 2025)."
  propositions: [tuteur-public, ia-bases]
  dossier: 07-outil-ia-public
- id: stromberg-2026
  titre: "Strömberg, Lei et Wu (2026), l'IA générative et les notes en Chine"
  ref: "Strömberg, Lei et Wu (2026), CEPR Discussion Paper 21577."
  lien: ""
  sujets: [ecrans]
  type: étude causale
  statut: vérifié
  resume: "Un comté chinois, 26 811 élèves de la 7e à la 12e année, différences de différences échelonnées sur 30 mois. Les notes de devoirs montent de 18 %, mais les contrôles mensuels sur table baissent de 20 %, le gaokao de 18 % et le zhongkao de 24 %. 81 % des utilisateurs ont un usage compatible avec la sous-traitance des devoirs. C'est exactement le risque d'un outil à la maison."
  cle: "L'IA générative sans garde-fou a fait baisser de 20 % les notes aux contrôles sur table en Chine (Strömberg, Lei et Wu, 2026)."
  propositions: [tuteur-public, ia-bases]
  dossier: 07-outil-ia-public
- id: kestin-2025
  titre: "Kestin et al. (2025), un tuteur IA en physique à Harvard"
  ref: "Kestin, G. et al. (2025), Scientific Reports 15."
  lien: ""
  sujets: [ecrans]
  type: étude causale
  statut: vérifié
  resume: "Cours d'introduction à la physique à Harvard, 194 étudiants analysés, essai croisé randomisé : un tuteur IA à la maison contre un cours en classe active. Gain de 0,63 écart-type (0,73 à 1,3 selon la régression quantile) en 49 minutes médianes contre 60 en classe. Limites : un seul cours, contenu d'introduction, étudiants très sélectionnés."
  cle: "Un tuteur IA structuré a fait gagner 0,63 écart-type à des étudiants de physique de Harvard (Kestin et al., 2025)."
  propositions: [tuteur-public]
  dossier: 07-outil-ia-public
- id: desimone-2025
  titre: "De Simone et al. (2025), un programme d'IA générative au Nigeria (Banque mondiale)"
  ref: "De Simone, M. et al. (2025), World Bank Policy Research Working Paper 11125."
  lien: ""
  sujets: [ecrans]
  type: étude causale
  statut: vérifié
  resume: "Essai randomisé dans le secondaire nigérian : un programme de six semaines après les cours en 2024, des binômes utilisant GPT-4 avec des consignes conçues par des enseignants. +0,31 écart-type à l'évaluation finale, +0,23 en anglais ; les auteurs l'équivalent à 1,5 à 2 ans de scolarité ordinaire. Gains plus forts pour les filles. Contexte très différent de la France."
  cle: "Six semaines de tutorat IA encadré ont fait gagner 0,31 écart-type au Nigeria (De Simone et al., 2025)."
  propositions: [tuteur-public]
  dossier: 07-outil-ia-public
- id: henkel-2024
  titre: "Henkel et al. (2024), le tuteur Rori sur WhatsApp au Ghana"
  ref: "Henkel, O. et al. (2024), arXiv 2402.09809."
  lien: https://arxiv.org/abs/2402.09809
  sujets: [ecrans]
  type: étude causale
  statut: vérifié
  resume: "Environ 1 000 élèves de la 3e à la 9e année dans 11 écoles ghanéennes, affectation par école : un tuteur de maths sur téléphone, deux séances de 30 minutes par semaine pendant 8 mois. Effet de 0,37 écart-type la première année. Limite : peu d'écoles, donc incertitude."
  cle: "Un tuteur de maths sur téléphone a fait gagner 0,37 écart-type au Ghana (Henkel et al., 2024)."
  propositions: [tuteur-public]
  dossier: 07-outil-ia-public
- id: tutor-copilot-2024
  titre: "Wang et al. (2024), Tutor CoPilot : l'IA qui aide les tuteurs humains"
  ref: "Wang, R. et al. (2024), Tutor CoPilot, arXiv 2410.03017."
  lien: https://arxiv.org/abs/2410.03017
  sujets: [ecrans]
  type: étude causale
  statut: vérifié
  resume: "Essai randomisé aux États-Unis, 900 tuteurs humains et 1 800 élèves de milieux défavorisés : l'IA suggère des relances au tuteur, pas à l'élève. Maîtrise des notions +4 points, +9 points pour les élèves des tuteurs les moins bien notés, pour environ 20 dollars par tuteur et par an ; les tuteurs donnent moins de réponses et posent plus de questions."
  cle: "Une IA qui conseille les tuteurs humains a relevé de 9 points la maîtrise des élèves des tuteurs les moins bien notés, pour 20 dollars par tuteur et par an (Wang et al., 2024)."
  propositions: [tuteur-public]
  dossier: 07-outil-ia-public
- id: mia-seconde
  titre: "MIA Seconde : un marché public d'IA éducative sans résultats publiés"
  ref: "Next (2024) ; marché du ministère de l'Éducation nationale, août 2022."
  lien: ""
  sujets: [ecrans]
  type: texte officiel
  statut: secondaire
  resume: "Exercices adaptatifs en maths et en français pour la seconde, positionnés sur les tests d'entrée de la DEPP. Marché signé en août 2022 après un appel à projets de 2021, environ 2,8 M€ sur 36 mois, renouvelable. Livré avec un an de retard, sans résultats publiés. Mathia, assistant vocal de maths en cycle 2, n'a jamais été évalué publiquement."
  cle: "MIA Seconde, commandé en 2022 pour 2,8 M€ sur trois ans, a été livré avec un an de retard, sans résultats publiés (Next, 2024)."
  propositions: [tuteur-marche]

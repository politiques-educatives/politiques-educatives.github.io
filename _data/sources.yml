# ================= POLITIQUE INDUSTRIELLE ET VOIE PRO (23/11/2026) : études citées, statut secondaire =================
- id: aghion-2026-capital-moderne
  titre: Aghion, Antonin, Bunel et Jaravel, machines modernes et emploi dans l'industrie française (2026)
  ref: 'Aghion, P., C. Antonin, S. Bunel et X. Jaravel (2026), « Modern Manufacturing Capital, Labor Demand and Product Market Dynamics: Evidence from France », American Economic Journal: Macroeconomics, à paraître.'
  lien: https://www.insee.fr/en/statistiques/7613955
  sujets:
  - emploi
  - formation
  type: étude causale
  statut: secondaire
  resume: 'Les auteurs suivent les usines, entreprises et secteurs manufacturiers français de 1995 à 2017 et mesurent ce que change l''achat de machines modernes, automatisation comprise. L''emploi augmente à chaque niveau, y compris celui des ouvriers non qualifiés ; les salaires et leur dispersion ne bougent pas ; ventes, exportations et profits montent et les prix baissent. Au niveau du secteur, l''effet positif n''apparaît que dans les industries exposées aux importations, où les entreprises qui s''équipent prennent des parts aux concurrents étrangers. Limite : l''effet total dans un secteur abrité est nul, et l''étude ne porte pas sur l''IA.'
  sections:
  - 'Données : industrie manufacturière française, 1995-2017, usines, entreprises et secteurs.'
  - 'Résultat : l''investissement en machines modernes accroît l''emploi, ouvriers non qualifiés compris, sans hausse des inégalités de salaire.'
  - 'Nuance : au niveau sectoriel, gain d''emploi seulement dans les industries concurrencées par les importations.'
  cle: Dans l'industrie française, les entreprises qui achètent des machines modernes embauchent davantage, y compris des ouvriers non qualifiés (Aghion, Antonin, Bunel et Jaravel, 2026).
- id: hirvonen-2025
  titre: Hirvonen, Stenhammar et Tuhkuri, aides à l'achat de machines dans les PME finlandaises (2025)
  ref: 'Hirvonen, J., A. Stenhammar et J. Tuhkuri (2025), « Winners and Losers of Technology Grants: Evidence on Jobs and Skills », RFBerlin Discussion Paper n° 2504.'
  lien: https://ideas.repec.org/p/crm/wpaper/2504.html
  sujets:
  - emploi
  - formation
  type: étude causale
  statut: secondaire
  resume: 'Les auteurs comparent les PME finlandaises lauréates d''aides européennes à l''achat de machines (robots, machines à commande numérique), de 1994 à 2018, à des candidates très proches qui ont échoué. L''emploi des lauréates augmente d''environ 20 % (23 % dans la version de 2022), sans que la part des diplômés du supérieur change. Les dossiers de candidature montrent que l''argent a surtout financé l''expansion et de nouveaux produits plutôt que le remplacement des tâches existantes. Limite : document de travail, résultats sur des PME d''un seul pays.'
  sections:
  - 'Méthode : lauréates contre candidates écartées de justesse.'
  - 'Résultat : emploi +20 % environ, composition par diplôme inchangée.'
  - 'Mécanisme : expansion et nouveaux produits plutôt qu''automatisation des postes.'
  cle: Les PME finlandaises aidées pour acheter des machines ont accru leur emploi d'environ 20 % par rapport aux candidates écartées, sans évincer les non-diplômés (Hirvonen et al., 2025).
- id: malgouyres-2017
  titre: Malgouyres, la concurrence chinoise et l'emploi local en France (2017)
  ref: 'Malgouyres, C. (2017), « The Impact of Chinese Import Competition on the Local Structure of Employment and Wages: Evidence from France », Journal of Regional Science, 57(3), 411-441.'
  lien: ''
  sujets:
  - emploi
  - inegalites
  type: étude causale
  statut: secondaire
  resume: 'L''étude transpose à la France la méthode d''Autor, Dorn et Hanson : elle compare les zones d''emploi selon leur spécialisation dans les industries concurrencées par la Chine. La hausse des importations chinoises explique environ 13 % des pertes d''emplois manufacturiers français entre 2001 et 2007, avec des pertes d''emplois locales qui débordent sur les services de la zone. Limite : période ancienne, avant la montée de la Chine dans les biens d''équipement et l''automobile.'
  sections:
  - 'Méthode : exposition des zones d''emploi aux importations chinoises.'
  - 'Résultat : environ 13 % des pertes d''emplois manufacturiers de 2001-2007.'
  - 'Effet local : les pertes s''étendent hors de l''industrie dans les zones exposées.'
  cle: La concurrence chinoise explique environ 13 % des emplois industriels perdus en France entre 2001 et 2007 (Malgouyres, 2017).
- id: autor-2025-places-people
  titre: Autor, Dorn, Hanson, Jones et Setzler, les lieux et les personnes face au choc chinois (2025)
  ref: 'Autor, D. H., D. Dorn, G. H. Hanson, M. R. Jones et B. Setzler (2025), « Places versus People: The Ins and Outs of Labor Market Adjustment to Globalization », in C. Dustmann et T. Lemieux (dir.), Handbook of Labor Economics, vol. 6, North-Holland, 549-653.'
  lien: ''
  sujets:
  - emploi
  - orientation
  type: revue
  statut: secondaire
  resume: 'Les auteurs suivent sur longue période les zones américaines les plus exposées à la concurrence chinoise. L''emploi local y repart après 2010, mais pas pour les ouvriers de l''industrie présents au moment du choc : la plupart n''ont ni changé de région ni trouvé d''emplois mieux payés. Le rebond vient d''une nouvelle génération entrée sur le marché du travail dans d''autres métiers, souvent de services. Leçon pour l''orientation : l''ajustement à un choc industriel passe surtout par les choix des jeunes qui entrent, pas par la reconversion des salariés en place. Chiffres précis à compléter depuis le chapitre.'
  sections:
  - 'Constat : rebond de l''emploi local après 2010 dans les zones exposées.'
  - 'Personnes : les ouvriers déplacés restent sur des trajectoires dégradées.'
  - 'Mécanisme : l''ajustement passe par les nouveaux entrants.'
  cle: Après le choc chinois, l'emploi est revenu dans les zones touchées par l'arrivée de jeunes dans d'autres métiers, pas par la reconversion des ouvriers licenciés (Autor et al., 2025).
- id: kalantzis-thubin-2017
  titre: Kalantzis et Thubin, les causes de la désindustrialisation en France (Banque de France, 2017)
  ref: Kalantzis, Y. et C. Thubin (2017), « Les causes de la désindustrialisation en France », Billet du blog de la Banque de France, n° 37.
  lien: ''
  sujets:
  - emploi
  - orientation
  type: données
  statut: secondaire
  resume: 'Le billet décompose le recul du poids de l''industrie en France. Trois causes structurelles en expliquent 87 % : les gains de productivité plus rapides dans l''industrie, qui font baisser le prix relatif des biens ; le déplacement de la demande des ménages et des entreprises vers les services ; l''externalisation par les industriels de services autrefois faits en interne. La compétitivité face à l''étranger n''explique que le reste. Conséquence pour l''orientation : la part de l''industrie dans l''emploi continuera probablement de baisser, et l''enjeu porte sur les métiers industriels en tension plutôt que sur un pari global sur l''industrie.'
  sections:
  - 'Décomposition : 87 % structurel (productivité, demande, externalisation).'
  - 'Compétitivité extérieure : part minoritaire.'
  cle: 87 % de la désindustrialisation française tient à des causes structurelles, la compétitivité n'expliquant que le reste (Kalantzis et Thubin, Banque de France, 2017).
- id: thebault-2025
  titre: Thebault, ouvrir une STS ou une CPGE près de chez soi (Note IPP n° 114, 2025)
  ref: Thebault, G. (2025), « Peut-on réduire les inégalités géographiques dans l'accès aux filières sélectives en France ? », Note IPP n° 114, mars 2025.
  lien: https://www.ipp.eu/wp-content/uploads/2025/03/note_ipp_114-1.pdf
  sujets:
  - orientation
  - inegalites
  type: étude causale
  statut: secondaire
  resume: 'L''étude mesure l''effet des sections de techniciens supérieurs (STS, qui préparent le BTS) et des classes préparatoires ouvertes « de proximité » entre 2006 et 2015. L''ouverture accroît d''environ 8 % la probabilité que les élèves du lycée et des lycées voisins s''inscrivent dans ces filières. L''effet est le plus fort pour les élèves des petites communes et, pour les STS, pour les élèves de la voie professionnelle. L''offre de formation de proximité compte donc pour la poursuite d''études des bacheliers professionnels. Limite : effet mesuré sur l''inscription, pas sur l''emploi.'
  sections:
  - 'Champ : ouvertures de STS et de CPGE de 2006 à 2015.'
  - 'Résultat : +8 % environ de probabilité d''inscription locale.'
  - 'Hétérogénéité : effet plus fort pour les petites communes et, en STS, pour la voie pro.'
  cle: Ouvrir une STS ou une CPGE dans un lycée accroît d'environ 8 % l'inscription des élèves du secteur, surtout en petite commune et en voie pro pour les STS (Thebault, IPP, 2025).
- id: garin-rothbaum-2025
  titre: Garin et Rothbaum, les usines de la Seconde Guerre mondiale et la mobilité des enfants (2025)
  ref: 'Garin, A. et J. Rothbaum (2025), « The Long-Run Impacts of Public Industrial Investment on Local Development and Economic Mobility: Evidence from World War II », Quarterly Journal of Economics, 140(1), 459-520.'
  lien: https://www.nber.org/papers/w32265
  sujets:
  - emploi
  - inegalites
  type: étude causale
  statut: secondaire
  resume: 'Pendant la guerre, l''État américain a financé des usines souvent implantées hors des bassins industriels existants. Les comtés qui les ont reçues ont gardé pendant des décennies davantage d''emplois manufacturiers bien payés. Les hommes nés avant-guerre dans ces comtés gagnaient à l''âge adulte 2,5 % de plus par an (environ 1 200 dollars de 2020) que ceux des comtés comparables, avec un gain plus fort pour les enfants de familles modestes, surtout parce qu''ils avaient accès à ces emplois une fois adultes. Limite : les implantations récentes n''ont pas eu le même effet sur les salaires locaux.'
  sections:
  - 'Méthode : comtés avec usine de guerre contre comtés comparables.'
  - 'Résultat : +2,5 % de revenu annuel à l''âge adulte, davantage pour les enfants modestes.'
  - 'Mécanisme : accès local à des emplois industriels mieux payés.'
  cle: Les garçons nés près d'une usine de guerre américaine ont gagné 2,5 % de plus par an une fois adultes, surtout ceux de familles modestes (Garin et Rothbaum, 2025).
- id: beaurepaire-lavialle-2022
  titre: Beaurepaire et Lavialle, les délocalisations d'emplois en France (Insee, 2022)
  ref: Beaurepaire, C. et V. Lavialle (2022), « Plus de 10 000 emplois délocalisés chaque année de 2011 à 2017, en baisse par rapport à la décennie antérieure », Insee Références.
  lien: ''
  sujets:
  - emploi
  type: données
  statut: secondaire
  resume: L'Insee compte les emplois supprimés en France par des entreprises qui transfèrent une activité à l'étranger. Plus de 10 000 emplois ont été délocalisés chaque année de 2011 à 2017, moins que lors de la décennie précédente ; les ouvriers qualifiés de l'industrie sont les plus touchés. Les délocalisations restent faibles au regard des créations et destructions d'emplois annuelles. Chiffres détaillés par métier à compléter depuis la publication.
  sections:
  - 'Volume : plus de 10 000 emplois par an en 2011-2017, en baisse.'
  - 'Profil : surtout des ouvriers qualifiés de l''industrie.'
  cle: Plus de 10 000 emplois ont été délocalisés chaque année de 2011 à 2017, en baisse par rapport aux années 2000 (Insee, 2022).
- id: igf-2024-apprentissage
  titre: Inspection générale des finances, revue des dépenses d'apprentissage et de formation professionnelle (2024)
  ref: Inspection générale des finances (2024), Revue des dépenses publiques d'apprentissage et de formation professionnelle.
  lien: ''
  sujets:
  - formation
  - emploi
  type: rapport
  statut: secondaire
  resume: La revue de dépenses chiffre l'effort de la Nation pour l'apprentissage et la formation professionnelle à près de 32 Md€ en 2022, dont 14 Md€ de l'État et 11 Md€ des entreprises. Elle juge l'efficience insuffisante et recommande de concentrer les financements sur les formations les plus qualifiantes. Détail des pistes d'économie à compléter depuis le rapport.
  sections:
  - 'Montant : près de 32 Md€ en 2022 (État 14 Md€, entreprises 11 Md€).'
  - 'Recommandation : cibler les formations les plus qualifiantes.'
  cle: Apprentissage et formation professionnelle ont coûté près de 32 Md€ en 2022, dont 14 Md€ à l'État (IGF, 2024).
- id: nimier-david-2023
  titre: Nimier-David, l'ouverture d'établissements du supérieur et la création d'entreprises (2023)
  ref: 'Nimier-David, E. (2023), « Local Human Capital and Firm Creation: Evidence from the Massification of Higher Education in France », document de travail.'
  lien: ''
  sujets:
  - orientation
  - inegalites
  type: étude causale
  statut: secondaire
  resume: 'Dans les années 1990, la France a ouvert plus de 300 établissements d''enseignement supérieur sur tout le territoire (universités, écoles d''ingénieurs, instituts universitaires professionnalisés). L''étude compare les zones qui en ont reçu à celles qui n''en ont pas eu : la hausse locale de main-d''œuvre qualifiée y a accru la création d''entreprises et la productivité du travail. Implanter des formations techniques près des bassins industriels peut donc attirer l''activité autant que la suivre. Chiffres à compléter depuis l''article.'
  sections:
  - 'Choc : plus de 300 établissements ouverts dans les années 1990.'
  - 'Résultat : plus de créations d''entreprises et de productivité locale.'
  cle: Les zones dotées d'un nouvel établissement du supérieur dans les années 1990 ont vu davantage d'entreprises se créer (Nimier-David, 2023).
- id: jaravel-2023-marie-curie
  titre: Jaravel, Marie Curie habite dans le Morbihan (2023)
  ref: Jaravel, X. (2023), Marie Curie habite dans le Morbihan. Démocratiser l'innovation, Paris, Seuil.
  lien: ''
  sujets:
  - orientation
  - inegalites
  type: revue
  statut: secondaire
  resume: L'ouvrage rassemble les travaux sur l'origine des innovateurs. En France comme aux États-Unis, devenir ingénieur-docteur, chercheur ou inventeur dépend fortement du milieu social, du sexe et du département d'origine ; le Morbihan a la plus faible part d'enfants qui deviendront inventeurs ou chercheurs malgré de bons résultats scolaires. L'auteur estime que la parité femmes-hommes dans l'accès à l'innovation porterait la croissance annuelle de la productivité du travail de 1 % à 1,8 %, et relève que les stéréotypes de genre détournent les femmes des métiers scientifiques et industriels, souvent mieux payés.
  sections:
  - 'Constat : accès aux carrières d''innovation très inégal selon milieu, sexe et territoire.'
  - 'Chiffrage : parité dans l''innovation, +0,8 point de croissance de la productivité par an.'
  - 'Lien industrie : stéréotypes qui écartent les femmes des métiers industriels.'
  cle: La parité femmes-hommes dans l'accès à l'innovation ferait passer la croissance de la productivité du travail de 1 % à 1,8 % par an (Jaravel, 2023).

# ================= VEILLE DU MANUEL, 23/11/2026 (soir) : études des passages de veille ch. 8 et 9 =================
# Source : ~/Dropbox/Claude/travail-sur-le-manuel/notes/ch09/carnet.md et ch08/carnet.md (lignes « À intégrer » ou « À mentionner », chiffres lus dans la source).
# Relus à nouveau le 23/11 : DEPP 2026-E17, Synthèse DEPP n° 8, CAPES 2026 (maths, lettres classiques).
- id: depp-groupes-besoins-2026
  titre: "DEPP, document de travail 2026-E17 : les groupes de besoins en 6e et 5e n'ont pas d'effet mesurable"
  ref: "Bechichi, N., Charpentier, A., Cornetet, J., Dextre Polo, M., El Bah, S. (DEPP), Barone, C., Grenet, J., Gurgand, M., Guyon, N., Huillery, É., Souali, C. et Voisin, A. (2026), « Évaluation des organisations des enseignements de français et de mathématiques en sixième et cinquième. Premiers résultats pour l'année scolaire 2024-2025 », Document de travail DEPP n° 2026-E17, septembre 2026."
  lien: https://www.education.gouv.fr/sites/default/files/document/-valuation-des-organisations-des-enseignements-de-fran-ais-et-de-math-matiques-en-sixi-me-et-cinqui-me-520978.pdf
  sujets: [formation]
  type: étude causale
  statut: vérifié
  resume: "Première évaluation des groupes de français et de maths mis en place en 6e et 5e à la rentrée 2024 (« choc des savoirs »), sur un échantillon représentatif de 1 500 collèges publics. 94 % des collèges ont changé leur organisation, mais de façons très diverses : 21 % en groupes hétérogènes, 50 % en groupes selon le profil scolaire des élèves. Méthode : différences de différences sur les évaluations nationales de début de 4e, en comparant la première cohorte exposée aux cohortes précédentes et aux collèges sans regroupement. Résultat : aucun effet significatif en français ni en maths, quel que soit le type de groupe, y compris selon le niveau initial et le sexe des élèves. Les groupes ont pourtant réduit les effectifs presque partout, et une partie des collèges a supprimé de l'accompagnement personnalisé ou des options pour les financer. Les groupes étaient confiés aux professeurs du collège, constitués selon les besoins qu'ils identifiaient, sans formation supplémentaire prévue par la réforme. Ce résultat ne contredit pas la littérature, qui trouve des gains sous conditions : groupes temporaires et souples au sein de la classe (0,19 à 0,30 écart-type, Steenbergen-Hu et al., 2016), enseignants formés à adapter leur cours, mêmes programmes pour tous ; les classes séparées par niveau n'apportent presque rien (EEF, 2021). La réforme de 2024 imposait un modèle uniforme à tous les collèges. Limite : premiers résultats, sur une seule cohorte."
  cle: "Les groupes de besoins généralisés en 6e et 5e en 2024 n'ont eu aucun effet mesurable sur les résultats en français et en maths à l'entrée en 4e (DEPP, document de travail 2026-E17)."
- id: etat-ecole-2026
  titre: "DEPP, L'état de l'École 2026 : salaires et formation des professeurs, diplômes"
  ref: "DEPP (2026), L'état de l'École 2026, novembre 2026, fiches 12, 14, 15 et 35 à 37 (reprend OCDE, Regards sur l'éducation 2026, et TALIS 2024)."
  lien: https://www.education.gouv.fr/sites/default/files/document/l-tat-de-l-cole-2026-523020.pdf
  sujets: [formation]
  type: données
  statut: vérifié
  resume: "Recueil annuel d'indicateurs du ministère. Salaires (2024-2025) : un professeur des écoles en milieu de carrière gagne, en salaire statutaire et en parité de pouvoir d'achat, 81 % de la moyenne des pays de l'UE et 50 % du niveau allemand. Formation initiale (TALIS 2024) : 4 enseignants sur 10 dans le primaire et 5 sur 10 au collège la jugent de qualité, les parts les plus basses des pays enquêtés. Diplômes (2025) : 56 % des 25-34 ans sont diplômés du supérieur ; 7,2 % des 18-24 ans ont quitté l'école sans diplôme du second cycle ; environ 79 % d'une génération obtient le bac depuis 2022 ; 88 % des 25-34 ans ont au moins un diplôme du second cycle du secondaire, 2 points de plus que dans l'OCDE."
  cle: "Un professeur des écoles en milieu de carrière gagne 81 % de la moyenne de l'UE et la moitié du niveau allemand (DEPP, L'état de l'École 2026)."
- id: depp-dedoublement-2026
  titre: "DEPP, Synthèse n° 8 (2026) : les gains du dédoublement en REP+ ont disparu à l'entrée en 6e"
  ref: "Charpentier, A. (2026), « Réduction de la taille de classe en éducation prioritaire : que nous apprennent les données de la DEPP ? », Synthèse DEPP n° 8, février 2026 (résume El Bah, document de travail DEPP 2026.E01)."
  lien: https://www.education.gouv.fr/sites/default/files/document/r-duction-de-la-taille-de-classe-en-ducation-prioritaire-que-nous-apprennent-les-donn-es-de-la-depp--478949.pdf
  sujets: [inegalites]
  type: étude causale
  statut: vérifié
  resume: "Première évaluation de long terme du dédoublement des CP et CE1 en éducation prioritaire. La première cohorte (CP en REP+ en 2017-2018) est comparée aux élèves des écoles REP, en différences de différences. En fin de CE1, le gain était significatif : 16 % de l'écart initial avec les élèves hors éducation prioritaire en français, 38 % en maths. À l'entrée en 6e, il n'y a plus d'écart significatif, en français comme en maths. Seule exception : un effet positif en français dans les départements et régions d'outre-mer. Nuance la fiche du CAE (Note n° 84), qui classe le dédoublement parmi les politiques autofinancées à partir des gains de fin de CP."
  cle: "Les gains du dédoublement en REP+, nets en fin de CE1, ne se voient plus à l'entrée en 6e (DEPP, Synthèse n° 8, 2026)."
- id: ipp-taille-classes-2025
  titre: "IPP (2025) : utiliser la baisse du nombre d'élèves pour réduire la taille des classes"
  ref: "Charousset, P., Grenet, J., Guyon, N. et Souidi, Y. (2025), « Taille des classes et inégalités territoriales : quelle stratégie face à la baisse démographique ? », in IPP, Perspectives budgétaires, chapitre 4, juin 2025."
  lien: https://hal.science/hal-05458936v1/document
  sujets: [inegalites]
  type: rapport
  statut: vérifié
  resume: "Le chapitre chiffre deux usages de la baisse des effectifs du premier degré (-8 % entre 2015 et 2024, puis -19 % d'ici 2034). À taille de classe constante, environ 50 000 postes pourraient être supprimés d'ici 2034, soit 3,4 Md€ par an. Si l'on garde les enseignants, la taille moyenne des classes passe de 22,4 à 18,2 élèves (-19 %) ; les auteurs estiment le gain à 4,5 Md€ de salaires futurs et 2,9 Md€ de recettes fiscales, soit 9 € par euro net dépensé. Ils proposent un plafond de 12 élèves par classe en éducation prioritaire. Limite : le rendement s'appuie sur les effets de court terme de la taille des classes, que la DEPP ne retrouve pas à l'entrée en 6e pour le dédoublement."
  cle: "Garder les enseignants malgré la baisse du nombre d'élèves ramènerait les classes du primaire de 22,4 à 18,2 élèves d'ici 2034 (IPP, 2025)."
- id: senat-plf2027-enseignement
  titre: "Sénat, PLF 2027, mission Enseignement scolaire : combien de postes reprendre à la démographie ?"
  ref: "Paccaud, O. (2026), « PLF 2027, note de présentation, mission Enseignement scolaire », Sénat, commission des finances, octobre 2026."
  lien: https://www.senat.fr/fileadmin/cru-1792598966/Commissions/Finances/2026-2027/PLF_2027/NP/PLF_2027_NP_Enseignement_scolaire.pdf
  sujets: [inegalites]
  type: rapport
  statut: vérifié
  resume: "Note du rapporteur spécial du Sénat sur le budget de l'école pour 2027. Le nombre d'élèves baisserait de 1,515 million d'ici 2035 (-13,1 %). Le projet de loi de finances ne reprend que 3 644 emplois au titre de la démographie (1 588 nets), alors qu'une reprise stricte en donnerait 14 777 en 2027. Le rapporteur juge cela « peu ambitieux » et propose de reprendre environ 8 000 emplois pour financer la revalorisation des enseignants. Pour 2026, la commission avait déjà voté 4 000 suppressions de plus que les 4 018 prévues. Position concurrente de celle qui garde les postes pour réduire la taille des classes."
  cle: "Le budget 2027 reprend 3 644 postes à la baisse du nombre d'élèves ; une reprise stricte en donnerait 14 777 (Sénat, commission des finances, octobre 2026)."
- id: depp-ni-26-42-depense
  titre: "DEPP, Note d'information 26.42 : la dépense d'éducation en 2025"
  ref: "Bagot, M., Dutey, P., de Fornel, F., Liogier, V. et Rousseau, A. (2026), « En 2025, 199,2 milliards d'euros consacrés à l'éducation, soit 6,7 % du PIB », Note d'information DEPP n° 26.42, septembre 2026."

- id: lemonde-hs-2026-handicap
  titre: "Le Monde, hors-série, « Handicap : la bataille de l'égalité » (novembre-décembre 2026)"
  ref: "Durand, A.-A. (2026), « Handicap : la bataille de l'égalité », Le Monde, hors-série « Les enjeux du prochain quinquennat », novembre-décembre 2026, p. 78-79."
  lien: ""
  sujets: [inclusion]
  type: revue
  statut: secondaire
  resume: "Vingt ans après la loi de 2005, le bilan est mitigé : la scolarisation en classe ordinaire et l'accessibilité ont progressé, mais l'accès aux droits dépend beaucoup du département. Les MDPH, par lesquelles passent six millions de personnes, instruisent un dossier en deux à quinze mois selon le territoire. Un rapport IGAS-IGF de 2025 trouvait des taux d'allocataires de l'AAH allant du simple au sextuple et des montants de PCH variant de 1 à 3,85 ; l'article relie ces écarts à la démographie, à l'implantation ancienne d'établissements spécialisés à la campagne et aux habitudes de chaque MDPH. À l'école, il manquait environ 50 000 accompagnants à la rentrée 2025 et un enfant notifié sur sept attendait encore le sien en octobre. Bâtiments publics, transports et démarches en ligne restent inégalement accessibles. La Conférence nationale du handicap de septembre 2026 a lancé une redéfinition du handicap et confié à la CNSA l'harmonisation des pratiques des MDPH. Chiffres repris de la DREES, de la DEPP, de l'Agefiph, de la CNSA, du Cerema et de la SNCF."
  sections:
    - "Effectif : de 5,7 à 18,2 millions de personnes handicapées selon la définition retenue (2022, producteur non précisé)."
    - "Prévalence : 8 % des 15-64 ans vivant à domicile ont au moins une limitation sévère, de 5,1 % à 11,4 % selon le département (2021, DREES)."
    - "Pauvreté : 25,6 % des 15-64 ans à fortes limitations fonctionnelles sont pauvres, contre 14,4 % des personnes non handicapées (2021, DREES)."
    - "Emploi : 41 % des personnes reconnues handicapées sont en emploi, contre 69 % de l'ensemble de la population (2025, Agefiph, d'après l'enquête Emploi de l'Insee)."
    - "École : 246 200 élèves handicapés en classe ordinaire dans le premier degré et 249 700 dans le second degré en 2024, contre 111 100 et 44 300 en 2006 ; 78 200 en établissement hospitalier ou médico-social (DEPP)."
    - "Accompagnants : 53 000 AESH en 2017 et 140 000 en 2025 (ministère de l'Éducation nationale ; le Cnesco donne environ 43 000 pour 2017) ; environ 50 000 manquants à la rentrée 2025 ; 48 726 enfants sur 352 102 ayant droit encore sans accompagnant en octobre 2025 ; 20 000 élèves en attente d'une place médico-sociale (2025)."
    - "MDPH : délai moyen de traitement de 4,5 mois en 2025, de 2 à 15 mois selon le département, pour un délai réglementaire de 4 mois (CNSA)."
    - "Écarts territoriaux : taux d'allocataires de l'AAH jusqu'à 6,5 fois plus élevé d'un département à l'autre ; montants de PCH de 1 à 3,85 (rapport IGAS-IGF, 2025)."
    - "Accessibilité : 99,5 % des agences France Travail, 66 % des tribunaux et 35 % des commissariats (avril 2026, producteur non précisé) ; 12 % des démarches en ligne essentielles pleinement accessibles (août 2026) ; 575 gares accessibles sur environ 3 000 (SNCF) ; 44 % des arrêts de cars interurbains sur 108 257 recensés (Cerema, 2025)."
  cle: "Les MDPH mettent de 2 à 15 mois à traiter un dossier selon le département, pour 4 mois réglementaires (CNSA, 2025, repris par Le Monde, hors-série, nov.-déc. 2026)."
  propositions: []
  dossier: ""

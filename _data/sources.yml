  dossier: 07-outil-ia-public
- id: nickow-2020
  titre: "Nickow, Oreopoulos et Quan (2020, 2024), méta-analyse du tutorat"
  ref: "Nickow, A., P. Oreopoulos et V. Quan (2020), NBER WP 27476 ; publié dans l'American Educational Research Journal (2024)."
  lien: https://www.nber.org/papers/w27476
  sujets: [formation, ecrans]
  type: méta-analyse
  statut: vérifié
  resume: "96 essais randomisés, 732 estimations. Le tutorat améliore les résultats de 0,37 écart-type en moyenne (0,29 sur 89 essais dans la version publiée). L'effet est plus fort pendant le temps scolaire (0,40) qu'après (0,21), avec des enseignants (0,50) qu'avec des bénévoles (0,21). Seules 7 % des interventions concernent le collège ou au-delà, où l'effet est plus faible (0,16)."
  cle: "Le tutorat améliore les résultats de 0,37 écart-type, davantage pendant le temps scolaire (0,40) qu'après (0,21) (Nickow, Oreopoulos et Quan, 2020)."
  propositions: [heures-emploi-du-temps]
  dossier: 02-groupes-niveau-tutorat
- id: kraft-2024
  titre: "Kraft, Schueler et Falken (2024), le tutorat à grande échelle"
  ref: "Kraft, M., B. Schueler et G. Falken (2024), EdWorkingPaper 24-1031."
  lien: ""
  sujets: [formation]
  type: méta-analyse
  statut: vérifié
  resume: "Dans les essais les plus proches d'un déploiement à grande échelle, les effets du tutorat n'atteignent qu'un tiers à la moitié de ceux de l'ensemble des 282 essais, surtout parce qu'ils baissent quand le programme grandit, et l'effet est plus faible au collège et au lycée."
  cle: "Dans les essais proches d'un déploiement à grande échelle, l'effet du tutorat n'atteint qu'un tiers à la moitié de celui de l'ensemble des essais (Kraft, Schueler et Falken, 2024)."
  propositions: [heures-emploi-du-temps]
  dossier: 02-groupes-niveau-tutorat
- id: guryan-2023
  titre: "Guryan et al. (2023), le tutorat intensif à Chicago"
  ref: "Guryan, J. et al. (2023), « Not Too Late », American Economic Review 113(3), 738-765."
  lien: https://voices.uchicago.edu/jensludwig/files/2023/03/Not-too-late-AER-2023.pdf
  sujets: [formation]
  type: étude causale
  statut: vérifié
  resume: "Lycéens de 9e et 10e année à Chicago : 45 à 50 minutes par jour en binôme avec un tuteur payé, pendant l'emploi du temps. Maths +0,18 à 0,40 écart-type pour les participants ; coût de 3 500 à 4 300 dollars par élève et par an. Le meilleur exemple d'un tutorat qui marche au lycée, intégré à l'emploi du temps."
  cle: "Un tutorat quotidien en binôme pendant les cours a fait gagner 0,18 à 0,40 écart-type en maths à des lycéens de Chicago (Guryan et al., 2023)."
  propositions: [heures-emploi-du-temps]
  dossier: 02-groupes-niveau-tutorat
- id: ntp-nfer
  titre: "NFER, évaluation du programme national de tutorat anglais (2023, 2024)"
  ref: "NFER (2023, 2024), National Tutoring Programme, Year 2 and Year 3 impact evaluations."
  lien: https://www.nfer.ac.uk/publications/national-tutoring-programme-year-3-impact-evaluation/
  sujets: [formation]
  type: étude causale
  statut: vérifié
  resume: "Le tutorat organisé par les écoles gagne environ un mois de progrès en maths en primaire et au collège, moins d'un mois en anglais ; les prestataires extérieurs et les mentors n'apportent aucun gain. Plus d'heures donnent de meilleurs résultats, avec un optimum au-delà de 20 heures par élève. Moins de la moitié des élèves tutorés étaient défavorisés."
  cle: "Le programme national de tutorat anglais a gagné au plus un mois de progrès (NFER, 2024)."
  propositions: [heures-dotation]
  dossier: 02-groupes-niveau-tutorat
- id: apfee
  titre: "Goux, Gurgand et Maurin, « Coup de pouce » en CP (essai randomisé 2010-2013)"
  ref: "Goux, D., M. Gurgand et É. Maurin, évaluation du dispositif APFEE, J-PAL."
  lien: https://www.povertyactionlab.org/fr/evaluation/accompagnement-intensif-pour-favoriser-legalite-des-chances-lecole-en-france-apfee
  sujets: [formation]
  type: étude causale
  statut: vérifié
  resume: "Environ 5 100 élèves de CP dans 109 écoles (Créteil, Lille, Versailles), groupes de 5, quatre séances d'1 h 30 par semaine après la classe. Aucun gain en lecture ni en maths ; plus de goût pour la lecture, pendant deux ans. Un tutorat après la classe, par d'autres que les enseignants, ne suffit pas."
  cle: "Le « Coup de pouce » après la classe en CP n'a amélioré ni la lecture ni les maths (Goux, Gurgand et Maurin, essai randomisé)."
  propositions: [heures-emploi-du-temps]
  dossier: 02-groupes-niveau-tutorat
- id: eef-setting
  titre: "EEF, groupes de niveau par classe (setting and streaming)"
  ref: "Education Endowment Foundation, Teaching and Learning Toolkit, Setting and streaming (mise à jour juillet 2021)."
  lien: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/setting-and-streaming
  sujets: [formation]
  type: méta-analyse
  statut: vérifié
  resume: "Synthèse de 58 études : séparer les élèves en classes de niveau apporte 0 mois de progrès en moyenne, -3 mois pour les élèves faibles et +1 pour les forts ; preuves « très limitées ». Les groupes de niveau au sein de la classe apportent environ +3 mois. L'essai britannique Best Practice in Setting (127 écoles) ne trouve aucun effet."
  cle: "Les classes de niveau n'apportent rien en moyenne et font perdre 3 mois aux élèves faibles (EEF, 2021, 58 études)."
  propositions: [heures-emploi-du-temps]
  dossier: 02-groupes-niveau-tutorat
- id: steenbergen-2016
  titre: "Steenbergen-Hu, Makel et Olszewski-Kubilius (2016), méta-analyse des groupes de niveau"
  ref: "Steenbergen-Hu, S., M. Makel et P. Olszewski-Kubilius (2016), Review of Educational Research 86, 849-899."
  lien: ""
  sujets: [formation]
  type: méta-analyse
  statut: vérifié
  resume: "Méta-analyse de second ordre : 13 méta-analyses, 172 études. Les classes séparées par niveau gagnent 0,04 à 0,06 écart-type (presque rien) ; les groupes de niveau au sein de la classe 0,19 à 0,30 ; le regroupement par matière entre niveaux 0,26. Les effets ne diffèrent pas entre élèves forts, moyens et faibles. Terrin et Triventi (2023) montrent que les classes de niveau creusent les écarts."
  cle: "Les groupes de niveau au sein de la classe gagnent 0,19 à 0,30 écart-type, les classes de niveau presque rien (Steenbergen-Hu et al., 2016)."
  propositions: [heures-emploi-du-temps]
  dossier: 02-groupes-niveau-tutorat
- id: duflo-2011
  titre: "Duflo, Dupas et Kremer (2011), groupes de niveau au Kenya"
  ref: "Duflo, E., P. Dupas et M. Kremer (2011), American Economic Review 101(5), 1739-1774."
  lien: ""
  sujets: [formation]
  type: étude causale
  statut: vérifié
  resume: "Essai randomisé dans 121 écoles kényanes (première année) : les écoles qui répartissent les élèves par niveau gagnent 0,14 écart-type après 18 mois, encore visible un an après. Tous les élèves en profitent, car l'enseignant adapte son cours au niveau du groupe. Pays à bas revenu, à transposer avec prudence."
  cle: "Répartir les élèves par niveau a fait gagner 0,14 écart-type à tous les élèves au Kenya (Duflo, Dupas et Kremer, 2011)."
  propositions: []
  dossier: 02-groupes-niveau-tutorat
- id: stpcd-2026

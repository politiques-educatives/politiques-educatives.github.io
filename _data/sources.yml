- id: cdc-inspecteurs-2022
  titre: "Cour des comptes, référé sur les inspecteurs territoriaux (2022)"
  ref: "Cour des comptes (2022), Les inspecteurs territoriaux des 1er et 2nd degrés de l'Éducation nationale, référé publié le 3 mai 2022."
  lien: ""
  sujets: [formation]
  type: rapport
  statut: secondaire
  resume: "Environ 3 650 inspecteurs territoriaux, dont l'activité est « de plus en plus morcelée », au détriment du suivi des enseignants et de l'appui pédagogique. Ils consacrent environ 30 % de leur activité à l'évaluation des enseignants dans le premier degré, 20 à 30 % dans le second. Depuis 2017, un enseignant n'a plus d'inspection obligatoire après son troisième rendez-vous de carrière, vers la dix-neuvième année."
  cle: "Après le dernier rendez-vous de carrière, vers 19 ans de métier, aucune visite de classe n'est obligatoire (décret de 2017 ; Cour des comptes, 2022)."
  propositions: [gouv-visite]

- id: tutor-copilot-2024
  titre: "Wang et al. (2024), Tutor CoPilot : l'IA qui aide les tuteurs humains"
  ref: "Wang, R. et al. (2024), Tutor CoPilot, arXiv 2410.03017."
  lien: https://arxiv.org/abs/2410.03017
  sujets: [ecrans]
  type: étude causale
  statut: vérifié
  resume: "Essai randomisé aux États-Unis, 900 tuteurs humains et 1 800 élèves de milieux défavorisés : l'IA suggère des relances au tuteur, pas à l'élève. Maîtrise des notions +4 points, +9 points pour les élèves des tuteurs les moins bien notés, pour environ 20 dollars par tuteur et par an ; les tuteurs donnent moins de réponses et posent plus de questions."
  cle: "Une IA qui conseille les tuteurs humains a relevé de 9 points la maîtrise des élèves des tuteurs les moins bien notés, pour 20 dollars par tuteur et par an (Wang et al., 2024)."
  propositions: [tuteur-public]
  dossier: 07-outil-ia-public
- id: mia-seconde
  titre: "MIA Seconde : un marché public d'IA éducative sans résultats publiés"
  ref: "Next (2024) ; marché du ministère de l'Éducation nationale, août 2022."
  lien: ""
  sujets: [ecrans]
  type: texte officiel
  statut: secondaire
  resume: "Exercices adaptatifs en maths et en français pour la seconde, positionnés sur les tests d'entrée de la DEPP. Marché signé en août 2022 après un appel à projets de 2021, environ 2,8 M€ sur 36 mois, renouvelable. Livré avec un an de retard, sans résultats publiés. Mathia, assistant vocal de maths en cycle 2, n'a jamais été évalué publiquement."
  cle: "MIA Seconde, commandé en 2022 pour 2,8 M€ sur trois ans, a été livré avec un an de retard, sans résultats publiés (Next, 2024)."
  propositions: [tuteur-marche]
  dossier: 07-outil-ia-public

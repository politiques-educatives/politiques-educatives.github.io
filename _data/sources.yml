    - "Allocation de formation pendant les vacances : 120 € par jour, 5 jours par an au plus ; 2 261 bénéficiaires en 2021-2022 pour moins de 1 M€."
    - "Le remplacement de 5 jours de formation obligatoire coûterait un demi-milliard d'euros (septembre 2023)."
  cle: "Un enseignant suit 1,5 à 2 jours de formation par an, contre 9,2 pour les autres cadres A de l'État (Cour des comptes, 2023)."

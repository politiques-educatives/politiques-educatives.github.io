  resume: "Essai randomisé en Allemagne : un programme de mentorat associe des collégiens de milieu modeste à un étudiant. Chez les élèves défavorisés, il améliore de plus d'un demi-écart-type (0,56) un indice combinant notes en maths, patience et compétences sociales, et orientation vers l'emploi, mesuré un an après le début ; les effets sur les notes et l'orientation persistent trois ans après. Aucun effet chez les élèves plus favorisés. Résumé de l'article lu le 23/11/2026 ; durée du mentorat (un à deux ans) à vérifier dans l'article."

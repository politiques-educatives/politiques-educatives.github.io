    - "Notifications : 336 732 élèves notifiés par une MDPH en 2024, soit 65 % des élèves handicapés scolarisés ; 9 % des élèves en attente d'une aide au 31 mars 2025 (+1 point en un an)."
  cle: "Le budget de l'école inclusive atteint 4,74 Md€ en 2026 pour 139 993 AESH (Sénat, avis PLF 2026)."
  propositions: []

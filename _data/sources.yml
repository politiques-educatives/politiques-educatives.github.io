# Base de preuves du GT Éducation : une entrée par source (étude, rapport, données).
# Tirée des dossiers de recherche (research/*.md) et des notes. Résumés détaillés : ce qui est étudié, données, méthode,
# chiffres avec point de comparaison, limites. statut : vérifié (lu dans la source) | secondaire (repris d'une source
# fiable sans lecture de l'original) | non vérifié. sujets : inclusion | ecrans | emploi | orientation | formation.
# type : rapport | étude causale | méta-analyse | données | enquête | texte officiel | revue
# cle : la citation courte à copier (chiffre clé + source). dossier : page /recherche/<slug>/ d'où vient l'entrée.


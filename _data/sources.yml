  resume: "879 000 contrats d'apprentissage en 2024, contre 306 000 en 2017. Coût public en 2023 : environ 15 Md€, soit 14 700 € par apprenti (périmètre plus étroit que les 24,1 Md€ de l'OFCE). Au niveau CAP, 63 % des apprentis sortis en 2021 sont en emploi 18 mois après, contre 36 % des élèves sortis de la voie scolaire ; l'avantage se réduit nettement au niveau master. Limite : comparaison descriptive, pas un effet causal."

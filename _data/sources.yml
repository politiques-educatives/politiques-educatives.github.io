  titre: "Palladino, Bergeaud, Bertheau, Bunel et Degos (2026), l'IA et l'embauche des jeunes en France"
  ref: "Palladino, Bergeaud, Bertheau, Bunel et Degos (2026), LIFT WP 2026-02, HEC Paris et Banque de France."
  lien: https://heclift.github.io/website/files/papers/LIFT_WP_2026-02.pdf
  sujets: [emploi]
  type: étude causale
  statut: vérifié
  resume: "Données administratives françaises sur les embauches. Entre novembre 2022 et mars 2026, les embauches en CDI des 21-29 ans reculent de 28,3 % dans le cinquième des métiers les plus exposés à l'IA, contre 7,5 % dans le cinquième le moins exposé, sans vague de licenciements. Le télétravail et le resserrement monétaire ont pu jouer sur les mêmes métiers. Les utilisatrices intensives d'IA générative embauchent moins de jeunes en CDI depuis 2023 (résultat descriptif selon les auteurs)."
  cle: "Les embauches en CDI des 21-29 ans ont baissé de 28,3 % dans les métiers les plus exposés à l'IA, contre 7,5 % dans les moins exposés (LIFT, 2026)."
  propositions: [ia-observatoire, orient-debouches]
  dossier: 06-index-ia-formations
- id: canaries-2025
  titre: "Brynjolfsson, Chandar et Chen (2025), « Canaries in the Coal Mine? »"
  ref: "Brynjolfsson, E., B. Chandar et R. Chen (2025), Canaries in the Coal Mine?, Stanford Digital Economy Lab, août 2025."
  lien: ""
  sujets: [emploi]
  type: étude causale
  statut: vérifié
  resume: "Données de paie d'ADP, premier gestionnaire de paie américain. Les 22-25 ans des métiers les plus exposés à l'IA perdent 13 % d'emploi relatif, à chocs d'entreprise contrôlés ; les travailleurs plus âgés des mêmes métiers sont stables ou en hausse."
  cle: "Les 22-25 ans des métiers les plus exposés à l'IA ont perdu 13 % d'emploi relatif aux États-Unis (Brynjolfsson, Chandar et Chen, 2025)."
  propositions: [ia-observatoire]
  dossier: 06-index-ia-formations
- id: humlum-2025
  titre: "Humlum et Vestergaard (2025), effets limités des modèles de langage au Danemark"
  ref: "Humlum, A. et E. Vestergaard (2025), Large Language Models, Small Labor Market Effects, BFI WP 2025-56 / NBER w33777."
  lien: ""
  sujets: [emploi]
  type: étude causale
  statut: vérifié
  resume: "Deux enquêtes d'adoption (2023, 2024) auprès de 25 000 travailleurs et 7 000 établissements de 11 métiers exposés, appariées aux registres danois. Aucun effet sur les salaires ni les heures ; les intervalles de confiance excluent des effets supérieurs à 1 %. Contrepoint utile aux études américaines sur les débutants."
  cle: "Au Danemark, l'adoption des modèles de langage n'a eu aucun effet mesurable sur les salaires ni les heures (Humlum et Vestergaard, 2025)."
  propositions: []

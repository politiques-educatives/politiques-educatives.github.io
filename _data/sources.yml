  resume: "La dépense intérieure d'éducation atteint 199,2 Md€ en 2025, 6,7 % du PIB, +0,1 % en euros constants sur un an. Par élève, comparée à la moyenne de l'OCDE (données 2023) : -9,7 % dans l'élémentaire, -3,8 % au collège, +27,7 % au lycée, +4,5 % tous niveaux confondus. La France dépense donc moins que ses voisins là où se forment les bases, et plus au lycée."
  cle: "La France dépense 9,7 % de moins par élève que la moyenne de l'OCDE à l'école élémentaire, et 27,7 % de plus au lycée (DEPP, NI 26.42, 2026)."
- id: depp-6e-2025
  titre: "DEPP, Note d'information 26.21 : évaluations de début de 6e, 5e et 4e en 2025"
  ref: "Euzeby, F., Jabri, I., Lacroix, A., Valdenaire, M. et al. (2026), « Évaluations exhaustives de début de sixième, de cinquième et de quatrième 2025 », Note d'information DEPP n° 26.21, juin 2026."
  lien: https://www.education.gouv.fr/sites/default/files/document/depp-ni-2026-21evals-2dpdf-517319.pdf

- id: henkel-2024
  titre: "Henkel et al. (2024), le tuteur Rori sur WhatsApp au Ghana"
  ref: "Henkel, O. et al. (2024), arXiv 2402.09809."
  lien: https://arxiv.org/abs/2402.09809
  sujets: [ecrans]
  type: étude causale
  statut: vérifié
  resume: "Environ 1 000 élèves de la 3e à la 9e année dans 11 écoles ghanéennes, affectation par école : un tuteur de maths sur téléphone, deux séances de 30 minutes par semaine pendant 8 mois. Effet de 0,37 écart-type la première année. Limite : peu d'écoles, donc incertitude."
  cle: "Un tuteur de maths sur téléphone a fait gagner 0,37 écart-type au Ghana (Henkel et al., 2024)."
  propositions: [tuteur-public]

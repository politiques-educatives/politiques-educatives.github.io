  cle: "Le Contrat d'engagement jeune fait à peu près aussi bien que la Garantie jeunes sur l'emploi, pour un coût un peu plus faible (IPP, Rapport n° 63, 2026)."
- id: tresor-apprentissage-2025
  titre: "Trésor-Éco n° 376 (2025) : le bilan de l'apprentissage en France"

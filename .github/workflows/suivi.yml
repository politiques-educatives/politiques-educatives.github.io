# Actualise chaque jour le « Suivi en direct : l'IA et l'emploi des jeunes » (section Orientation et emploi > L'IA et l'emploi
# des débutants) : chômage des moins de 25 ans (Insee) et offres d'emploi en IA (LIFT, HEC Paris), par scripts/build_suivi.py.
# Commit seulement si les chiffres changent (la date de lecture seule ne compte pas).
name: Suivi en direct
on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: suivi
jobs:
  suivi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build_suivi.py
      - name: Commit if the figures changed
        run: |
          git config user.name "politiques-educatives-bot"; git config user.email "actions@users.noreply.github.com"
          git add _data/suivi.json
          if git diff --cached --quiet -I'lu_le' -- _data/suivi.json ; then echo "chiffres inchangés"; exit 0; fi
          git commit -m "Suivi en direct : chiffres actualisés $(date -u +%F) [skip ci]" && git pull --rebase && git push
